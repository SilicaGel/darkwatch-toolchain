name: Label merged issues for QA

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  label-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Add 'status/qa' label to referenced issues
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          # Match both `Ready #N` (new convention — avoids Forgejo auto-close)
          # and `Closes #N` (legacy, in case older PRs still use it).
          ISSUES=$(echo "$PR_BODY" | grep -oiE '(Ready|Closes) #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
          echo "$ISSUES" | grep -v '^$' | while read issue; do
            curl -s -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw '{"labels":[38]}' \
              "$API_URL/repos/$REPO/issues/$issue/labels" \
              > /dev/null
            echo "Labelled #$issue with status/qa"
          done
