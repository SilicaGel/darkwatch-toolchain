name: Label merged issues for QA

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  label-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5  # #1263 — shell + curl only; ~<1 min typical
    steps:
      - name: Add 'status/qa' label to referenced issues
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          # Only `Ready #N` (preferred — avoids Forgejo auto-close) and the
          # legacy `Closes #N` mean "this PR resolves #N → move to QA". `Refs #N`
          # is a *related* pointer (the PR mentions/builds-on #N but does NOT
          # resolve it), so it must NOT trigger status/qa — doing so wrongly
          # queued referenced-but-unresolved issues for QA (#1270; e.g. #1272's
          # "Refs #1270" mislabelled #1270).
          ISSUES=$(echo "$PR_BODY" | grep -oiE '(Ready|Closes) #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
          if [ -z "$ISSUES" ]; then
            echo "No Ready/Closes references found in PR body — nothing to label."
            exit 0
          fi
          echo "$ISSUES" | while read issue; do
            curl -s -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw '{"labels":[38]}' \
              "$API_URL/repos/$REPO/issues/$issue/labels" \
              > /dev/null
            echo "Labelled #$issue with status/qa"
          done
