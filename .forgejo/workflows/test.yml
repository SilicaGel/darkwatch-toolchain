name: Test suite

# #2336 — the unit + integration suite, extracted from ci.yml so more than one
# workflow can call it. Two callers today:
#
#   ci.yml             — per PR and per push to main (gated by tree-gate)
#   nightly-deploy.yml — once a day, and it BLOCKS the deploy
#
# The nightly call is the point. The push-to-main tree gate skips this suite
# when the merge tree is byte-identical to an already-green PR head, which
# trades away a second sample of a suite that is NOT a deterministic function
# of the tree: these are int tests against a real DB, `rollLog last_roll_at` is
# documented flaking under CI load, and #1798 is a suspected placement-vs-walls
# race that was green on a PR and red on the identical-tree main push.
#
# The nightly run replaces that per-merge duplicate with one run per day
# against main — a better race detector, because it varies time, load and DB
# state instead of re-running the same bytes minutes later. Before this, the
# nightly ran only e2e-full + smoke-walk, so the unit/int suite had NO nightly
# backstop at all.
#
# It gates the deploy for the same reason e2e-full does: better a blocked
# deploy than shipping something broken in a way nobody looked for.

on:
  workflow_call:
    inputs:
      # #1620 — the tree-gate decision arrives as an INPUT, not as an `if:` on
      # the calling `uses:` job. Forgejo mishandles `if:` on a reusable-workflow
      # call: it evaluates the expression at PLAN time, before `needs` results
      # exist, and bakes the result in. On PR #2351 that produced a stored job
      # payload of `if: false` + `runs-on: []` and a 0-second failure with no
      # log at all. Gate INSIDE the callee instead, where it is an ordinary
      # job-level `if:` that behaves normally.
      skip:
        description: "tree-gate's decision; 'true' skips the suite"
        type: string
        required: false
        default: "false"
      # #2409 — the nightly gate must test the SAME ref the deploy ships.
      # Empty is deliberate: actions/checkout reads an empty `ref` as "this
      # event's default", so PR / push / dispatch runs are unaffected.
      ref:
        description: "git ref to test; empty = this event's default"
        type: string
        required: false
        default: ""
      # #2357/#2438 — WHO IS ALLOWED TO RAISE THE ALARM, decided by the CALLER.
      #
      # The notifier used to answer "is this not a PR?" by testing for the PR
      # payload. Two things were wrong with that. It did not work: the guard
      # fired on PR #2447's red anyway (#2448), which is the recurrence #2357
      # predicted after #2356's truthiness rewrite — the payload is simply not
      # visible in the callee's `notify-failure` context. And it was the wrong
      # question: a `workflow_dispatch` on a feature branch has no PR payload
      # either, so proving a CI change per #842 — which this repo REQUIRES —
      # tripped the alarm every time (#2436/#2438).
      #
      # The property the marker actually claims is "this run represents main".
      # Only the caller knows that, and in the caller `github.*` is native
      # rather than whatever workflow_call does to it. So the caller says so:
      #   none   — a PR, or a branch: stay silent, the run shows its own red
      #   main   — a push to main, or a dispatch against main: file/comment
      #   deploy — the nightly deploy gate: file/comment AND say so
      # Only `deploy` may claim the deploy was blocked; only main/deploy may
      # print a commits-on-main list (the nightly tests a tag cut from main).
      red_alert:
        description: "none | main | deploy — who may raise the rolling marker"
        type: string
        required: false
        default: "none"
  workflow_dispatch:
    inputs:
      # Deliberately EMPTY here, not "none": empty means "no caller told me", and
      # the job below falls back to this run's own `github.ref`. That fallback is
      # only ever reached on a direct dispatch, where there is no workflow_call
      # and `github.*` is this run's own context — never the callee muddle that
      # broke the old guard. Set it explicitly to force a leg during a prove run.
      red_alert:
        description: "none | main | deploy; empty = decide from this run's ref"
        required: false
        default: ""
      # #2409 — mirrored from workflow_call so a dispatch can PROVE the ref
      # actually reaches the checkout. Without it `inputs.ref` is undefined on a
      # dispatch and checkout silently falls back to the branch — which is
      # exactly what run 9801 did, making that proof run worthless.
      ref:
        description: "git ref to test (e.g. v0.198.0); empty = default"
        required: false
        default: ""

jobs:
  test:
    # #2368 — deliberately NO job-level `if:`. A skipped callee job makes the
    # caller's expanded placeholder report FAILURE (measured on Forgejo 15.0.0:
    # probe run 9785 — placeholder=failure, downstream skipped), which is what
    # reddened run 9347 and false-fired notify-main-red. This job always RUNS
    # and succeeds; the skip is applied per-step below, so the placeholder and
    # anything gated behind it stay green (probe run 9786 proved that shape).
    runs-on: ubuntu-latest
    # #2308 — see the full note on `lint-typecheck`. Must never skip on a PR.
    timeout-minutes: 18 # #1355 — healthy ~4-9 min (worst legit ~14); trimmed from 25 (#1263) to backstop a hang below the ~20-min OOM-runaway range
    services:
      mariadb:
        image: mariadb:11@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
        env:
          # CI DB credentials come from Forgejo repo secrets (Settings → Secrets).
          # Required: CI_DB_ROOT_PASSWORD, CI_DB_NAME, CI_DB_USER, CI_DB_PASSWORD.
          # See .forgejo/workflows/README.md for details.
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=512m
      minio:
        # The image needs `server /data` as its command; Forgejo's act_runner
        # supports `cmd:` in service definitions. The image-library int tests
        # create + drop a per-suite bucket against this instance.
        #
        # #2684 — was `minio/minio:...@sha256:8834ae47…` on Docker Hub. MinIO
        # archived its OSS projects and withdrew that repository: the registry
        # now returns 401 where library/alpine and library/mariadb return 200.
        # act_runner pulls a SERVICE image regardless of any local cache, so
        # this one line took down `CI / test` — the gate on every merge — from
        # 2026-09-11 until this change, with:
        #   Error response from daemon: pull access denied for minio/minio,
        #   repository does not exist or may require 'docker login'
        # A local mirror could not have fixed it: every copy we still held was
        # arm64, and the amd64 image the runners need was already gone.
        #
        # This is our own build of the SAME upstream release, from the GitHub
        # release binary, in .forgejo/minio-image/Dockerfile — not a version
        # bump. Multi-arch (linux/amd64 + linux/arm64), verified executing on
        # both. Digest-pinned to the manifest list our registry actually
        # serves, read back from forge.example.com rather than copied from
        # the push output.
        image: forge.example.com/aaron/darkwatch-minio:RELEASE.2025-04-08T15-41-24Z@sha256:959aa464e3b24abdb400348ca32e8521d8e95a9cb2fbe105efdaca220928d694
        cmd:
          - server
          - /data
          - --console-address
          - ":9001"
        env:
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
        options: >-
          --health-cmd="curl -fsS http://localhost:9000/minio/health/ready || exit 1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      # #2351 — permanent one-liner, not debug leftovers: under workflow_call
      # this Forgejo hands the CALLEE `event_name=workflow_call` — NEVER the
      # caller's event (measured on PR #2351: `event_name=workflow_call
      # ref=refs/pull/2351/head base_ref=main pr_number=2351`). Any event_name
      # string-match in this file is therefore dead or inverted; conditions
      # key on event DATA (`github.event.pull_request.number`, `github.ref`),
      # which DOES propagate — via TRUTHINESS, never `== null`/`!= null`
      # (a missing field coerces to '', which null-compares the wrong way). This echo is the record of what a given call
      # actually saw when the next context surprise lands.
      - name: Log callee github context
        # Deliberately UNGUARDED (#2368): on a skipped run this is the only
        # step that executes, so it is the evidence that the job took the
        # no-op path and succeeded rather than being skipped outright.
        run: |
          echo "event_name=${{ github.event_name }} ref=${{ github.ref }} base_ref=${{ github.base_ref }} pr_number=${{ github.event.pull_request.number }} repo=${{ github.repository }}"
          echo "[tree-gate] skip=${{ inputs.skip }} -> $([ '${{ inputs.skip }}' = 'true' ] && echo 'NO-OP: every step below is guarded off' || echo 'RUNNING the full suite')"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: ${{ inputs.skip != 'true' }}
        with:
          ref: ${{ inputs.ref }}
          # The diff-coverage comment needs history to diff against the base ref.
          fetch-depth: 0
          # #2315 — skip the 21M of Playwright visual baselines. This job runs
          # vitest (server unit + integration, client unit) and the coverage-bot
          # script tests; nothing here reads the snapshot PNGs. Only
          # visual-regression.yml's `visual` job does.
          #
          # `filter` alone is a NO-OP with a full working tree (#2338) — the sparse
          # list is what stops the lazy re-fetch of tip blobs. And cone-mode MUST be
          # off: cone mode rejects `!` patterns outright (`fatal: specify directories
          # rather than patterns`) and leaves the full tree, so this would silently be
          # a no-op with it on.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/e2e/visual-regression.spec.ts-snapshots

      - name: Setup Node.js
        if: ${{ inputs.skip != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json

      # #2496 — can this diff affect runtime at all? A documentation-only PR has
      # nothing for vitest to run, and paid ~10.4m for it.
      #
      # ⚠️ This deliberately gates STEPS, never this job. tree-gate-core.mjs's
      # REQUIRED_CONTEXTS invariant says `CI / test (pull_request)` must stay
      # unconditional: Forgejo posts `success` for a SKIPPED job, and the
      # push-to-main tree gate reads that status as proof the PR run was green.
      # A job-level `if:` here would let a misclassified PR merge on a context
      # that never ran AND then skip the main run too — no coverage anywhere.
      #
      # Fail-open is structural: if this step crashes or sets nothing, the output
      # is empty, `!= 'true'` holds, and every step below runs.
      - name: Decide whether this diff can affect runtime (#2496)
        id: cheap
        if: ${{ inputs.skip != 'true' }}
        env:
          # #2496 — PR-ness must come from the PAYLOAD, not from event_name: in a
          # workflow_call callee `github.event_name` is literally `workflow_call`,
          # so the first version of this step read "not a pull request" and was
          # dead here while `smoke` worked on the same commit. Same lesson the
          # coverage step below records for #2351.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.base_ref || 'main' }}
          GATE_LABEL: test
        run: |
          git fetch origin "${BASE_REF:-main}" --quiet || true
          node scripts/ci/docs-only.mjs

      - name: Install root devDependencies (c8 — coverage-bot scripts)
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        run: |
          cd server && npm ci --no-audit --no-fund
          ROLLDOWN_ARCH=$(node -p "process.arch")
          if [ ! -d "node_modules/@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu" ]; then
            VER=$(node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(l.packages['node_modules/@rolldown/binding-linux-'+process.arch+'-gnu'].version)")
            echo "Patching missing rolldown linux-${ROLLDOWN_ARCH} binding @ $VER"
            npm install --no-save --ignore-engines "@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu@$VER"
          fi

      - name: Install client dependencies
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        run: cd client && npm ci --no-audit --no-fund

      - name: Test server (unit)
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        # Always emit coverage — PR uses it for the diff-coverage comment;
        # main uses it to write the server-coverage badge.
        run: cd server && npm run test:coverage

      - name: Wait for MariaDB
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Wait for MinIO (image-library int tests need it)
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/minio/9000) 2>/dev/null && echo "MinIO is ready" && break
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MinIO never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Verify Kysely schema types are up-to-date
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        env:
          DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@mariadb:3306/${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:verify

      - name: Seed core + shadowdark content (int tests assume seeded DB)
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run seed:core && npm run seed:shadowdark

      - name: Integration tests (repositories against real DB)
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@mariadb:3306/${{ secrets.CI_DB_NAME }}
          MINIO_ENDPOINT: http://minio:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
        run: cd server && npm run test:int:coverage

      - name: Combine server unit + integration coverage (for the badge)
        # #1323 — the server-coverage badge should reflect unit ∪ integration,
        # not unit-only (~37% → ~77%). The two suites emit separate
        # coverage-final.json files; merge them into one summary the badges job
        # reads. Runs on PRs too (writes a local file, logs the combined %) so
        # the merge is exercised in CI; only the main run uploads/uses it.
        # Cosmetic — never fail the build over it.
        if: ${{ always() && inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p server/coverage-combined
          node scripts/coverage-badge/combined-summary.mjs \
            server/coverage/coverage-final.json \
            server/coverage-int/coverage-final.json \
            server/coverage-combined/coverage-summary.json

      - name: Test client (unit)
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        # Always emit coverage — PR uses it for the diff-coverage comment;
        # main uses it to write the client-coverage badge.
        # #1355 — pin the worker heap. Node otherwise auto-sizes old-space from
        # the runner's free RAM (~2 GB when the host is busy), which made this
        # step flaky-OOM under memory pressure. The suite needs <1 GB; 4 GB is
        # deterministic headroom regardless of runner load.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: cd client && npm run test:coverage

      - name: Test coverage-bot scripts
        if: ${{ inputs.skip != 'true' && steps.cheap.outputs.cheap != 'true' }}
        run: npm run test:scripts:coverage

      - name: Post diff coverage comment
        # #2351 — key on the PR payload, NOT `github.event_name ==
        # 'pull_request'`: under workflow_call the callee's event_name doesn't
        # match the caller's normalized value, and that guard silently skipped
        # this step — which is REQUIRED branch-protection context
        # `coverage-bot`, so the miss blocks every merge. TRUTHINESS, not
        # `!= null`: on a non-PR call the missing field coerces to '' and
        # `'' != null` is TRUE (measured — it ran on main push b052f4df and
        # red the whole job on `missing env: PR_NUMBER`). '' and null are
        # both falsy; a real PR number is truthy. That form covers both.
        if: ${{ always() && github.event.pull_request.number && inputs.skip != 'true' }}
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # #2351 — from the PR payload, not `github.base_ref`: the payload is
          # proven present whenever this step runs (the `if:` above), while the
          # top-level shorthand fields are exactly what workflow_call mangles.
          BASE_REF: origin/${{ github.event.pull_request.base.ref || github.base_ref }}
          # Dual-mode coverage: unit and integration datasets shown separately
          # with per-line gutter markers (U/I/UI) in code snippets.
          COVERAGE_FILES_UNIT: server/coverage/coverage-final.json,client/coverage/coverage-final.json,scripts/coverage/coverage-final.json
          COVERAGE_FILES_INT: server/coverage-int/coverage-final.json
          PR_TITLE: ${{ github.event.pull_request.title }}
          # #2496 — read in the SHELL, not in this step's `if:`. `env.` in a step
          # `if:` inside a workflow_call callee has failed OPEN three times
          # (#2357/#2438); a plain shell test on the value cannot.
          CHEAP: ${{ steps.cheap.outputs.cheap }}
        run: |
          # ⚠️ This step is deliberately NOT gated off on the cheap path.
          # `coverage-bot` is a REQUIRED branch-protection context emitted from
          # right here, so a cheap path that skipped it would leave the context
          # never posted and block the merge forever — #2351 recorded exactly
          # that ("the miss blocks every merge"). Post it honestly instead.
          if [ "$CHEAP" = "true" ]; then
            echo "[coverage] no code files changed — posting the required context without a measurement"
            COVERAGE_NO_CODE=1 node scripts/coverage-comment/post-comment.mjs < /dev/null
          else
            git fetch origin ${{ github.event.pull_request.base.ref || github.base_ref }} --depth=50
            node scripts/coverage-comment/build-comment.mjs \
              | node scripts/coverage-comment/post-comment.mjs
          fi

      - name: Upload coverage summaries (consumed by the badges job)
        # #2351 — "a main-push run" expressed as data, not event_name (which is
        # literally 'workflow_call' in a callee — see the context-echo step):
        # no PR payload + ref is main. The nightly's call also matches, which
        # is harmless: it uploads an artifact nobody downloads (3-day
        # retention) rather than starving badges of coverage on every merge.
        if: ${{ always() && !github.event.pull_request.number && github.ref == 'refs/heads/main' && inputs.skip != 'true' }}
        # v4 requires GHES features Forgejo's actions backend doesn't expose.
        # Pin to v3 — same constraint documented in e2e-full.yml.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: coverage-summaries
          path: |
            server/coverage/coverage-summary.json
            server/coverage-combined/coverage-summary.json
            client/coverage/coverage-summary.json
          retention-days: 3

  # ---------------------------------------------------------------------------
  # smoke — critical-path Playwright specs against the built app. Runs on
  # every PR and on push-to-main (the main-only gate is gone — #711). Builds
  # its own server + client and owns its own mariadb service. The full E2E
  # suite still lives in nightly-e2e via e2e-full.yml.
  # ---------------------------------------------------------------------------

  # #2336 — tell someone when the NIGHTLY suite goes red.
  #
  # Without this the nightly backstop is a backstop in name only: a scheduled
  # failure would block the deploy (deploy `needs` this workflow) and otherwise
  # land in a log nobody reads. The rolling `🔴 e2e-full is red` issue comes
  # from e2e-full.yml's own notifier and says nothing about this suite.
  #
  # Deliberately leaner than e2e-full's notifier: that one downloads a
  # Playwright JSON report and lists failing specs. vitest here produces no
  # equivalent artifact, so this reports the run link + suspect commits and
  # leaves the spec detail to the log. Reporting less, honestly, beats parsing
  # output that isn't there.
  notify-failure:
    needs: test
    # #2368 — `always()` and NO other job-level condition, ever. A skipped
    # CALLEE job makes the caller's expanded placeholder report FAILURE (probes
    # 9784-9786 on this instance), so gating this job would red the `test`
    # wrapper on every green PR. The alert decision lives on the STEPS below,
    # which skip harmlessly.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      # #2357/#2438 — the effective alert level, resolved once.
      #
      # `inputs.red_alert` is what the caller declared (see the input's comment).
      # It is empty ONLY on a direct workflow_dispatch, and only then do we look
      # at `github.ref` — a dispatch has no caller, so that context is this run's
      # own and trustworthy. A workflow_call NEVER reaches the fallback, which is
      # what keeps the callee-context problem out of the decision entirely.
      #
      # Fails correct if a default were ever dropped: a PR's ref is
      # `refs/pull/N/head`, which is not main, so the fallback yields `none`.
      RED_ALERT: ${{ inputs.red_alert != '' && inputs.red_alert || (github.ref == 'refs/heads/main' && 'main' || 'none') }}
    steps:
      # Unconditional ON PURPOSE (#2357). Every guard this job has ever carried
      # was wrong about what the callee can see, and each time the evidence had
      # to be reconstructed from a false alarm after the fact. This prints what
      # the guard actually saw, on every run, so the next argument about it is
      # settled by a log line instead of a theory.
      - name: Log the alert decision and the context it came from
        run: |
          echo "effective RED_ALERT = '${RED_ALERT}'"
          echo "  inputs.red_alert   = '${{ inputs.red_alert }}'"
          echo "  github.ref         = '${{ github.ref }}'"
          echo "  github.event_name  = '${{ github.event_name }}'"
          echo "  pull_request.number= '${{ github.event.pull_request.number }}'"
          echo "  needs.test.result  = '${{ needs.test.result }}'"

      # #2011 — gate on `needs.*.result`, NOT `needs.test.result`. Under
      # workflow_call Forgejo namespaces the callee's jobs, so a literal key
      # lookup is null even when that job just failed — it silently skipped
      # every step on eight consecutive nightly reds. The wildcard survives the
      # renaming. This job has exactly one `needs`, so it can't widen.
      #
      # THE ALERT DECISION IS NOT MADE HERE, AND THAT IS DELIBERATE (#2357).
      #
      # It was, in the first cut of this fix, as `env.RED_ALERT != 'none'`. On a
      # real forced-red PR (run 9926, PR #2452) that guard let the step through:
      # the job echoed `effective RED_ALERT = 'none'` and the notifier filed
      # #2453 anyway. `env.` does not resolve inside a step-level `if:` on this
      # Forgejo, so the comparison was `'' != 'none'` — true — and the guard sat
      # wide open. It would have shipped looking correct.
      #
      # That is the third consecutive guard on this job to be wrong about what
      # an expression can see here (`== null` #2356, the payload test #2448,
      # `env.` in an `if:` now). So the level test moved OUT of the expression
      # language and INTO the script below, where `env` is read as an ordinary
      # environment variable and its behaviour is not in question. What is left
      # in these `if:`s is only `needs.*.result`, which #2011 already proved
      # works in a callee.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: ${{ needs.test.result == 'failure' || contains(needs.*.result, 'failure') }}
        with:
          # #2409 — report on the ref that was actually tested.
          ref: ${{ inputs.ref }}
          # Suspect commits need history; #2315 — no blobs, this job opens no
          # tracked file (git log + inline python only).
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            scripts/ci

      - name: Comment the rolling "test suite is red" issue
        # Failure only — the alert level is enforced in the script (see above).
        if: ${{ needs.test.result == 'failure' || contains(needs.*.result, 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          EVENT: ${{ github.event_name }}
          RED_ALERT: ${{ env.RED_ALERT }}
          # What was actually checked out and walked for the commit list: the
          # caller's ref when it passed one (the nightly's release tag), else
          # this run's own ref.
          TESTED_REF: ${{ inputs.ref != '' && inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, subprocess

          # #2357/#2438 — THE GATE. Deliberately here and not in the step's
          # `if:`: three separate expression-level guards on this job have now
          # been wrong about what they can see in a workflow_call callee, the
          # last of them (`env.RED_ALERT != 'none'`) failing OPEN on run 9926.
          # An ordinary env read has no such ambiguity.
          alert = os.environ.get("RED_ALERT", "none")
          if alert not in ("main", "deploy"):
              print(
                  f"RED_ALERT='{alert}' -> this run does not represent main; "
                  "not raising the rolling marker. A PR shows its own red, and a "
                  "branch dispatch is CI validation (#2357/#2438)."
              )
              raise SystemExit(0)

          api, repo = os.environ["API_URL"], os.environ["REPO"]
          run_url = f'{os.environ["SERVER_URL"]}/{repo}/actions/runs/{os.environ["RUN_ID"]}'
          # Distinct from e2e-full's marker so the two rollups never collide.
          MARKER = "<!-- test-suite-red -->"
          TITLE = "🔴 nightly test suite is red"

          # curl, NOT urllib: Cloudflare fingerprint-blocks Python-urllib with a
          # 403 "error code: 1010" (see e2e-full.yml's notifier for the history).
          def api_call(method, path, body=None):
              cmd = ["curl", "-sS", "-X", method, f"{api}{path}",
                     "-H", f"Authorization: token {os.environ['GH_TOKEN']}",
                     "-H", "Content-Type: application/json"]
              if body is not None:
                  cmd += ["--data-binary", json.dumps(body)]
              r = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  return json.loads(r.stdout)
              except Exception:
                  print(f"api {method} {path} -> unparseable: {r.stdout[:200]}")
                  return None

          def git(*a):
              return subprocess.run(["git", *a], capture_output=True, text=True).stdout.strip()

          # #2438 — say only what this run can actually support. The old body
          # asserted a blocked deploy and a commits-on-main list unconditionally,
          # and both were false on #2436 (a branch dispatch) and again on #2448
          # (a PR): nothing was blocked, and the "main" commits existed only on
          # the branch. `deploy` is the nightly gate — the one caller for which
          # a blocked deploy is true.
          consequence = (
              "so the deploy was blocked"
              if alert == "deploy"
              else "on **main**"
          )
          body = (
              f"{MARKER}\n"
              f"The unit + integration suite failed on a **{os.environ['EVENT']}** run, "
              f"{consequence}.\n\n"
              f"**Run:** {run_url}\n\n"
              f"This suite is not a deterministic function of the tree — int tests run "
              f"against a real DB — so a red here can be a genuine regression OR a race "
              f"that the per-PR run happened not to hit. Read the log before assuming "
              f"either.\n\n"
          )
          # #2438's (honest-body) says the marker must NEVER present commits as
          # main's when they aren't. Keying that on the alert level alone is not
          # enough: it holds for both production callers (a main push, and the
          # nightly's release tag, whose history IS main's) but breaks the moment
          # someone hand-dispatches `deploy` from a branch to prove this very
          # workflow — which the first prove run did, listing a branch commit
          # under "Recent commits on main".
          #
          # So the heading NAMES the ref it actually walked. That is honest on
          # every path by construction, including ones nobody has thought of yet,
          # and it still answers the question the reader has.
          if alert in ("main", "deploy"):
              tested = os.environ.get("TESTED_REF") or "this run's default ref"
              suspects = git("log", "--oneline", "-n", "15") or "(git history unavailable)"
              body += f"**Recent commits on `{tested}`:**\n```\n{suspects}\n```\n"

          # #2303 — the third copy of this lookup, fixed with the other two.
          #
          # (1) THE MARKER MUST LEAD THE BODY. An issue that *discusses* a marker
          #     contains it, so a substring test selects the design ticket
          #     instead of the rolling issue and the real alert is never filed.
          #     Live-proven the same day: the e2e-full copy would have picked
          #     #2321 (a Lighthouse ticket) out of the 280 open issues, and the
          #     flaky reporter's first run PATCHed #2303's body away. The body
          #     built just above starts with f"{MARKER}\n", so anchoring is exact.
          # (2) PAGINATE. 50 per page against 280 open issues means this rolling
          #     issue drops off page 1 within days, after which every red night
          #     files a new one instead of rolling.
          existing = []
          for page in range(1, 9):
              batch = api_call("GET", f"/repos/{repo}/issues?state=open&limit=50&page={page}")
              if not isinstance(batch, list):
                  break
              existing.extend(batch)
              if len(batch) < 50:
                  break
          match = next(
              (
                  i
                  for i in existing
                  if isinstance(i, dict) and (i.get("body") or "").lstrip().startswith(MARKER)
              ),
              None,
          )

          if match:
              api_call("POST", f"/repos/{repo}/issues/{match['number']}/comments", {"body": body})
              print(f"updated rolling issue #{match['number']}")
          else:
              created = api_call("POST", f"/repos/{repo}/issues", {"title": TITLE, "body": body})
              print(f"filed rolling issue #{(created or {}).get('number', '?')}")
          PY
