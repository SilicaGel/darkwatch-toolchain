name: CI

# Split into parallel jobs (#712): lint-typecheck / test / smoke run
# concurrently on every PR and on push-to-main; badges is a main-only join
# job. The Forgejo runner's capacity is set to 3 so the three primary jobs
# actually run in parallel rather than serialising on one slot.
#
# Smoke now runs on PRs too (#711 workflow half — the gate that pinned it
# to main-only pushes is gone). Branch protection (the other half of #711)
# is configured in the Forgejo UI, not here.
#
# LOCAL MIRROR: scripts/preflight.sh reproduces the `lint-typecheck` and
# `test` jobs for a one-command local pre-PR gate (and /ship runs it before
# opening a PR). If you change either of those jobs, update preflight.sh —
# it pins a SHA-256 of this file and will fail until reconciled.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs (#1617): a re-push stacks a second full heavy job
# set next to the stale one on the shared OrbStack VM. Pushes to main are NOT
# cancelled — badges + notify-main-red are per-push consumers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # lint-typecheck — static checks + compile. No DB, no build artifacts.
  # Fastest signal: a typecheck or grep-gate failure surfaces here in well
  # under a minute without waiting on tests or smoke.
  # ---------------------------------------------------------------------------
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # #1263 — npm install + static checks + tsc + build; ~5-8 min typical
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json

      - name: Fetch base ref (inventory drift Check 2 needs origin/main)
        run: git fetch --no-tags --depth=200 origin main || true

      - name: Assert workflow Node.js versions are consistent
        run: |
          set -e
          VERSIONS=$(grep -hE "^[[:space:]]+node-version:[[:space:]]+" .forgejo/workflows/*.yml \
            | sed "s/.*node-version:[[:space:]]*//" | tr -d "' " | sort -u)
          COUNT=$(echo "$VERSIONS" | grep -c .)
          if [ "$COUNT" -ne "1" ]; then
            echo "FAIL: mismatched node-version across workflows:"
            grep -rn "node-version:" .forgejo/workflows/*.yml
            exit 1
          fi
          echo "OK — all workflows use Node.js $VERSIONS"

      - name: Forbid bare `npx <bin>` in workflows (typosquat fallthrough guard)
        run: |
          # `npx <bin>` silently fetches + runs a public-registry package if
          # the local install is missing — a typosquat fallthrough vector
          # (#722). Require either a direct ./node_modules/.bin path, or an
          # npx call whose first argument is a flag (`--no-install` exits
          # non-zero instead of fetching; `-p <pkg>` pins the package). The
          # `awk -F'#'` strips trailing comments before matching so a `#`
          # comment that mentions npx doesn't trip the gate. The pattern
          # matches `npx ` + a lowercase letter (a real bin name) — so the
          # `npx <bin>` / `npx --no-install` literals in this step's own
          # name + echo strings don't self-trigger.
          hits=$(for f in .forgejo/workflows/*.yml; do
            awk -F'#' -v fn="$f" '{print fn ":" NR ":" $1}' "$f"
          done | grep -E 'npx [a-z]' || true)
          if [ -n "$hits" ]; then
            echo "ERROR: bare 'npx <bin>' found in a workflow — use"
            echo "  ./node_modules/.bin/<bin>   (preferred), or"
            echo "  npx --no-install <bin>      (fails fast instead of fetching)"
            echo "$hits"
            exit 1
          fi
          echo "OK — no bare 'npx <bin>' in workflows"

      - name: Forbid urllib HTTP calls in workflows (Cloudflare 403 guard)
        run: |
          # forge.example.com sits behind Cloudflare, which fingerprint-blocks
          # Python's urllib HTTP client with a 403 "error code: 1010". A workflow
          # that reaches for it to call the Forgejo API therefore ALWAYS fails —
          # and, because these are notify/alert jobs that rarely fire, it fails
          # silently for months (#1654: notify-main-red never filed a single
          # alert). curl is the proven transport. urllib.parse (quoting, no I/O)
          # is fine — this gate only matches the HTTP client.
          #
          # The pattern is written `urllib[.]request` so this step's own source
          # line does not satisfy the regex it defines. `awk -F'#'` strips
          # trailing comments first, so prose mentioning it above doesn't trip.
          hits=$(for f in .forgejo/workflows/*.yml; do
            awk -F'#' -v fn="$f" '{print fn ":" NR ":" $1}' "$f"
          done | grep -E 'urllib[.]request' || true)
          if [ -n "$hits" ]; then
            echo "ERROR: a workflow calls the Forgejo API via Python urllib."
            echo "  Cloudflare 403s it (error code: 1010) — the call can never succeed."
            echo "  Use curl instead; see the 'call()' helper in notify-main-red (ci.yml)."
            echo "$hits"
            exit 1
          fi
          echo "OK — no urllib HTTP calls in workflows"

      - name: Enforce e2e specs are in a declared test tier (#1270)
        # Drift guard: every tests/e2e/*.spec.ts must be in the per-PR smoke list
        # (below) OR in tests/e2e/nightly-only.txt. A spec in neither runs in no
        # pre-merge tier and only surfaces in the nightly full suite — how
        # theme-contrast broke the deploy. No deps needed (pure node + repo files).
        run: node scripts/check-e2e-tiers.mjs

      - name: Ban external image_url in e2e specs (#1411)
        # #1369 removed 14 Wikimedia image_url usages; this guard prevents regression.
        # External https:// image_url values cause flaky CI when the host rate-limits.
        # Use uploadSampleMapImage() from tests/helpers/campaign.ts instead.
        run: node scripts/check-e2e-external-images.mjs

      - name: Install server dependencies
        run: |
          cd server && npm ci --no-audit --no-fund
          # npm bug #4828: platform-specific optional bindings can be skipped when
          # the runner's Node doesn't satisfy the package's engines field.
          # Force-install the runner-arch rolldown binding if npm ci missed it
          # (arch-aware since the x64 runner joined the arm64 fleet).
          ROLLDOWN_ARCH=$(node -p "process.arch")
          if [ ! -d "node_modules/@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu" ]; then
            VER=$(node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(l.packages['node_modules/@rolldown/binding-linux-'+process.arch+'-gnu'].version)")
            echo "Patching missing rolldown linux-${ROLLDOWN_ARCH} binding @ $VER"
            npm install --no-save --ignore-engines "@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu@$VER"
          fi

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      # ESLint lives at the repo root (flat config + plugins are root devDeps).
      # The current rule set is NOT type-aware, so client/server node_modules
      # aren't required to lint them — only the root install is.
      - name: Install root dependencies (ESLint)
        run: npm ci --no-audit --no-fund

      # #413 — Fail PRs that introduce high/critical vulnerabilities.
      # Moderate findings are tracked but not gating (uuid<14 via svix/resend
      # is a known moderate; --audit-level=high skips moderates).
      #
      # #1270 — npm audit is BLOCKING on PRs (a PR that adds a vulnerable dep
      # fails here) but ADVISORY on push-to-main. npm audit reads the LIVE
      # advisory feed, so a *fresh* advisory on already-merged deps would
      # otherwise retro-fail an unrelated commit on main (the multer incident,
      # #1273) — green at PR time, red at merge time. On main we warn instead;
      # the `notify-main-red` job surfaces it and weekly Renovate patches it.
      #
      # #1883 — the gate now runs through `scripts/audit-gate.mjs`, which wraps
      # `npm audit --json` and applies `scripts/audit-allowlist.json`. Rationale:
      # `npm audit --audit-level=high` is all-or-nothing, so a single unfixable-
      # but-UNREACHABLE advisory forces a choice between leaving every PR red and
      # dropping the gate entirely. The wrapper narrows the exception to a named
      # GHSA in a named workspace, with a written justification and a hard expiry
      # (past it the gate goes red again, forcing re-review). Severity policy is
      # unchanged: high + critical gate, moderate/low do not.
      # #2159 — the ROOT workspace is gated too. It was omitted when this gate
      # was written, on the reasoning that it carries no runtime dependencies
      # ("dependencies": {} — 14 devDependencies), so nothing in it reaches the
      # production image. True, but the consequence was that root accumulated
      # advisories silently and nobody learned about them until someone ran
      # audit-gate.mjs by hand — eight had piled up by 2026-08-03, including one
      # whose only offered "fix" was a destructive downgrade of Lighthouse CI.
      # Gating it means a PR that adds a vulnerable dev tool says so at PR time,
      # which is the whole point of the gate; genuinely unfixable ones go in the
      # allowlist with an expiry, as tmp and js-yaml now are.
      - name: Security audit (root)
        run: |
          if node scripts/audit-gate.mjs .; then exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          echo "::warning::npm audit (root) found high-severity advisories — advisory on main (not blocking)."

      - name: Security audit (server)
        run: |
          if node scripts/audit-gate.mjs server; then exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          echo "::warning::npm audit (server) found high-severity advisories — advisory on main (not blocking)."

      - name: Security audit (client)
        run: |
          if node scripts/audit-gate.mjs client; then exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          echo "::warning::npm audit (client) found high-severity advisories — advisory on main (not blocking)."

      - name: Enforce soft-delete filters on core tables
        run: |
          # The three core repository files for soft-deleted tables must each
          # contain a deleted_at filter. Fails fast if any file omits it.
          fail=0
          for f in \
            server/src/repositories/campaignRepository.ts \
            server/src/repositories/characterRepository.ts \
            server/src/repositories/campaignMembershipRepository.ts; do
            if ! grep -q "deleted_at" "$f"; then
              echo "FAIL: $f has no deleted_at filter"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Soft-delete filter check passed." || exit 1

      - name: Forbid numeric ID patterns
        run: |
          set -e
          if grep -rnE "Number\s*\(\s*req\.params" server/src client/src 2>/dev/null; then
            echo "ERROR: Number() coercion on req.params is no longer valid — IDs are UUIDs."
            exit 1
          fi
          # Entity ID fields typed as number in production source (tests may legitimately
          # use numeric IDs for unrelated counters, so exclude test files). Catches both
          # snake_case (user_id) and camelCase (characterId, campaignId) forms.
          # Excludes RAF/timer handles (rafId, timeoutId, intervalId, frameId, animationId, timerId)
          # which are legitimately numeric browser handles, not entity IDs.
          if grep -rnE "(^|[[:space:](,{])(id|[a-zA-Z_]*_id|[a-zA-Z]+Id):[[:space:]]*number" server/src client/src \
               --include="*.ts" --include="*.tsx" \
               | grep -v -E "\.(test|spec)\.(ts|tsx)" \
               | grep -v -E "\b(rafId|timeoutId|intervalId|frameId|animationId|timerId|pollId|handlerId):" ; then
            echo "ERROR: entity ID field typed as number. IDs must be string."
            exit 1
          fi
          # typeof guards that still check "number" for ID params
          if grep -rnE "typeof[[:space:]]+[a-zA-Z_]*([Ii]d|_id)[[:space:]]*!==?[[:space:]]*\"number\"" \
               server/src client/src --include="*.ts" --include="*.tsx" \
               | grep -v -E "\.(test|spec)\.(ts|tsx)" ; then
            echo "ERROR: typeof X !== \"number\" guard on an ID param. IDs must be string."
            exit 1
          fi
          echo "OK — no numeric ID patterns found"

      - name: Record<string,unknown> budget (anti-bleed ratchet, #761)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-record-type-budget.mjs

      - name: Feature-inventory drift guard (#856)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-feature-inventory.mjs

      - name: RIGHTS-MATRIX drift guard (#1396)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-rights-matrix.mjs

      # #1564 — core/ruleset boundary guard (from the #334 gap analysis §3 P1,
      # umbrella #1563). Blocks NEW rulesets/<slug> imports, bare "shadowdark"
      # literals, and "sd:" socket strings from landing in core production
      # source. Existing leaks are grandfathered by a count ratchet in
      # scripts/ruleset-boundary-allowlist.json that shrinks as #1563 lands.
      # Escape hatch: [allow-ruleset-boundary] in the PR title.
      - name: Core/ruleset boundary guard (#1564)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-ruleset-boundary.mjs

      # #1736 — War Table styles consume --wt-* tokens only; the ONLY files
      # allowed to hold raw color literals are the theme-definition files
      # wt-theme-*.css (spec §18.2). Scans WT consumer styles (wt-tokens.css,
      # wartable.css, pages/wartable/**/*.module.css) and fails on any
      # hex/rgb/hsl literal outside the allowlist.
      - name: WT no-raw-color guard (#1736)
        run: node scripts/check-wt-raw-colors.mjs

      # #1290 — ESLint as a real gate. Until now lint only ran in the
      # bypassable lint-staged pre-commit hook (eslint --fix on staged files),
      # so rules-of-hooks / e2e-click-discipline were never enforced
      # server-side. Fails the build on any ESLint *error*. The rule set is
      # still minimal (react-hooks + e2e-click-discipline); tightening it
      # (exhaustive-deps→error, typed promise rules, import/no-cycle) and a
      # repo-wide Prettier pass are tracked as follow-ups to #1290.
      - name: Lint (ESLint)
        run: npm run lint

      # #1292 — Prettier as a gate, after the one-time code format pass. Scope
      # is code only: *.md and .forgejo/ are excluded in .prettierignore (prose
      # and CI YAML stay hand-formatted). Fails on any unformatted code file.
      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check server
        run: cd server && npm run build

      - name: Type check + build client
        run: cd client && npm run build

      # #2022 — `tests/` is a whole TypeScript project (144 .ts files, 109 e2e
      # specs) and this is its only typecheck. It used to live in `smoke`, which
      # meant a type error in a spec waited behind MariaDB + MinIO + seed +
      # server build + Vite before it surfaced, and — because preflight mirrors
      # THIS job and not `smoke` — no local gate covered it at all. PR #2021 hit
      # exactly that: preflight green twice, then CI red on a `for...of` over a
      # NodeList (tests/tsconfig.json has no `downlevelIteration`, client's does).
      #
      # It is a pure static check: no DB, no browser, no running app, ~2s. It
      # belongs in the fast job, and putting it here is what makes preflight
      # cover it automatically rather than via a bespoke check that can drift.
      #
      # No `--ignore-scripts` needed: tests/ has no postinstall, so this does not
      # pull Playwright browsers (they're baked into the smoke job's container).
      - name: Install tests dependencies (typecheck only — no browsers)
        run: cd tests && npm ci --no-audit --no-fund

      - name: Type check tests (specs + helpers + smoke-walk)
        run: cd tests && npm run typecheck

  # ---------------------------------------------------------------------------
  # test — server unit + integration + client unit + coverage-bot scripts.
  # All four coverage datasets land in this one job so the diff-coverage PR
  # comment can be assembled without cross-job artifact passing. Owns the
  # mariadb + minio service containers.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18 # #1355 — healthy ~4-9 min (worst legit ~14); trimmed from 25 (#1263) to backstop a hang below the ~20-min OOM-runaway range
    services:
      mariadb:
        image: mariadb:11@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
        env:
          # CI DB credentials come from Forgejo repo secrets (Settings → Secrets).
          # Required: CI_DB_ROOT_PASSWORD, CI_DB_NAME, CI_DB_USER, CI_DB_PASSWORD.
          # See .forgejo/workflows/README.md for details.
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=512m
      minio:
        # The official minio/minio image needs `server /data` as its command;
        # Forgejo's act_runner supports `cmd:` in service definitions.
        # The image-library int tests create + drop a per-suite bucket against
        # this instance.
        image: minio/minio:RELEASE.2025-04-08T15-41-24Z@sha256:8834ae47a2de3509b83e0e70da9369c24bbbc22de42f2a2eddc530eee88acd1b
        cmd:
          - server
          - /data
          - --console-address
          - ":9001"
        env:
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
        options: >-
          --health-cmd="curl -fsS http://localhost:9000/minio/health/ready || exit 1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The diff-coverage comment needs history to diff against the base ref.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json

      - name: Install root devDependencies (c8 — coverage-bot scripts)
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        run: |
          cd server && npm ci --no-audit --no-fund
          ROLLDOWN_ARCH=$(node -p "process.arch")
          if [ ! -d "node_modules/@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu" ]; then
            VER=$(node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(l.packages['node_modules/@rolldown/binding-linux-'+process.arch+'-gnu'].version)")
            echo "Patching missing rolldown linux-${ROLLDOWN_ARCH} binding @ $VER"
            npm install --no-save --ignore-engines "@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu@$VER"
          fi

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      - name: Test server (unit)
        # Always emit coverage — PR uses it for the diff-coverage comment;
        # main uses it to write the server-coverage badge.
        run: cd server && npm run test:coverage

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Wait for MinIO (image-library int tests need it)
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/minio/9000) 2>/dev/null && echo "MinIO is ready" && break
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MinIO never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Verify Kysely schema types are up-to-date
        env:
          DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@mariadb:3306/${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:verify

      - name: Seed core + shadowdark content (int tests assume seeded DB)
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run seed:core && npm run seed:shadowdark

      - name: Integration tests (repositories against real DB)
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@mariadb:3306/${{ secrets.CI_DB_NAME }}
          MINIO_ENDPOINT: http://minio:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
        run: cd server && npm run test:int:coverage

      - name: Combine server unit + integration coverage (for the badge)
        # #1323 — the server-coverage badge should reflect unit ∪ integration,
        # not unit-only (~37% → ~77%). The two suites emit separate
        # coverage-final.json files; merge them into one summary the badges job
        # reads. Runs on PRs too (writes a local file, logs the combined %) so
        # the merge is exercised in CI; only the main run uploads/uses it.
        # Cosmetic — never fail the build over it.
        if: always()
        continue-on-error: true
        run: |
          mkdir -p server/coverage-combined
          node scripts/coverage-badge/combined-summary.mjs \
            server/coverage/coverage-final.json \
            server/coverage-int/coverage-final.json \
            server/coverage-combined/coverage-summary.json

      - name: Test client (unit)
        # Always emit coverage — PR uses it for the diff-coverage comment;
        # main uses it to write the client-coverage badge.
        # #1355 — pin the worker heap. Node otherwise auto-sizes old-space from
        # the runner's free RAM (~2 GB when the host is busy), which made this
        # step flaky-OOM under memory pressure. The suite needs <1 GB; 4 GB is
        # deterministic headroom regardless of runner load.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: cd client && npm run test:coverage

      - name: Test coverage-bot scripts
        run: npm run test:scripts:coverage

      - name: Post diff coverage comment
        if: always() && github.event_name == 'pull_request'
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: origin/${{ github.base_ref }}
          # Dual-mode coverage: unit and integration datasets shown separately
          # with per-line gutter markers (U/I/UI) in code snippets.
          COVERAGE_FILES_UNIT: server/coverage/coverage-final.json,client/coverage/coverage-final.json,scripts/coverage/coverage-final.json
          COVERAGE_FILES_INT: server/coverage-int/coverage-final.json
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50
          node scripts/coverage-comment/build-comment.mjs \
            | node scripts/coverage-comment/post-comment.mjs

      - name: Upload coverage summaries (consumed by the badges job)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # v4 requires GHES features Forgejo's actions backend doesn't expose.
        # Pin to v3 — same constraint documented in e2e-full.yml.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: coverage-summaries
          path: |
            server/coverage/coverage-summary.json
            server/coverage-combined/coverage-summary.json
            client/coverage/coverage-summary.json
          retention-days: 3

  # ---------------------------------------------------------------------------
  # smoke — critical-path Playwright specs against the built app. Runs on
  # every PR and on push-to-main (the main-only gate is gone — #711). Builds
  # its own server + client and owns its own mariadb service. The full E2E
  # suite still lives in nightly-e2e via e2e-full.yml.
  # ---------------------------------------------------------------------------
  smoke:
    runs-on: ubuntu-latest
    # #1263 — build + smoke specs + DB seed; ~15-20 min typical. #1621 — the
    # affected tier can append up to 20 nightly-only specs (+MinIO + all-tier
    # seed) on PRs touching a mapped area, so allow headroom above the base.
    timeout-minutes: 45
    # #969 — run inside the prebuilt CI image (Node 22 + Chromium + Playwright
    # system deps baked). No apt install-deps, no browser download, no
    # actions/setup-node. Pinned to the @playwright/test version; rebuilt by
    # build-ci-image.yml (Renovate keeps the tag in sync — #414).
    container:
      image: forge.example.com/aaron/darkwatch-ci-playwright:1.61.1
    services:
      mariadb:
        image: mariadb:11@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=512m
      minio:
        # #1621 — the affected tier can route maps/image/AoE specs into this job;
        # they store uploads in object storage, and the all-tier seed below
        # stages the QA fixture's (#1238) map image through it. Same service
        # shape as the `test` job's MinIO (Forgejo's act_runner supports `cmd:`).
        image: minio/minio:RELEASE.2025-04-08T15-41-24Z@sha256:8834ae47a2de3509b83e0e70da9369c24bbbc22de42f2a2eddc530eee88acd1b
        cmd:
          - server
          - /data
          - --console-address
          - ":9001"
        env:
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
        options: >-
          --health-cmd="curl -fsS http://localhost:9000/minio/health/ready || exit 1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # #1621 affected tier: scripts/affected-e2e.mjs diffs origin/main...HEAD
          # to pick which nightly-only specs to also run; the three-dot merge-base
          # needs full history (same as visual-regression.yml / ship-guard.yml).
          fetch-depth: 0

      - name: Fetch base ref (affected e2e tier needs origin/main — #1621)
        run: git fetch origin main --quiet || true

      # #969 — Node 22 is baked into the container image, so no actions/setup-node.
      # We still cache the npm download dir (what setup-node's cache:'npm' did)
      # so `npm ci` doesn't re-fetch every tarball.
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install server dependencies
        run: |
          cd server && npm ci --no-audit --no-fund
          ROLLDOWN_ARCH=$(node -p "process.arch")
          if [ ! -d "node_modules/@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu" ]; then
            VER=$(node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(l.packages['node_modules/@rolldown/binding-linux-'+process.arch+'-gnu'].version)")
            echo "Patching missing rolldown linux-${ROLLDOWN_ARCH} binding @ $VER"
            npm install --no-save --ignore-engines "@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu@$VER"
          fi

      - name: Build server
        run: cd server && npm run build

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      - name: Build client
        run: cd client && npm run build

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Wait for MinIO + create the images bucket (#1621 affected tier)
        # The affected tier (#1621) can append maps/image/AoE specs that store
        # uploads in object storage, and the all-tier seed below stages the QA
        # fixture's (#1238) map image through it. Create the bucket + make it
        # anonymously downloadable (mirrors docker-compose's minio-init /
        # e2e-full.yml). mc is fetched here (not baked in the CI image); pick the
        # arch to match this container (the smoke image is arm64 — see the
        # rolldown arm64 patch above).
        env:
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/minio/9000) 2>/dev/null && echo "MinIO reachable" && break
            echo "Waiting for MinIO... ($i/30)"; sleep 2
            [ "$i" -eq 30 ] && { echo "MinIO never became ready"; exit 1; }
          done
          case "$(uname -m)" in
            aarch64 | arm64) MC_ARCH=linux-arm64 ;;
            *) MC_ARCH=linux-amd64 ;;
          esac
          # #2010 — retrying helper, not a bare curl (see e2e-full.yml).
          bash scripts/ci/fetch-binary.sh "https://dl.min.io/client/mc/release/$MC_ARCH/mc" /tmp/mc
          chmod +x /tmp/mc
          # `/minio/health/ready` can flip green a beat before client auth is
          # accepted (a recurring e2e-full flake), so retry the alias until it
          # authenticates before touching the bucket.
          for i in $(seq 1 30); do
            /tmp/mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && break || true
            echo "Waiting for MinIO client auth... ($i/30)"; sleep 1
            [ "$i" -eq 30 ] && { echo "MinIO never accepted client auth"; exit 1; }
          done
          /tmp/mc mb --ignore-existing local/"$MINIO_BUCKET"
          /tmp/mc anonymous set download local/"$MINIO_BUCKET"
          echo "MinIO ready with bucket $MINIO_BUCKET (public-download)"

      - name: Seed all tiers (smoke base + any affected-tier spec's preconditions)
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          # #1621 — MinIO env (+ MinIO running) so the QA fixture (#1238) stages
          # its map image and creates the active map; without it the fixture
          # skips the map and map-* specs have nothing to render.
          MINIO_ENDPOINT: http://minio:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
          MINIO_PUBLIC_BASE_URL: http://minio:9000/darkwatch-images
        # `npm run seed` (SEED_MODE=all) seeds core → shadowdark → demo →
        # qa-fixture. The base smoke specs need the demo campaign
        # (openCampaign()); affected-tier map specs (e.g.
        # map-viewport-persistence) need the qa-fixture tier. Matches e2e-full.yml
        # so any spec the affected tier routes has the same seed it does nightly.
        run: cd server && npm run seed

      - name: Smoke — start E2E app server
        env:
          PORT: "3001"
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          NODE_ENV: test
          ALLOW_TEST_HOOKS: "true"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          # #2116 — the seeded `Admin` account's id is fixed (ADMIN_FIXED_ID in
          # server/src/seeds/core.ts, pinned by seeds.int.test.ts), but without
          # this the server treats it as an ordinary user and every admin route
          # renders its "no admin access" notice. That is why 2116-wave3's two
          # admin tests passed locally (where .env sets it) and failed here.
          ADMIN_USER_IDS: ad000000-0000-7000-8000-000000000001
          JWT_SECRET: e2e-test-secret
          CLIENT_URL: http://localhost:5173
          # See e2e-full.yml — disable per-user/per-IP socket caps for CI runs
          # so accumulating ghost sockets between Playwright tests don't
          # block new connections.
          SOCKET_PER_USER_CAP: "1000"
          SOCKET_PER_IP_CAP: "1000"
          NODE_OPTIONS: "--max-old-space-size=256"
          # #1621 — affected-tier image/map specs upload to + serve from object
          # storage; MinIO (service) + bucket are brought up above.
          MINIO_ENDPOINT: http://minio:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
          MINIO_PUBLIC_BASE_URL: http://minio:9000/darkwatch-images
        run: |
          node server/dist/index.js >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/auth/me 2>/dev/null || true)
            echo "$status" | grep -qE '^(200|401)$' && break || true
            echo "Waiting for app server... ($i/30) [got: $status]"
            sleep 2
            [ "$i" -eq 30 ] && echo "App server never became ready" && exit 1
          done

      - name: Smoke — start Vite preview server
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          # Direct binary path, not `npx vite` — `npx <bin>` silently fetches
          # from the public registry if the local install is missing (#722).
          cd client && ./node_modules/.bin/vite preview >/tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite preview server never became ready" && exit 1
          done

      - name: Smoke — warm up app server (login + auth + campaigns)
        # The first specs in the suite (level-up, picker-commits) hit cold
        # connection pools, V8 JIT, and socket handlers, exceeding their
        # 12-15s waits. Issuing a few authed requests here primes the app
        # server's caches so the first specs land on warm code paths.
        run: |
          set -e
          # Capture session cookie from login
          curl -s -c /tmp/dm-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"dm@darkwatch.test","password":"password"}' >/dev/null
          curl -s -c /tmp/player-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"player@darkwatch.test","password":"password"}' >/dev/null
          # Hit the heavy authed endpoints: dashboard, campaign listing, characters,
          # rulesets catalog. Two passes so connection pool stabilises.
          for pass in 1 2; do
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/campaigns >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/dashboard >/dev/null
            curl -s -b /tmp/player-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/player-cookies.txt http://localhost:3001/api/dashboard >/dev/null
          done
          rm -f /tmp/dm-cookies.txt /tmp/player-cookies.txt
          echo "warmup complete"

      # #969 — browsers + system deps are baked into the container image at
      # /ms-playwright, so the actions/cache step and the install-deps/install
      # branch are gone. Only the tests/ npm deps remain.
      - name: Smoke — install tests deps (browsers baked in image)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && npm ci

      # (The tests/ typecheck moved to `lint-typecheck` in #2022 — it is a pure
      # static check and does not need this job's stack. `npm ci` above stays:
      # smoke still needs the deps to actually run Playwright.)

      - name: Smoke — run critical specs (+ affected nightly-only tier, #1621)
        id: smoke_e2e
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          # #1621 — affected-tier specs (e.g. 1560-aoe-walls, 1077-hidden-monsters)
          # open a raw DB connection via tests/helpers/db.ts, which falls back to
          # the local-dev 127.0.0.1:3397 when unset. Point it at this job's
          # mariadb service (mirrors e2e-full.yml's shard steps, #1581).
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: |
          # Affected tier (#1621): nightly-only specs whose area this PR's diff
          # touches (tests/e2e/spec-areas.json), plus any e2e spec the PR modifies
          # directly (self-tier). Empty on docs/infra PRs → exactly the base smoke
          # set below (zero cost). Run from the repo root (reads spec-areas.json +
          # git diff) BEFORE `cd tests`. Diagnostics go to stderr (shown in log);
          # stdout is the machine list, appended unquoted for word-splitting.
          EXTRA_SPECS=$(node scripts/affected-e2e.mjs)
          echo "Affected-tier extra specs: ${EXTRA_SPECS:-(none)}"
          # character-creation.spec is excluded (#490) — confirmed in run 743
          # to be a real step-3 PATCH waiter race, separate from the Zod
          # cascade that #501 fixed. Re-enable only after the underlying race
          # is investigated and the waiter is hardened (or the wizard's
          # debounce is stabilised).
          cd tests && ./node_modules/.bin/playwright test \
            e2e/a11y.spec.ts \
            e2e/dashboard.spec.ts \
            e2e/death-timer.spec.ts \
            e2e/crit-banner.spec.ts \
            e2e/campaign-creation.spec.ts \
            e2e/level-up.spec.ts \
            e2e/condition-expiry.spec.ts \
            e2e/dm-player-visibility.spec.ts \
            e2e/character-sheet-ownership-gating.spec.ts \
            e2e/picker-commits.spec.ts \
            e2e/combat-damage.spec.ts \
            e2e/1522-combat-core-cluster.spec.ts \
            e2e/1531-morale-raw-logging.spec.ts \
            e2e/rest-button.spec.ts \
            e2e/spell-exhaustion.spec.ts \
            e2e/theme-contrast.spec.ts \
            e2e/773-help-page.spec.ts \
            e2e/1360-undo-revert.spec.ts \
            e2e/1917-wt-addmap-clickable.spec.ts \
            e2e/1670-layout-flip.spec.ts \
            e2e/2114-wave1-wt-chrome.spec.ts \
            e2e/2115-wave2-wt-chrome.spec.ts \
            e2e/2116-wave3-wt-chrome.spec.ts \
            $EXTRA_SPECS \
            --reporter=line

      - name: Dump server and vite logs on failure
        if: failure()
        run: |
          echo "=== server log (last 200 lines) ==="
          tail -n 200 /tmp/server.log || echo "no server log"
          echo "=== vite log (last 200 lines) ==="
          tail -n 200 /tmp/vite.log || echo "no vite log"

  # ---------------------------------------------------------------------------
  # badges — main-only join job. Feeds the shields.io endpoints in README.md
  # (#522): build, e2e, server-coverage, client-coverage, version. Waits on
  # the three primary jobs, reads their results + the coverage-summaries
  # artifact, and pushes five JSONs to MinIO via the deploy host.
  # `if: always()` so a failed gate flips the badge red instead of leaving a
  # stale green one.
  # ---------------------------------------------------------------------------
  badges:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # #1263 — SSH + badge JSON gen + MinIO upload; ~2-5 min typical
    needs: [lint-typecheck, test, smoke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download coverage summaries
        # Restores server/coverage/coverage-summary.json + client/coverage/...
        # at their original paths. continue-on-error: a failed `test` job may
        # not have produced the artifact — the badge script degrades coverage
        # entries to 'n/a' rather than failing.
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        continue-on-error: true
        with:
          name: coverage-summaries

      - name: Set up SSH for badge upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Generate + upload badge endpoints to MinIO
        # Badges are cosmetic — an SSH/MinIO outage (e.g. tunnel down because the
        # workflow can't reach the home deploy host) shouldn't fail an otherwise
        # green CI.
        continue-on-error: true
        env:
          # Job results from the three primary jobs. build = all non-smoke
          # gates green; e2e = smoke green.
          LINT_RESULT: ${{ needs.lint-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p /tmp/badges
          # Version for the badge — via the shared CHANGELOG parser
          # (scripts/app-version.mjs), the one source the client masthead +
          # server /health also use. No inline regex copy here anymore.
          # MUST be `export`ed: the `node -e` block below reads it via
          # process.env, which only sees EXPORTED shell vars — a plain
          # assignment left the badge reading undefined → "v0.0.0" (#1046 regression).
          export BADGE_VERSION="$(node scripts/app-version.mjs)"
          echo "badge version: ${BADGE_VERSION}"
          # Generate 5 shields.io endpoint JSONs. build is green only when
          # lint-typecheck AND test both succeeded; e2e tracks the smoke job.
          node -e "
            const fs = require('fs');
            const out = '/tmp/badges';
            const lint = process.env.LINT_RESULT || 'skipped';
            const test = process.env.TEST_RESULT || 'skipped';
            const smoke = process.env.SMOKE_RESULT || 'skipped';
            const buildOk = lint === 'success' && test === 'success';
            const e2eOk = smoke === 'success';
            fs.writeFileSync(out + '/build.json', JSON.stringify({
              schemaVersion: 1, label: 'build',
              message: buildOk ? 'passing' : 'failing',
              color: buildOk ? 'brightgreen' : 'red'
            }));
            fs.writeFileSync(out + '/e2e.json', JSON.stringify({
              schemaVersion: 1, label: 'e2e',
              message: e2eOk ? 'passing' : 'failing',
              color: e2eOk ? 'brightgreen' : 'red'
            }));
            // #1323 — accept multiple candidate summaries; use the first that
            // reads (combined unit∪int preferred, unit-only as fallback).
            function cov(label, ...paths) {
              for (const p of paths) {
                try {
                  const s = JSON.parse(fs.readFileSync(p));
                  const pct = s.total.lines.pct;
                  const color = pct >= 80 ? 'brightgreen' : pct >= 60 ? 'yellow' : pct >= 40 ? 'orange' : 'red';
                  return { schemaVersion: 1, label, message: pct + '%', color };
                } catch (e) { /* try next candidate */ }
              }
              return { schemaVersion: 1, label, message: 'n/a', color: 'lightgrey' };
            }
            fs.writeFileSync(out + '/server-coverage.json',
              JSON.stringify(cov('server coverage',
                './server/coverage-combined/coverage-summary.json',
                './server/coverage/coverage-summary.json')));
            fs.writeFileSync(out + '/client-coverage.json',
              JSON.stringify(cov('client coverage', './client/coverage/coverage-summary.json')));
            const version = process.env.BADGE_VERSION || '0.0.0';
            fs.writeFileSync(out + '/version.json', JSON.stringify({
              schemaVersion: 1, label: 'version', message: 'v' + version, color: 'blue'
            }));
          "
          ls -la /tmp/badges
          # Hand off to the deploy host: scp the JSONs, then exec mc inside docker
          # there (--network host so it reaches darkwatch-minio on :9000).
          # Credentials come from the deploy env file already on the host.
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" 'mkdir -p ~/tmp/badges && rm -f ~/tmp/badges/*.json'
          scp -i ~/.ssh/id_ed25519 /tmp/badges/*.json "${DEPLOY_USER}@${DEPLOY_HOST}:~/tmp/badges/"
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" bash <<'EOSSH'
          set -euo pipefail
          # Read values from .env.deploy WITHOUT sourcing it. Sourcing under
          # `set -u` blew up when one of the secret values contained a literal
          # `$D…` substring (bash would try to expand `$D…` and find it
          # unbound). grep+cut treats values as plain strings.
          ENV_FILE="$HOME/services/darkwatch/.env.deploy"
          getval() { grep -E "^$1=" "$ENV_FILE" | head -1 | cut -d= -f2-; }
          MINIO_ENDPOINT="$(getval MINIO_ENDPOINT)"
          MINIO_ROOT_USER="$(getval MINIO_ROOT_USER)"
          MINIO_ROOT_PASSWORD="$(getval MINIO_ROOT_PASSWORD)"
          MINIO_BUCKET="$(getval MINIO_BUCKET)"
          # URL-encode credentials before embedding them in the MC_HOST URL.
          # Without this, special chars in the password (`$`, `/`, `@`, `:`,
          # `%`, etc.) made `mc` compute the wrong S3 signature and every cp
          # failed with "signature does not match".
          urlenc() { python3 -c 'import sys, urllib.parse as u; sys.stdout.write(u.quote(sys.argv[1], safe=""))' "$1"; }
          ENC_USER="$(urlenc "$MINIO_ROOT_USER")"
          ENC_PASS="$(urlenc "$MINIO_ROOT_PASSWORD")"
          ENDPOINT_AUTH="${MINIO_ENDPOINT/:\/\//://${ENC_USER}:${ENC_PASS}@}"
          docker run --rm --network host \
            -v "$HOME/tmp/badges:/badges:ro" \
            -e "MC_HOST_dw=${ENDPOINT_AUTH}" \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            cp /badges/build.json /badges/e2e.json /badges/server-coverage.json /badges/client-coverage.json /badges/version.json \
              "dw/${MINIO_BUCKET}/site/"
          rm -f "$HOME"/tmp/badges/*.json
          EOSSH

  # notify-main-red — #1270. On a push to main where a primary gate failed, open
  # (or comment on) a rolling Forgejo issue so a red main is surfaced immediately
  # instead of found by chance. Because npm audit is advisory on main (a fresh
  # advisory can't block a merge), this is also how an audit regression that
  # slipped in on an unrelated merge gets attention. Self-contained: uses the
  # repo token, no external channel.
  notify-main-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck, test, smoke]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.lint-typecheck.result == 'failure'
          || needs.test.result == 'failure'
          || needs.smoke.result == 'failure')
    # issues: write so github.token can serve as the fallback poster below.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the "main CI is red" issue
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          R_LINT: ${{ needs.lint-typecheck.result }}
          R_TEST: ${{ needs.test.result }}
          R_SMOKE: ${{ needs.smoke.result }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          api, repo = os.environ["API_URL"], os.environ["REPO"]
          run_url = f'{os.environ["SERVER_URL"]}/{repo}/actions/runs/{os.environ["RUN_NUMBER"]}'
          failed = [n for n, r in (("lint-typecheck", os.environ["R_LINT"]),
                                   ("test", os.environ["R_TEST"]),
                                   ("smoke", os.environ["R_SMOKE"])) if r == "failure"]
          MARKER = "<!-- ci-main-red -->"
          body = (f"{MARKER}\n\n\U0001f534 **main CI is red** — run [#{os.environ['RUN_NUMBER']}]({run_url})\n\n"
                  f"- Commit: `{os.environ['SHA'][:12]}`\n- Failed job(s): {', '.join(failed) or 'unknown'}\n\n"
                  "_Auto-filed by ci.yml `notify-main-red` (#1270). npm audit is advisory on main, "
                  "so this also flags a fresh-advisory regression that did not block the merge._")

          # HTTP via curl, NOT urllib (#1654): forge.example.com is behind
          # Cloudflare, which fingerprint-blocks Python-urllib with a 403
          # "error code: 1010" — so every call here raised and the alert was
          # never filed on the one day it mattered. curl passes, which is why
          # the other CI API callers (label-merged-issues, diff-coverage,
          # e2e-full's notify-failure) use it. The full-scope PAT is tried
          # first; github.token is a fallback (scoped by `permissions` above).
          TOKENS = [("secrets.FORGEJO_TOKEN", os.environ.get("FORGEJO_TOKEN", "")),
                    ("github.token", os.environ.get("GH_TOKEN", ""))]
          TOKENS = [(n, t) for n, t in TOKENS if t]
          print(f"api_url={api} repo={repo} tokens available: {[n for n, _ in TOKENS]}")

          def call(method, path, payload=None):
              # Try each token; return (parsed_json_or_{}, token_name) on 2xx, else (None, None).
              for name, tok in TOKENS:
                  cmd = ["curl", "-sS", "-X", method,
                         "-H", f"Authorization: token {tok}",
                         "-H", "Content-Type: application/json",
                         "-w", "\n%{http_code}", f"{api}/repos/{repo}{path}"]
                  if payload is not None:
                      cmd += ["--data", json.dumps(payload)]
                  r = subprocess.run(cmd, capture_output=True, text=True)
                  out = r.stdout
                  nl = out.rfind("\n")
                  code, raw = (out[nl + 1:].strip(), out[:nl]) if nl >= 0 else (out.strip(), "")
                  if code.startswith("2"):
                      try:
                          return (json.loads(raw) if raw.strip() else {}, name)
                      except Exception:
                          return ({}, name)
                  print(f"  {method} {path} via {name}: HTTP {code or '?'} {raw[:150]}")
              return (None, None)

          # Find an existing open issue carrying the marker → comment; else create.
          # Best-effort read: if the list call fails, fall through to creating a
          # fresh issue rather than crashing with no alert at all.
          issues, _ = call("GET", "/issues?state=open&type=issues&limit=50")
          existing = None
          if isinstance(issues, list):
              existing = next((i["number"] for i in issues if MARKER in (i.get("body") or "")), None)
          if existing:
              res, name = call("POST", f"/issues/{existing}/comments", {"body": body})
              action = f"commented on existing red-main issue #{existing}"
          else:
              res, name = call("POST", "/issues", {"title": "\U0001f534 main CI is red", "body": body})
              action = f"filed a new red-main issue #{res.get('number')}" if isinstance(res, dict) else "create failed"
          if res is not None:
              print(f"notify-main-red: {action} (via {name})")
          else:
              print("ERROR: could not post the main-red issue with any available token.\n"
                    "----- intended issue body -----\n" + body)
              raise SystemExit(1)
          PY
