name: CI

# Split into parallel jobs (#712): lint-typecheck / test / smoke run
# concurrently on every PR and on push-to-main; badges is a main-only join
# job. The Forgejo runner's capacity is set to 3 so the three primary jobs
# actually run in parallel rather than serialising on one slot.
#
# Smoke now runs on PRs too (#711 workflow half — the gate that pinned it
# to main-only pushes is gone). Branch protection (the other half of #711)
# is configured in the Forgejo UI, not here.
#
# LOCAL MIRROR: scripts/preflight.sh reproduces the `lint-typecheck` and
# `test` jobs for a one-command local pre-PR gate (and /ship runs it before
# opening a PR). If you change either of those jobs, update preflight.sh —
# it pins a SHA-256 of this file and will fail until reconciled.
#
# PUSH-TO-MAIN IS GATED (#2308): the `tree-gate` job below can skip
# lint-typecheck / test / smoke on a merge whose tree is byte-identical to an
# already-green PR head. It never applies to pull requests, and it fails open.
# See the job comment for the full rationale and the warn-first rollout switch.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs (#1617): a re-push stacks a second full heavy job
# set next to the stale one on the shared OrbStack VM. Pushes to main are NOT
# cancelled — badges + notify-main-red are per-push consumers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # tree-gate — #2308. Decides whether a push-to-main merge needs a fresh
  # lint-typecheck / smoke run at all. (`test` is carved out of the skip —
  # #2368: Forgejo 15's workflow_call wrapper reports FAILURE when its callee
  # skips, so its `skip` input is pinned "false" at the call site below.)
  #
  # THE JOB RUNS ON EVERY EVENT, BUT THE GATE DECIDES ONLY ON PUSH-TO-MAIN
  # (#2351): on any other event the gate step short-circuits to skip=false
  # before doing any work — no checkout, no fetch, a few seconds. It used to be
  # pinned by a job-level `if: github.event_name == 'push'`, but `test` below is
  # now a `uses:` job with `needs: [tree-gate]`, and Forgejo gives a reusable-
  # workflow call no way to survive a skipped need: an `if:` on it is evaluated
  # at PLAN time and baked in (#1620), and without one a skipped need fails the
  # call in 0s with no log. The need must therefore never be skipped, so the
  # push-only pin lives in the gate step's shell guard instead.
  #
  # A squash-merge whose TREE is byte-identical to the PR head tree that already
  # passed ci.yml re-proves nothing: the PR's run tested exactly these bytes.
  # Measured over the 40 merges before 2026-08-10, 37 were identical (92.5%) —
  # `/ship` merges origin/main into the branch before pushing, so the trees match
  # unless main moved AFTER that merge. When main DID move the trees differ and
  # the gate runs, which is precisely the green-PR-→-red-main window that
  # notify-main-red exists for. Nothing is hidden: "same tree" means "same bytes,
  # already tested".
  #
  # The one honest cost: a second run of a nondeterministic suite is a second
  # SAMPLE, and #1798 is the documented case where the identical tree was green
  # on the PR run and red on the push. See the "LIMIT OF THE CLAIM" note in
  # tree-gate-core.mjs; the decision on whether `test` stays gated is #2336.
  #
  # Logic lives in scripts/ci/tree-gate-core.mjs (pure, unit-tested); this job is
  # the I/O shell. It never fails — every unknown resolves to skip=false.
  #
  # ENFORCED since #2336 (flipped after a warn-first burn-in, #2308→#2337):
  # six push-to-main runs showed the decision reading correctly on both
  # branches (WOULD SKIP on identical trees, a named run-reason when main had
  # advanced), and the nightly backstop (#2351) now re-runs the unit+int suite
  # against main daily AND blocks the deploy on it — so skipping the per-merge
  # duplicate of `test` trades a same-bytes-minutes-later rerun for a
  # better-varied daily sample (the #1798 trade, accepted explicitly on #2336).
  # To revert to warn-first, remove `TREE_GATE_ENFORCE` from the gate step's
  # `env:` below — the decision logging stays identical either way.
  # ---------------------------------------------------------------------------
  tree-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # `skip` is the only one other jobs consume. The warn-first "would have
      # skipped" signal is a log line in this job (grep the run log), not an
      # output — Forgejo doesn't expose job outputs over the API, so promoting it
      # here would add config nothing can read.
      skip: ${{ steps.gate.outputs.skip }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      # Default depth 1 is enough: the job needs HEAD's subject and tree, plus a
      # one-ref shallow fetch of the PR head it does itself.
      #
      # Step-level `if:` (unlike an `if:` on a `uses:` JOB, #1620) behaves
      # normally: on non-push events these two setup steps skip, so PRs pay
      # seconds for this job, not the ~25s checkout (#2315).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          # #2315 — this job runs only `node scripts/ci/tree-gate*.mjs`, which
          # import nothing but `node:` builtins, and it never reads a tracked
          # file's *contents*. It needs COMMITS and TREES only: `git log -1
          # --format=%s`, `rev-parse HEAD^{tree}`, a depth-1 fetch of
          # `refs/pull/N/head`, and `rev-parse` of that ref's tree. No blobs.
          #
          # Measured on the first real run (task 17673, main push for #2337):
          # 45s total, of which ~25s was this checkout and ~2s was the decision.
          # Same recipe as ship-guard/acceptance-reconciliation (#2338) and
          # workflow-change-reminder (81M -> 1.6M, 3m17s -> 1.5s, #2332).
          #
          # ⚠️ The property that makes this SAFE, and it is not obvious: sparse
          # checkout changes what is written to DISK, never a tree object's SHA.
          # `HEAD^{tree}` is the full-repo root tree either way — verified
          # locally against a full checkout (both `f1565737970b` for 7a04f42e),
          # and the skip path still reached `skip=true` on #2337's merge inside
          # a partial+sparse+shallow clone (852K .git). A sparse working tree
          # therefore cannot skew the comparison the gate is built on.
          #
          # `filter` alone would be a no-op (#2338): a full working tree lazily
          # re-fetches every tip blob. The sparse list is what does the work.
          filter: blob:none
          sparse-checkout: |
            scripts/ci

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: "22"

      - name: Decide whether this merge needs a fresh gate run
        id: gate
        env:
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          # Reading commit statuses only; github.token is the fallback exactly as
          # in notify-main-red below.
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # #2336 — skips are REAL. Remove this line to fall back to warn-first
          # ("WOULD SKIP" logging with nothing skipped); see the job comment.
          TREE_GATE_ENFORCE: "1"
        # No npm install: the script is Node built-ins + git + curl.
        run: |
          # ⚠️ SAFETY INVARIANT (#2351): the gate may only ever subtract a
          # push-to-main run. On every other event — pull_request above all —
          # it must emit skip=false unconditionally, because a skipped heavy
          # job posts a `success` commit status and the gate would certify
          # itself off it (see the lint-typecheck comment). This guard is the
          # replacement for the job-level push-only `if:` (see the job comment
          # for why that had to go).
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=not a push to main; the gate only ever subtracts a main run" >> "$GITHUB_OUTPUT"
            echo "Not a push to main ($GITHUB_EVENT_NAME on $GITHUB_REF) — skip=false, gate logic not run."
            exit 0
          fi
          node scripts/ci/tree-gate.mjs

  # ---------------------------------------------------------------------------
  # lint-typecheck — static checks + compile. No DB, no build artifacts.
  # Fastest signal: a typecheck or grep-gate failure surfaces here in well
  # under a minute without waiting on tests or smoke.
  # ---------------------------------------------------------------------------
  lint-typecheck:
    runs-on: ubuntu-latest
    needs: [tree-gate]
    # #2308. `!cancelled()` is load-bearing as the fail-open: if tree-gate
    # FAILS (or its script crashes), `skip` is empty, which is != 'true', so
    # these jobs run — and a status function is what keeps a job alive when its
    # need didn't succeed. A broken gate costs CI minutes, never coverage. Do
    # NOT swap in always(): that would also run these on an explicitly
    # cancelled run. (tree-gate used to be SKIPPED on PRs, which this condition
    # also survived; since #2351 it runs on every event instead — see its job
    # comment — so on a PR it completes with skip=false and this is an ordinary
    # satisfied need.)
    #
    # ⚠️ This condition must never skip this job on a `pull_request`. Forgejo
    # posts a `success` commit status for a SKIPPED job (verified 2026-08-10:
    # `CI / badges (pull_request)` reads success on every PR), and tree-gate
    # reads exactly those statuses as proof the PR run was green. A job that can
    # skip on a PR would therefore certify itself. The shell guard at the top of
    # tree-gate's decide step pins the gate to push-to-main (skip=false on
    # everything else) so that it can only ever subtract a *main* run.
    if: ${{ !cancelled() && needs.tree-gate.outputs.skip != 'true' }}
    timeout-minutes: 15 # #1263 — npm install + static checks + tsc + build; ~5-8 min typical
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # #2315 — this job throws the 21M of Playwright visual baselines away.
          # Excluding them measured 31% less transfer and 35% less checkout time
          # per clone on a 6-way concurrent bench; only visual-regression.yml's
          # `visual` job reads them (e2e-full sets E2E_SKIP_VISUAL, and they are
          # not in SMOKE_SPECS).
          #
          # `filter` alone is a NO-OP with a full working tree (#2338) — the
          # sparse list is what stops the lazy re-fetch of tip blobs. And
          # cone-mode MUST be off: cone mode rejects `!` patterns outright
          # (`fatal: specify directories rather than patterns`) and leaves the
          # full tree, so this would silently be a no-op with it on.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/e2e/visual-regression.spec.ts-snapshots

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json

      - name: Fetch base ref (inventory drift Check 2 needs origin/main)
        run: git fetch --no-tags --depth=200 origin main || true

      - name: Assert workflow Node.js versions are consistent
        run: |
          set -e
          VERSIONS=$(grep -hE "^[[:space:]]+node-version:[[:space:]]+" .forgejo/workflows/*.yml \
            | sed "s/.*node-version:[[:space:]]*//" | tr -d "' " | sort -u)
          COUNT=$(echo "$VERSIONS" | grep -c .)
          if [ "$COUNT" -ne "1" ]; then
            echo "FAIL: mismatched node-version across workflows:"
            grep -rn "node-version:" .forgejo/workflows/*.yml
            exit 1
          fi
          echo "OK — all workflows use Node.js $VERSIONS"

      - name: Forbid bare `npx <bin>` in workflows (typosquat fallthrough guard)
        run: |
          # `npx <bin>` silently fetches + runs a public-registry package if
          # the local install is missing — a typosquat fallthrough vector
          # (#722). Require either a direct ./node_modules/.bin path, or an
          # npx call whose first argument is a flag (`--no-install` exits
          # non-zero instead of fetching; `-p <pkg>` pins the package). The
          # `awk -F'#'` strips trailing comments before matching so a `#`
          # comment that mentions npx doesn't trip the gate. The pattern
          # matches `npx ` + a lowercase letter (a real bin name) — so the
          # `npx <bin>` / `npx --no-install` literals in this step's own
          # name + echo strings don't self-trigger.
          hits=$(for f in .forgejo/workflows/*.yml; do
            awk -F'#' -v fn="$f" '{print fn ":" NR ":" $1}' "$f"
          done | grep -E 'npx [a-z]' || true)
          if [ -n "$hits" ]; then
            echo "ERROR: bare 'npx <bin>' found in a workflow — use"
            echo "  ./node_modules/.bin/<bin>   (preferred), or"
            echo "  npx --no-install <bin>      (fails fast instead of fetching)"
            echo "$hits"
            exit 1
          fi
          echo "OK — no bare 'npx <bin>' in workflows"

      - name: Forbid urllib HTTP calls in workflows (Cloudflare 403 guard)
        run: |
          # forge.example.com sits behind Cloudflare, which fingerprint-blocks
          # Python's urllib HTTP client with a 403 "error code: 1010". A workflow
          # that reaches for it to call the Forgejo API therefore ALWAYS fails —
          # and, because these are notify/alert jobs that rarely fire, it fails
          # silently for months (#1654: notify-main-red never filed a single
          # alert). curl is the proven transport. urllib.parse (quoting, no I/O)
          # is fine — this gate only matches the HTTP client.
          #
          # The pattern is written `urllib[.]request` so this step's own source
          # line does not satisfy the regex it defines. `awk -F'#'` strips
          # trailing comments first, so prose mentioning it above doesn't trip.
          hits=$(for f in .forgejo/workflows/*.yml; do
            awk -F'#' -v fn="$f" '{print fn ":" NR ":" $1}' "$f"
          done | grep -E 'urllib[.]request' || true)
          if [ -n "$hits" ]; then
            echo "ERROR: a workflow calls the Forgejo API via Python urllib."
            echo "  Cloudflare 403s it (error code: 1010) — the call can never succeed."
            echo "  Use curl instead; see the 'call()' helper in notify-main-red (ci.yml)."
            echo "$hits"
            exit 1
          fi
          echo "OK — no urllib HTTP calls in workflows"

      - name: Enforce e2e specs are in a declared test tier (#1270)
        # Drift guard: every tests/e2e/*.spec.ts must be in the per-PR smoke list
        # (below) OR in tests/e2e/nightly-only.txt. A spec in neither runs in no
        # pre-merge tier and only surfaces in the nightly full suite — how
        # theme-contrast broke the deploy. No deps needed (pure node + repo files).
        run: node scripts/check-wt-filter-parity.mjs

      - name: Ban external image_url in e2e specs (#1411)
        # #1369 removed 14 Wikimedia image_url usages; this guard prevents regression.
        # External https:// image_url values cause flaky CI when the host rate-limits.
        # Use uploadSampleMapImage() from tests/helpers/campaign.ts instead.
        run: node scripts/check-e2e-external-images.mjs

      - name: Install server dependencies
        run: |
          cd server && npm ci --no-audit --no-fund
          # npm bug #4828: platform-specific optional bindings can be skipped when
          # the runner's Node doesn't satisfy the package's engines field.
          # Force-install the runner-arch rolldown binding if npm ci missed it
          # (arch-aware since the x64 runner joined the arm64 fleet).
          ROLLDOWN_ARCH=$(node -p "process.arch")
          if [ ! -d "node_modules/@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu" ]; then
            VER=$(node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(l.packages['node_modules/@rolldown/binding-linux-'+process.arch+'-gnu'].version)")
            echo "Patching missing rolldown linux-${ROLLDOWN_ARCH} binding @ $VER"
            npm install --no-save --ignore-engines "@rolldown/binding-linux-${ROLLDOWN_ARCH}-gnu@$VER"
          fi

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      # ESLint lives at the repo root (flat config + plugins are root devDeps).
      # The current rule set is NOT type-aware, so client/server node_modules
      # aren't required to lint them — only the root install is.
      - name: Install root dependencies (ESLint)
        run: npm ci --no-audit --no-fund

      # #413 — Fail PRs that introduce high/critical vulnerabilities.
      # Moderate findings are tracked but not gating (uuid<14 via svix/resend
      # is a known moderate; --audit-level=high skips moderates).
      #
      # #1270 — npm audit is BLOCKING on PRs (a PR that adds a vulnerable dep
      # fails here) but ADVISORY on push-to-main. npm audit reads the LIVE
      # advisory feed, so a *fresh* advisory on already-merged deps would
      # otherwise retro-fail an unrelated commit on main (the multer incident,
      # #1273) — green at PR time, red at merge time. On main we warn instead;
      # the `notify-main-red` job surfaces it and weekly Renovate patches it.
      #
      # #1883 — the gate now runs through `scripts/audit-gate.mjs`, which wraps
      # `npm audit --json` and applies `scripts/audit-allowlist.json`. Rationale:
      # `npm audit --audit-level=high` is all-or-nothing, so a single unfixable-
      # but-UNREACHABLE advisory forces a choice between leaving every PR red and
      # dropping the gate entirely. The wrapper narrows the exception to a named
      # GHSA in a named workspace, with a written justification and a hard expiry
      # (past it the gate goes red again, forcing re-review). Severity policy is
      # unchanged: high + critical gate, moderate/low do not.
      # #2159 — the ROOT workspace is gated too. It was omitted when this gate
      # was written, on the reasoning that it carries no runtime dependencies
      # ("dependencies": {} — 14 devDependencies), so nothing in it reaches the
      # production image. True, but the consequence was that root accumulated
      # advisories silently and nobody learned about them until someone ran
      # audit-gate.mjs by hand — eight had piled up by 2026-08-03, including one
      # whose only offered "fix" was a destructive downgrade of Lighthouse CI.
      # Gating it means a PR that adds a vulnerable dev tool says so at PR time,
      # which is the whole point of the gate; genuinely unfixable ones go in the
      # allowlist with an expiry, as tmp and js-yaml now are.
      #
      # #2391 — audit-gate.mjs is now DIFF-AWARE on `pull_request`, with no
      # change to these steps. It self-detects the event from GITHUB_EVENT_NAME
      # / GITHUB_EVENT_PATH, fetches the base branch tip and, when the diff
      # touches no package.json, no lockfile and not the allowlist, reports
      # findings as ::warning:: and exits 0 — because an advisory the live feed
      # published mid-PR is equally true of the base, so the PR did not cause
      # it. A PR that DOES touch dependencies still hard-fails here, and every
      # error path (no event file, failed fetch, failed diff) runs the full
      # blocking gate. Ambient advisories are reported by the scheduled
      # .forgejo/workflows/audit-watch.yml, not dropped.
      - name: Security audit (root)
        run: |
          if node scripts/audit-gate.mjs .; then exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          echo "::warning::npm audit (root) found high-severity advisories — advisory on main (not blocking)."

      - name: Security audit (server)
        run: |
          if node scripts/audit-gate.mjs server; then exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          echo "::warning::npm audit (server) found high-severity advisories — advisory on main (not blocking)."

      - name: Security audit (client)
        run: |
          if node scripts/audit-gate.mjs client; then exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          echo "::warning::npm audit (client) found high-severity advisories — advisory on main (not blocking)."

      - name: Enforce soft-delete filters on core tables
        run: |
          # The three core repository files for soft-deleted tables must each
          # contain a deleted_at filter. Fails fast if any file omits it.
          fail=0
          for f in \
            server/src/repositories/campaignRepository.ts \
            server/src/repositories/characterRepository.ts \
            server/src/repositories/campaignMembershipRepository.ts; do
            if ! grep -q "deleted_at" "$f"; then
              echo "FAIL: $f has no deleted_at filter"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Soft-delete filter check passed." || exit 1

      - name: Forbid numeric ID patterns
        run: |
          set -e
          if grep -rnE "Number\s*\(\s*req\.params" server/src client/src 2>/dev/null; then
            echo "ERROR: Number() coercion on req.params is no longer valid — IDs are UUIDs."
            exit 1
          fi
          # Entity ID fields typed as number in production source (tests may legitimately
          # use numeric IDs for unrelated counters, so exclude test files). Catches both
          # snake_case (user_id) and camelCase (characterId, campaignId) forms.
          # Excludes RAF/timer handles (rafId, timeoutId, intervalId, frameId, animationId, timerId)
          # which are legitimately numeric browser handles, not entity IDs.
          if grep -rnE "(^|[[:space:](,{])(id|[a-zA-Z_]*_id|[a-zA-Z]+Id):[[:space:]]*number" server/src client/src \
               --include="*.ts" --include="*.tsx" \
               | grep -v -E "\.(test|spec)\.(ts|tsx)" \
               | grep -v -E "\b(rafId|timeoutId|intervalId|frameId|animationId|timerId|pollId|handlerId):" ; then
            echo "ERROR: entity ID field typed as number. IDs must be string."
            exit 1
          fi
          # typeof guards that still check "number" for ID params
          if grep -rnE "typeof[[:space:]]+[a-zA-Z_]*([Ii]d|_id)[[:space:]]*!==?[[:space:]]*\"number\"" \
               server/src client/src --include="*.ts" --include="*.tsx" \
               | grep -v -E "\.(test|spec)\.(ts|tsx)" ; then
            echo "ERROR: typeof X !== \"number\" guard on an ID param. IDs must be string."
            exit 1
          fi
          echo "OK — no numeric ID patterns found"

      - name: Record<string,unknown> budget (anti-bleed ratchet, #761)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-record-type-budget.mjs

      - name: Feature-inventory drift guard (#856)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-feature-inventory.mjs

      - name: RIGHTS-MATRIX drift guard (#1396)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-rights-matrix.mjs

      # #1564 — core/ruleset boundary guard (from the #334 gap analysis §3 P1,
      # umbrella #1563). Blocks NEW rulesets/<slug> imports, bare "shadowdark"
      # literals, and "sd:" socket strings from landing in core production
      # source. Existing leaks are grandfathered by a count ratchet in
      # scripts/ruleset-boundary-allowlist.json that shrinks as #1563 lands.
      # Escape hatch: [allow-ruleset-boundary] in the PR title.
      - name: Core/ruleset boundary guard (#1564)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-ruleset-boundary.mjs

      # #1736 — War Table styles consume --wt-* tokens only; the ONLY files
      # allowed to hold raw color literals are the theme-definition files
      # wt-theme-*.css (spec §18.2). Scans WT consumer styles (wt-tokens.css,
      # wartable.css, pages/wartable/**/*.module.css) and fails on any
      # hex/rgb/hsl literal outside the allowlist.
      - name: WT no-raw-color guard (#1736)
        run: node scripts/check-wt-raw-colors.mjs

      # #1290 — ESLint as a real gate. Until now lint only ran in the
      # bypassable lint-staged pre-commit hook (eslint --fix on staged files),
      # so rules-of-hooks / e2e-click-discipline were never enforced
      # server-side. Fails the build on any ESLint *error*. The rule set is
      # still minimal (react-hooks + e2e-click-discipline); tightening it
      # (exhaustive-deps→error, typed promise rules, import/no-cycle) and a
      # repo-wide Prettier pass are tracked as follow-ups to #1290.
      - name: Lint (ESLint)
        run: npm run lint

      # #1292 — Prettier as a gate, after the one-time code format pass. Scope
      # is code only: *.md and .forgejo/ are excluded in .prettierignore (prose
      # and CI YAML stay hand-formatted). Fails on any unformatted code file.
      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check server
        run: cd server && npm run build

      - name: Type check + build client
        run: cd client && npm run build

      # #2022 — `tests/` is a whole TypeScript project (144 .ts files, 109 e2e
      # specs) and this is its only typecheck. It used to live in `smoke`, which
      # meant a type error in a spec waited behind MariaDB + MinIO + seed +
      # server build + Vite before it surfaced, and — because preflight mirrors
      # THIS job and not `smoke` — no local gate covered it at all. PR #2021 hit
      # exactly that: preflight green twice, then CI red on a `for...of` over a
      # NodeList (tests/tsconfig.json has no `downlevelIteration`, client's does).
      #
      # It is a pure static check: no DB, no browser, no running app, ~2s. It
      # belongs in the fast job, and putting it here is what makes preflight
      # cover it automatically rather than via a bespoke check that can drift.
      #
      # No `--ignore-scripts` needed: tests/ has no postinstall, so this does not
      # pull Playwright browsers (they're baked into the smoke job's container).
      - name: Install tests dependencies (typecheck only — no browsers)
        run: cd tests && npm ci --no-audit --no-fund

      - name: Type check tests (specs + helpers + smoke-walk)
        run: cd tests && npm run typecheck

  # ---------------------------------------------------------------------------
  # test — server unit + integration + client unit + coverage-bot scripts.
  # All four coverage datasets land in this one job so the diff-coverage PR
  # comment can be assembled without cross-job artifact passing. Owns the
  # mariadb + minio service containers.
  # ---------------------------------------------------------------------------
  test:
    # #2336 — body lives in test.yml so nightly-deploy.yml can call the same
    # suite. The tree-gate wiring stays HERE on the calling job: a reusable
    # workflow cannot see its caller's `needs` context. Downstream `badges`
    # and `notify-main-red` read `needs.test.result`, which a called-workflow
    # job still provides, so their wiring is unchanged.
    #
    # ⚠️ This `needs` only works because tree-gate now runs on EVERY event
    # (#2351). A `uses:` job cannot survive a skipped need: an `if:` on it is
    # baked at plan time (#1620 — attempt 1 stored `if: false`), and without
    # one a skipped need fails the call in 0s with no log (attempt 2). If you
    # ever re-pin tree-gate to push-only, this call breaks on every PR.
    needs: [tree-gate]
    uses: ./.forgejo/workflows/test.yml
    with:
      # #2368 — tree-gate's decision is wired back in. The carve-out here was
      # never about the gate being wrong: run 9347 skipped `test.test` exactly
      # as designed, and the `uses:` WRAPPER then marked itself FAILED (0s, no
      # log) because Forgejo aggregates a SKIPPED callee job as failure.
      #
      # That aggregation is unchanged — it was re-measured on this instance
      # rather than assumed. Probe runs 9784/9785/9786 (Forgejo 15.0.0):
      #   skip-job   -> callee job SKIPPED  -> placeholder FAILURE, downstream skipped
      #   skip-steps -> callee job SUCCESS  -> placeholder SUCCESS, downstream ran
      # The v16 release notes say nothing about workflow_call status
      # aggregation, and the expansion PR (#10448) was superseded by #10525
      # which is already in our 15.0.0 — so waiting for the upgrade (#1725)
      # would not have fixed this.
      #
      # test.yml therefore no longer skips its JOB; it runs and no-ops every
      # step. The wrapper stays honest and the ~10 min is reclaimed on an
      # identical-tree merge.
      skip: ${{ needs.tree-gate.outputs.skip }}
      # #2357/#2438 — decided HERE, in the caller, because only the caller's
      # `github.ref` is native: in the callee it is whatever workflow_call
      # normalises it to, which is what made the old PR-payload guard fire on
      # PR #2447's red (#2448). A PR ref is `refs/pull/N/head`, so PRs get
      # `none` and stay silent — the PR already shows its own red. This is the
      # same expression `notify-main-red` below already trusts.
      red_alert: ${{ github.ref == 'refs/heads/main' && 'main' || 'none' }}
    secrets: inherit

  badges:
    # #2572 — PINNED TO `pi`, was `ubuntu-latest`.
    #
    # This job ssh's to DEPLOY_HOST, which resolves ONLY on m4-runner.
    # `ubuntu-latest` round-robins across m4-runner / Global-Falcon-01 /
    # Global-Falcon-02, so the upload was a coin flip: 130 of 157 runs since
    # 2026-08-01 landed on a Falcon box and every one of those failed to resolve.
    # `continue-on-error` on the upload step (correctly) kept CI green, so the
    # miss was invisible — client/server coverage badges sat unchanged for 8
    # days and ~50 merges. deploy.yml already solves this with `runs-on: pi`;
    # this job simply never got the same treatment.
    #
    # Capacity checked before pinning rather than assumed. Note the binding
    # constraint is NOT utilisation — the pi runner is `capacity: 1` ("never two
    # concurrent Pi jobs — 3.8 GB RAM, prod-resident"), so this is a ONE-SLOT
    # QUEUE now shared by deploy, deploy-1, badge and badges. What makes that
    # fine is job LENGTH, not headroom: measured on pi4-host, `deploy` averages
    # 4.5m and queues 0.02m, and `badge` runs in 0.13m. Nothing here holds the
    # slot long enough to matter.
    #
    # And `timeout-minutes` is safe against queueing, which was worth proving
    # rather than assuming: the clock starts at PICKUP, not at queue entry —
    # deploy-1 has sat 500 minutes between `created` and `started` and still
    # completed inside its 45m budget. So the 10m below is 10m of running.
    runs-on: pi
    timeout-minutes: 10 # #1263 — SSH + badge JSON gen + MinIO upload; ~2-5 min typical
    needs: [tree-gate, lint-typecheck, test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        # #2572 — sparse. This job used to take a full checkout to run one
        # script and read one file. That matters more now it runs ON the Pi,
        # which is also serving every other job's checkout at that moment.
        # `scripts/` for app-version.mjs, `docs/CHANGELOG.md` because that is
        # the version it parses. Cone mode is OFF because cone mode addresses
        # DIRECTORIES only and would drag all 12MB of docs/ in for one 1.1MB
        # file.
        with:
          filter: blob:none
          # Patterns are gitignore-syntax and ROOT-ANCHORED on purpose: bare
          # `scripts` matches at any depth and drags in server/ and tests/ for
          # their own scripts dirs. Verified on a real clone — the anchored pair
          # checks out 159 files of ~3.1k tracked, and `node
          # scripts/app-version.mjs` reads the right version from them.
          sparse-checkout: |
            /scripts/
            /docs/CHANGELOG.md
          sparse-checkout-cone-mode: false

      # #2572 — `actions/setup-node` REMOVED with the move to `runs-on: pi`.
      # The pi runner is a HOST executor with system Node 22 (see deploy.yml's
      # "Host executor: system Node 22 — no setup-node, no apt-get"), so
      # setup-node would download and install a second arm64 toolchain to do
      # nothing the host cannot already do.
      - name: Download coverage summaries
        # Restores server/coverage/coverage-summary.json + client/coverage/...
        # at their original paths. continue-on-error: a failed `test` job may
        # not have produced the artifact — the badge script degrades coverage
        # entries to 'n/a' rather than failing.
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        continue-on-error: true
        with:
          name: coverage-summaries

      - name: Set up SSH for badge upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Generate + upload badge endpoints to MinIO
        # Badges are cosmetic — an SSH/MinIO outage (e.g. tunnel down because the
        # workflow can't reach the home deploy host) shouldn't fail an otherwise
        # green CI.
        continue-on-error: true
        env:
          # #2533 — `build` only. The `e2e` badge is produced by e2e-full.yml,
          # which is where the full suite actually runs: nothing on a push to
          # main measures e2e any more, and a badge sourced from the tree-gate
          # skip would assert something only lint-typecheck + test proved.
          LINT_RESULT: ${{ needs.lint-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          # #2308 — when tree-gate skipped the three jobs, their `result` is
          # 'skipped'. Without this the build + e2e badges would go RED on a
          # merge that is provably green, which is the opposite of the truth.
          GATE_SKIPPED: ${{ needs.tree-gate.outputs.skip }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # #2595 — a UNIQUE per-run staging dir, not the fixed `/tmp/badges`.
          # `/tmp` persists across runs on this host executor (`runs-on: pi`),
          # and e2e-full.yml's `badge` job stages into the same fixed path.
          # upload-badges.sh scp's `"$SRC_DIR"/*.json` — everything present,
          # not just what THIS run wrote — so a fixed shared dir means each
          # job re-uploads the other's stale file with a fresh mtime (observed
          # live: a `badges` run re-published `e2e.json` nine minutes stale).
          # `mktemp -d` makes that structurally unreachable rather than
          # merely disciplined, and needs no cross-job coordination — each
          # producer just never sees what another producer wrote.
          BADGE_DIR="$(mktemp -d /tmp/badges-XXXXXX)"
          export BADGE_DIR
          echo "badge staging dir: ${BADGE_DIR}"
          # Version for the badge — via the shared CHANGELOG parser
          # (scripts/app-version.mjs), the one source the client masthead +
          # server /health also use. No inline regex copy here anymore.
          # MUST be `export`ed: the `node -e` block below reads it via
          # process.env, which only sees EXPORTED shell vars — a plain
          # assignment left the badge reading undefined → "v0.0.0" (#1046 regression).
          export BADGE_VERSION="$(node scripts/app-version.mjs)"
          echo "badge version: ${BADGE_VERSION}"
          # #2572 — refuse to publish a version badge we know is wrong.
          # app-version.mjs returns "0.0.0" when it cannot parse a version,
          # which is exactly what a sparse checkout missing docs/CHANGELOG.md
          # would produce — and #1046 is the precedent for that degrading
          # silently to a published "v0.0.0". Leaving the last good badge in
          # place beats overwriting it with a known-bad one.
          if [ -z "${BADGE_VERSION}" ] || [ "${BADGE_VERSION}" = "0.0.0" ]; then
            echo "::warning title=Version badge skipped::app-version.mjs returned '${BADGE_VERSION}' — docs/CHANGELOG.md may be missing from the sparse checkout (#2572). Leaving version.json at its last good value."
            export SKIP_VERSION_BADGE=1
          fi
          # Generate 4 shields.io endpoint JSONs. build is green only when
          # lint-typecheck AND test both succeeded (#2533: e2e moved out).
          node -e "
            const fs = require('fs');
            const out = process.env.BADGE_DIR;
            const lint = process.env.LINT_RESULT || 'skipped';
            const test = process.env.TEST_RESULT || 'skipped';
            // #2308 — tree-gate only sets skip=true after proving this exact
            // tree passed all three jobs on the PR head, so inheriting 'passing'
            // reports a measured result, not an assumed one.
            const gateSkipped = process.env.GATE_SKIPPED === 'true';
            const buildOk = gateSkipped || (lint === 'success' && test === 'success');
            fs.writeFileSync(out + '/build.json', JSON.stringify({
              schemaVersion: 1, label: 'build',
              message: buildOk ? 'passing' : 'failing',
              color: buildOk ? 'brightgreen' : 'red'
            }));
            // #1323 — accept multiple candidate summaries; use the first that
            // reads (combined unit∪int preferred, unit-only as fallback).
            // #2572 — returns NULL, not an 'n/a' badge, when nothing reads.
            // The comment below already argues that publishing n/a over a real
            // number makes the badge WRONG; that reasoning was applied only to
            // the gate-skipped case, while this branch happily wrote 'n/a'
            // whenever the summaries were merely UNREADABLE. That gap matters
            // more now: `download-artifact` carries continue-on-error, and it
            // has never once executed on pi4-host (that runner has only ever
            // run deploy/deploy-1/badge), so the first push-to-main after this
            // PR is its first run on a host executor. If it fails there, an
            // infra failure and a genuine absence of measurement are
            // indistinguishable, the job stays green, and the two badges this
            // PR exists to unstick would publish 'n/a' over real percentages.
            function cov(label, ...paths) {
              for (const p of paths) {
                try {
                  const s = JSON.parse(fs.readFileSync(p));
                  const pct = s.total.lines.pct;
                  const color = pct >= 80 ? 'brightgreen' : pct >= 60 ? 'yellow' : pct >= 40 ? 'orange' : 'red';
                  return { schemaVersion: 1, label, message: pct + '%', color };
                } catch (e) { /* try next candidate */ }
              }
              return null;
            }
            function writeCov(file, badge, label) {
              if (badge) { fs.writeFileSync(out + '/' + file, JSON.stringify(badge)); return; }
              console.log('::warning title=Coverage badge skipped::no readable ' + label +
                ' summary — leaving ' + file + ' at its last measured value (#2572)');
            }
            // #2308 — a skipped gate produces no coverage artifact, and cov()
            // degrades a missing summary to 'n/a'. Publishing n/a over a real
            // number would make the badge WRONG; not writing the file at all
            // leaves the last measured value in place — stale by a merge or two,
            // but true. The upload step below only copies files that exist.
            if (gateSkipped) {
              console.log('tree-gate skipped the test job — leaving the coverage badges at their last measured values');
            } else {
              writeCov('server-coverage.json', cov('server coverage',
                './server/coverage-combined/coverage-summary.json',
                './server/coverage/coverage-summary.json'), 'server coverage');
              writeCov('client-coverage.json',
                cov('client coverage', './client/coverage/coverage-summary.json'), 'client coverage');
            }
            // #2572 — the shell above sets SKIP_VERSION_BADGE when
            // app-version.mjs could not read a real version. Not writing the
            // file at all is what leaves the last good badge in place:
            // upload-badges.sh uploads only the files that EXIST (#2308).
            if (!process.env.SKIP_VERSION_BADGE) {
              const version = process.env.BADGE_VERSION || '0.0.0';
              fs.writeFileSync(out + '/version.json', JSON.stringify({
                schemaVersion: 1, label: 'version', message: 'v' + version, color: 'blue'
              }));
            }
          "
          ls -la "${BADGE_DIR}"
          # #2533 — the ssh/scp/mc upload moved to a shared script: e2e-full.yml
          # now produces the `e2e` badge (see below), and two copies of this
          # would drift.
          scripts/ci/upload-badges.sh "${BADGE_DIR}"
          rm -rf "${BADGE_DIR}"

  # notify-main-red — #1270. On a push to main where a primary gate failed, open
  # (or comment on) a rolling Forgejo issue so a red main is surfaced immediately
  # instead of found by chance. Self-contained: uses the repo token, no external
  # channel.
  #
  # #2391 — this job does NOT cover ambient npm-audit advisories, and a comment
  # here used to claim it did. It fires only when lint-typecheck / test / smoke
  # FAIL; the audit is advisory on main, so audit-gate.mjs exits 0, the step
  # warns, lint-typecheck stays green and nothing here ever ran. A fresh
  # advisory against an unchanged main therefore opened no issue at all. That
  # gap is now filled by the scheduled `ambient-report` job in
  # .forgejo/workflows/audit-watch.yml, which runs the whole-tree gate against
  # main on its own rolling issue.
  #
  # #2308 — deliberately NOT taught about tree-gate. When the gate skips the
  # three jobs their result is 'skipped', which is not 'failure', so this stays
  # quiet. That is correct: a skip means an identical tree already went green, so
  # there is no red main to report.
  notify-main-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck, test]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.lint-typecheck.result == 'failure'
          || needs.test.result == 'failure'
          )
    # issues: write so github.token can serve as the fallback poster below.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the "main CI is red" issue
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          R_LINT: ${{ needs.lint-typecheck.result }}
          R_TEST: ${{ needs.test.result }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          api, repo = os.environ["API_URL"], os.environ["REPO"]
          run_url = f'{os.environ["SERVER_URL"]}/{repo}/actions/runs/{os.environ["RUN_NUMBER"]}'
          failed = [n for n, r in (("lint-typecheck", os.environ["R_LINT"]),
                                   ("test", os.environ["R_TEST"]),
                                   ) if r == "failure"]
          MARKER = "<!-- ci-main-red -->"
          body = (f"{MARKER}\n\n\U0001f534 **main CI is red** — run [#{os.environ['RUN_NUMBER']}]({run_url})\n\n"
                  f"- Commit: `{os.environ['SHA'][:12]}`\n- Failed job(s): {', '.join(failed) or 'unknown'}\n\n"
                  "_Auto-filed by ci.yml `notify-main-red` (#1270). Ambient npm-audit advisories "
                  "are NOT reported here — see audit-watch.yml's rolling issue (#2391)._")

          # HTTP via curl, NOT urllib (#1654): forge.example.com is behind
          # Cloudflare, which fingerprint-blocks Python-urllib with a 403
          # "error code: 1010" — so every call here raised and the alert was
          # never filed on the one day it mattered. curl passes, which is why
          # the other CI API callers (label-merged-issues, diff-coverage,
          # e2e-full's notify-failure) use it. The full-scope PAT is tried
          # first; github.token is a fallback (scoped by `permissions` above).
          TOKENS = [("secrets.FORGEJO_TOKEN", os.environ.get("FORGEJO_TOKEN", "")),
                    ("github.token", os.environ.get("GH_TOKEN", ""))]
          TOKENS = [(n, t) for n, t in TOKENS if t]
          print(f"api_url={api} repo={repo} tokens available: {[n for n, _ in TOKENS]}")

          def call(method, path, payload=None):
              # Try each token; return (parsed_json_or_{}, token_name) on 2xx, else (None, None).
              for name, tok in TOKENS:
                  cmd = ["curl", "-sS", "-X", method,
                         "-H", f"Authorization: token {tok}",
                         "-H", "Content-Type: application/json",
                         "-w", "\n%{http_code}", f"{api}/repos/{repo}{path}"]
                  if payload is not None:
                      cmd += ["--data", json.dumps(payload)]
                  r = subprocess.run(cmd, capture_output=True, text=True)
                  out = r.stdout
                  nl = out.rfind("\n")
                  code, raw = (out[nl + 1:].strip(), out[:nl]) if nl >= 0 else (out.strip(), "")
                  if code.startswith("2"):
                      try:
                          return (json.loads(raw) if raw.strip() else {}, name)
                      except Exception:
                          return ({}, name)
                  print(f"  {method} {path} via {name}: HTTP {code or '?'} {raw[:150]}")
              return (None, None)

          # Find an existing open issue carrying the marker → comment; else create.
          # Best-effort read: if the list call fails, fall through to creating a
          # fresh issue rather than crashing with no alert at all.
          #
          # #2303 — same two fixes as e2e-full.yml's `notify-failure`, applied
          # here because the defect is identical, not because this one misfired.
          # Nothing currently quotes `<!-- ci-main-red -->` in an open issue, so
          # this half is fragile rather than armed — but the fix is the same line
          # and leaving one copy naive is how it comes back. (1) the marker must
          # LEAD the body: an issue discussing a marker contains it, and only the
          # rolling issue starts with it — every body created below begins
          # f"{MARKER}\n\n". (2) paginate: 50 per page against 280 open issues
          # means the rolling issue drops off page 1 within days, after which a
          # fresh one is filed every red push. Tested equivalent:
          # pickDashboard() in scripts/ci/flaky-report-core.mjs.
          issues = []
          for page in range(1, 9):
              batch, _ = call("GET", f"/issues?state=open&type=issues&limit=50&page={page}")
              if not isinstance(batch, list):
                  break
              issues.extend(batch)
              if len(batch) < 50:
                  break
          existing = next(
              (i["number"] for i in issues if (i.get("body") or "").lstrip().startswith(MARKER)),
              None,
          )
          if existing:
              res, name = call("POST", f"/issues/{existing}/comments", {"body": body})
              action = f"commented on existing red-main issue #{existing}"
          else:
              res, name = call("POST", "/issues", {"title": "\U0001f534 main CI is red", "body": body})
              action = f"filed a new red-main issue #{res.get('number')}" if isinstance(res, dict) else "create failed"
          if res is not None:
              print(f"notify-main-red: {action} (via {name})")
          else:
              print("ERROR: could not post the main-red issue with any available token.\n"
                    "----- intended issue body -----\n" + body)
              raise SystemExit(1)
          PY
