name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          # CI DB credentials come from Forgejo repo secrets (Settings → Secrets).
          # Required: CI_DB_ROOT_PASSWORD, CI_DB_NAME, CI_DB_USER, CI_DB_PASSWORD.
          # See .forgejo/workflows/README.md for details.
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="mariadb-admin ping -u root -p${{ secrets.CI_DB_ROOT_PASSWORD }} --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: cd server && npm install

      - name: Enforce soft-delete filters on core tables
        run: |
          # The three core repository files for soft-deleted tables must each
          # contain a deleted_at filter. Fails fast if any file omits it.
          fail=0
          for f in \
            server/src/repositories/campaignRepository.ts \
            server/src/repositories/characterRepository.ts \
            server/src/repositories/campaignMembershipRepository.ts; do
            if ! grep -q "deleted_at" "$f"; then
              echo "FAIL: $f has no deleted_at filter"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Soft-delete filter check passed." || exit 1

      - name: Type check server
        run: cd server && npm run build

      - name: Test server
        run: cd server && npm run test:coverage

      - name: Wait for MariaDB (for Kysely schema check)
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Verify Kysely schema types are up-to-date
        env:
          DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@mariadb:3306/${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:verify

      - name: Integration tests (repositories against real DB)
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run test:int

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build

      - name: Test client
        run: cd client && npm run test:coverage

      - name: Forbid numeric ID patterns
        run: |
          set -e
          if grep -rnE "Number\s*\(\s*req\.params" server/src client/src 2>/dev/null; then
            echo "ERROR: Number() coercion on req.params is no longer valid — IDs are UUIDs."
            exit 1
          fi
          # Entity ID fields typed as number in production source (tests may legitimately
          # use numeric IDs for unrelated counters, so exclude test files). Catches both
          # snake_case (user_id) and camelCase (characterId, campaignId) forms.
          # Excludes RAF/timer handles (rafId, timeoutId, intervalId, frameId, animationId, timerId)
          # which are legitimately numeric browser handles, not entity IDs.
          if grep -rnE "(^|[[:space:](,{])(id|[a-zA-Z_]*_id|[a-zA-Z]+Id):[[:space:]]*number" server/src client/src \
               --include="*.ts" --include="*.tsx" \
               | grep -v -E "\.(test|spec)\.(ts|tsx)" \
               | grep -v -E "\b(rafId|timeoutId|intervalId|frameId|animationId|timerId|pollId|handlerId):" ; then
            echo "ERROR: entity ID field typed as number. IDs must be string."
            exit 1
          fi
          # typeof guards that still check "number" for ID params
          if grep -rnE "typeof[[:space:]]+[a-zA-Z_]*([Ii]d|_id)[[:space:]]*!==?[[:space:]]*\"number\"" \
               server/src client/src --include="*.ts" --include="*.tsx" \
               | grep -v -E "\.(test|spec)\.(ts|tsx)" ; then
            echo "ERROR: typeof X !== \"number\" guard on an ID param. IDs must be string."
            exit 1
          fi
          echo "OK — no numeric ID patterns found"

      - name: Report server coverage
        uses: https://github.com/davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: Server
          json-summary-path: server/coverage/coverage-summary.json
          json-final-path: server/coverage/coverage-final.json

      - name: Report client coverage
        uses: https://github.com/davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: Client
          json-summary-path: client/coverage/coverage-summary.json
          json-final-path: client/coverage/coverage-final.json

      # ---------------------------------------------------------------------------
      # E2E tests — disabled (if: false) until CI runner has enough RAM for Chromium.
      # To re-enable: remove the `if: false` lines below.
      # To run manually: cd tests && npx playwright test
      # ---------------------------------------------------------------------------

      - name: Wait for MariaDB
        if: false
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Start E2E app server
        if: false
        env:
          PORT: "3001"
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          NODE_ENV: test
          ALLOW_TEST_HOOKS: "true"
          JWT_SECRET: e2e-test-secret
          CLIENT_URL: http://localhost:5173
          # Cap Node.js heap on Pi4 CI — Express server has no natural limit
          # and can grow to 1.5 GB under default V8 settings, crowding out
          # Vite and Chromium during the E2E phase.
          NODE_OPTIONS: "--max-old-space-size=256"
        run: |
          node server/dist/index.js &
          # Wait for server on port 3001 — accept 200 or 401, reject 5xx/no-response
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/auth/me 2>/dev/null || true)
            echo "$status" | grep -qE '^(200|401)$' && break || true
            echo "Waiting for app server... ($i/30) [got: $status]"
            sleep 2
            [ "$i" -eq 30 ] && echo "App server never became ready" && exit 1
          done

      - name: Start Vite preview server
        if: false
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          cd client && npx vite preview &
          VITE_PID=$!
          echo $VITE_PID > /tmp/vite.pid
          # Wait for Vite on port 5173
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite preview server never became ready" && exit 1
          done

      - name: Install Playwright and browsers
        if: false
        run: cd tests && npm ci && npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests (stabilize-ownership)
        if: false
        env:
          E2E_SERVER_URL: "http://localhost:3001"
        run: cd tests && npx playwright test e2e/stabilize-ownership.spec.ts --reporter=line

      - name: Restart Vite preview (clear memory between E2E batches)
        if: false
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          kill $(cat /tmp/vite.pid) 2>/dev/null || pkill -f "vite preview" || true
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:5173 || break
            echo "Waiting for old Vite to stop... ($i/15)"
            sleep 1
          done
          cd client && npx vite preview &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for new Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite never came back up" && exit 1
          done

      - name: Run Playwright E2E tests (batch 1)
        if: false
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          E2E_SKIP_STABILIZE: "true"
        run: |
          cd tests && npx playwright test \
            e2e/condition-expiry.spec.ts \
            e2e/creature-gallery.spec.ts \
            e2e/crit-banner.spec.ts \
            e2e/dashboard.spec.ts \
            e2e/death-recovery.spec.ts \
            e2e/death-timer.spec.ts \
            e2e/level-up.spec.ts \
            --reporter=line

      - name: Restart Vite preview (batch 2 memory reset)
        if: false
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          kill $(cat /tmp/vite.pid) 2>/dev/null || pkill -f "vite preview" || true
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:5173 || break
            echo "Waiting for old Vite to stop... ($i/15)"
            sleep 1
          done
          cd client && npx vite preview &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for new Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite never came back up" && exit 1
          done

      - name: Run Playwright E2E tests (batch 2)
        if: false
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          E2E_SKIP_STABILIZE: "true"
        run: cd tests && npx playwright test e2e/rest-button.spec.ts --reporter=line

      - name: Restart Vite preview (batch 3 memory reset)
        if: false
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          kill $(cat /tmp/vite.pid) 2>/dev/null || pkill -f "vite preview" || true
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:5173 || break
            echo "Waiting for old Vite to stop... ($i/15)"
            sleep 1
          done
          cd client && npx vite preview &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for new Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite never came back up" && exit 1
          done

      - name: Run Playwright E2E tests (batch 3)
        if: false
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          E2E_SKIP_STABILIZE: "true"
        run: cd tests && npx playwright test e2e/spell-exhaustion.spec.ts --reporter=line

      - name: Generate coverage badge endpoints
        if: false  # autodeploy paused — UUID migration in progress; re-enable by removing `if: false` lines
        run: |
          node -e "
            const fs = require('fs');
            function badge(label, summaryPath, outPath) {
              const s = JSON.parse(fs.readFileSync(summaryPath));
              const pct = s.total.lines.pct;
              const color = pct >= 80 ? 'brightgreen' : pct >= 60 ? 'yellow' : pct >= 40 ? 'orange' : 'red';
              fs.writeFileSync(outPath, JSON.stringify({ schemaVersion: 1, label, message: pct + '%', color }));
            }
            badge('server coverage', './server/coverage/coverage-summary.json', '/var/www/brochure/server-coverage.json');
            badge('client coverage', './client/coverage/coverage-summary.json', '/var/www/brochure/client-coverage.json');
          "

      - name: Install Docker CLI
        if: false  # autodeploy paused — UUID migration in progress; re-enable by removing `if: false` lines
        run: |
          apt-get update -qq && apt-get install -y -qq docker.io curl
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

      - name: Build server Docker image
        if: false  # autodeploy paused — UUID migration in progress; re-enable by removing `if: false` lines
        run: docker build -t darkwatch-server:latest ./server

      - name: Copy client build to webroot
        if: false  # autodeploy paused — UUID migration in progress; re-enable by removing `if: false` lines
        run: cp -r client/dist/. /var/www/darkwatch/

      - name: Copy brochure to webroot
        if: false  # autodeploy paused — UUID migration in progress; re-enable by removing `if: false` lines
        run: |
          mkdir -p /var/www/brochure
          cp site/style.css site/main.js /var/www/brochure/
          cp -r site/assets /var/www/brochure/
          # Bust browser cache for screenshot PNGs by appending the commit hash
          # to every .png reference in the HTML — ensures deploys show fresh images.
          HASH=$(git rev-parse --short HEAD)
          sed "s/\.png\"/\.png?v=${HASH}\"/g" site/index.html > /var/www/brochure/index.html

      - name: Deploy server container
        if: false  # autodeploy paused — UUID migration in progress; re-enable by removing `if: false` lines
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          docker rm -f darkwatch-server 2>/dev/null || true
          docker-compose -f /home/ci/services/darkwatch/docker-compose.yml up -d --remove-orphans
