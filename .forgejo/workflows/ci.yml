name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Type check server
        run: cd server && npm run build

      - name: Test server
        run: cd server && npm run test:coverage

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build

      - name: Test client
        run: cd client && npm run test:coverage

      - name: Install Docker Compose
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          apt-get update -qq && apt-get install -y -qq docker.io curl
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

      - name: Build server Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker build -t darkwatch-server:latest ./server

      - name: Copy client build to webroot
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cp -r client/dist/. /var/www/darkwatch/

      - name: Deploy server container
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          docker-compose -f /home/ci/services/darkwatch/docker-compose.yml up -d --force-recreate
