name: CI

# Split into parallel jobs (#712): lint-typecheck / test / smoke run
# concurrently on every PR and on push-to-main; badges is a main-only join
# job. The Forgejo runner's capacity is set to 3 so the three primary jobs
# actually run in parallel rather than serialising on one slot.
#
# Smoke now runs on PRs too (#711 workflow half — the gate that pinned it
# to main-only pushes is gone). Branch protection (the other half of #711)
# is configured in the Forgejo UI, not here.
#
# LOCAL MIRROR: scripts/preflight.sh reproduces the `lint-typecheck` and
# `test` jobs for a one-command local pre-PR gate (and /ship runs it before
# opening a PR). If you change either of those jobs, update preflight.sh —
# it pins a SHA-256 of this file and will fail until reconciled.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # lint-typecheck — static checks + compile. No DB, no build artifacts.
  # Fastest signal: a typecheck or grep-gate failure surfaces here in well
  # under a minute without waiting on tests or smoke.
  # ---------------------------------------------------------------------------
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json

      - name: Assert workflow Node.js versions are consistent
        run: |
          set -e
          VERSIONS=$(grep -hE "^[[:space:]]+node-version:[[:space:]]+" .forgejo/workflows/*.yml \
            | sed "s/.*node-version:[[:space:]]*//" | tr -d "' " | sort -u)
          COUNT=$(echo "$VERSIONS" | grep -c .)
          if [ "$COUNT" -ne "1" ]; then
            echo "FAIL: mismatched node-version across workflows:"
            grep -rn "node-version:" .forgejo/workflows/*.yml
            exit 1
          fi
          echo "OK — all workflows use Node.js $VERSIONS"

      - name: Forbid bare `npx <bin>` in workflows (typosquat fallthrough guard)
        run: |
          # `npx <bin>` silently fetches + runs a public-registry package if
          # the local install is missing — a typosquat fallthrough vector
          # (#722). Require either a direct ./node_modules/.bin path, or an
          # npx call whose first argument is a flag (`--no-install` exits
          # non-zero instead of fetching; `-p <pkg>` pins the package). The
          # `awk -F'#'` strips trailing comments before matching so a `#`
          # comment that mentions npx doesn't trip the gate. The pattern
          # matches `npx ` + a lowercase letter (a real bin name) — so the
          # `npx <bin>` / `npx --no-install` literals in this step's own
          # name + echo strings don't self-trigger.
          hits=$(for f in .forgejo/workflows/*.yml; do
            awk -F'#' -v fn="$f" '{print fn ":" NR ":" $1}' "$f"
          done | grep -E 'npx [a-z]' || true)
          if [ -n "$hits" ]; then
            echo "ERROR: bare 'npx <bin>' found in a workflow — use"
            echo "  ./node_modules/.bin/<bin>   (preferred), or"
            echo "  npx --no-install <bin>      (fails fast instead of fetching)"
            echo "$hits"
            exit 1
          fi
          echo "OK — no bare 'npx <bin>' in workflows"

      - name: Install server dependencies
        run: |
          cd server && npm ci --no-audit --no-fund
          # npm bug #4828: platform-specific optional bindings can be skipped when
          # the runner's Node doesn't satisfy the package's engines field.
          # Force-install the linux-arm64 rolldown binding if npm ci missed it.
          if [ ! -d "node_modules/@rolldown/binding-linux-arm64-gnu" ]; then
            VER=$(node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(l.packages['node_modules/@rolldown/binding-linux-arm64-gnu'].version)")
            echo "Patching missing rolldown linux-arm64 binding @ $VER"
            npm install --no-save --ignore-engines "@rolldown/binding-linux-arm64-gnu@$VER"
          fi

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      # #413 — Fail PRs that introduce high/critical vulnerabilities.
      # Moderate findings are tracked but not gating (uuid<14 via svix/resend
      # is a known moderate; --audit-level=high skips moderates).
      - name: Security audit (server)
        run: cd server && npm audit --audit-level=high

      # #413 — postcss moderate is known and does not gate.
      - name: Security audit (client)
        run: cd client && npm audit --audit-level=high

      - name: Enforce soft-delete filters on core tables
        run: |
          # The three core repository files for soft-deleted tables must each
          # contain a deleted_at filter. Fails fast if any file omits it.
          fail=0
          for f in \
            server/src/repositories/campaignRepository.ts \
            server/src/repositories/characterRepository.ts \
            server/src/repositories/campaignMembershipRepository.ts; do
            if ! grep -q "deleted_at" "$f"; then
              echo "FAIL: $f has no deleted_at filter"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Soft-delete filter check passed." || exit 1

      - name: Forbid numeric ID patterns
        run: |
          set -e
          if grep -rnE "Number\s*\(\s*req\.params" server/src client/src 2>/dev/null; then
            echo "ERROR: Number() coercion on req.params is no longer valid — IDs are UUIDs."
            exit 1
          fi
          # Entity ID fields typed as number in production source (tests may legitimately
          # use numeric IDs for unrelated counters, so exclude test files). Catches both
          # snake_case (user_id) and camelCase (characterId, campaignId) forms.
          # Excludes RAF/timer handles (rafId, timeoutId, intervalId, frameId, animationId, timerId)
          # which are legitimately numeric browser handles, not entity IDs.
          if grep -rnE "(^|[[:space:](,{])(id|[a-zA-Z_]*_id|[a-zA-Z]+Id):[[:space:]]*number" server/src client/src \
               --include="*.ts" --include="*.tsx" \
               | grep -v -E "\.(test|spec)\.(ts|tsx)" \
               | grep -v -E "\b(rafId|timeoutId|intervalId|frameId|animationId|timerId|pollId|handlerId):" ; then
            echo "ERROR: entity ID field typed as number. IDs must be string."
            exit 1
          fi
          # typeof guards that still check "number" for ID params
          if grep -rnE "typeof[[:space:]]+[a-zA-Z_]*([Ii]d|_id)[[:space:]]*!==?[[:space:]]*\"number\"" \
               server/src client/src --include="*.ts" --include="*.tsx" \
               | grep -v -E "\.(test|spec)\.(ts|tsx)" ; then
            echo "ERROR: typeof X !== \"number\" guard on an ID param. IDs must be string."
            exit 1
          fi
          echo "OK — no numeric ID patterns found"

      - name: Record<string,unknown> budget (anti-bleed ratchet, #761)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-record-type-budget.mjs

      - name: Type check server
        run: cd server && npm run build

      - name: Type check + build client
        run: cd client && npm run build

  # ---------------------------------------------------------------------------
  # test — server unit + integration + client unit + coverage-bot scripts.
  # All four coverage datasets land in this one job so the diff-coverage PR
  # comment can be assembled without cross-job artifact passing. Owns the
  # mariadb + minio service containers.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          # CI DB credentials come from Forgejo repo secrets (Settings → Secrets).
          # Required: CI_DB_ROOT_PASSWORD, CI_DB_NAME, CI_DB_USER, CI_DB_PASSWORD.
          # See .forgejo/workflows/README.md for details.
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=512m
      minio:
        # The official minio/minio image needs `server /data` as its command;
        # Forgejo's act_runner supports `cmd:` in service definitions.
        # The image-library int tests create + drop a per-suite bucket against
        # this instance.
        image: minio/minio:RELEASE.2025-04-08T15-41-24Z
        cmd:
          - server
          - /data
          - --console-address
          - ":9001"
        env:
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
        options: >-
          --health-cmd="curl -fsS http://localhost:9000/minio/health/ready || exit 1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The diff-coverage comment needs history to diff against the base ref.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json

      - name: Install root devDependencies (c8 — coverage-bot scripts)
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        run: |
          cd server && npm ci --no-audit --no-fund
          if [ ! -d "node_modules/@rolldown/binding-linux-arm64-gnu" ]; then
            VER=$(node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(l.packages['node_modules/@rolldown/binding-linux-arm64-gnu'].version)")
            echo "Patching missing rolldown linux-arm64 binding @ $VER"
            npm install --no-save --ignore-engines "@rolldown/binding-linux-arm64-gnu@$VER"
          fi

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      - name: Test server (unit)
        # Always emit coverage — PR uses it for the diff-coverage comment;
        # main uses it to write the server-coverage badge.
        run: cd server && npm run test:coverage

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Wait for MinIO (image-library int tests need it)
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/minio/9000) 2>/dev/null && echo "MinIO is ready" && break
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MinIO never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Verify Kysely schema types are up-to-date
        env:
          DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@mariadb:3306/${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:verify

      - name: Seed core + shadowdark content (int tests assume seeded DB)
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run seed:core && npm run seed:shadowdark

      - name: Integration tests (repositories against real DB)
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@mariadb:3306/${{ secrets.CI_DB_NAME }}
          MINIO_ENDPOINT: http://minio:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
        run: cd server && npm run test:int:coverage

      - name: Test client (unit)
        # Always emit coverage — PR uses it for the diff-coverage comment;
        # main uses it to write the client-coverage badge.
        run: cd client && npm run test:coverage

      - name: Test coverage-bot scripts
        run: npm run test:scripts:coverage

      - name: Post diff coverage comment
        if: always() && github.event_name == 'pull_request'
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: origin/${{ github.base_ref }}
          # Dual-mode coverage: unit and integration datasets shown separately
          # with per-line gutter markers (U/I/UI) in code snippets.
          COVERAGE_FILES_UNIT: server/coverage/coverage-final.json,client/coverage/coverage-final.json,scripts/coverage/coverage-final.json
          COVERAGE_FILES_INT: server/coverage-int/coverage-final.json
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50
          node scripts/coverage-comment/build-comment.mjs \
            | node scripts/coverage-comment/post-comment.mjs

      - name: Upload coverage summaries (consumed by the badges job)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # v4 requires GHES features Forgejo's actions backend doesn't expose.
        # Pin to v3 — same constraint documented in e2e.yml.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: coverage-summaries
          path: |
            server/coverage/coverage-summary.json
            client/coverage/coverage-summary.json
          retention-days: 3

  # ---------------------------------------------------------------------------
  # smoke — critical-path Playwright specs against the built app. Runs on
  # every PR and on push-to-main (the main-only gate is gone — #711). Builds
  # its own server + client and owns its own mariadb service. The full E2E
  # suite still lives in nightly-e2e via e2e.yml.
  # ---------------------------------------------------------------------------
  smoke:
    runs-on: ubuntu-latest
    # #969 — run inside the prebuilt CI image (Node 22 + Chromium + Playwright
    # system deps baked). No apt install-deps, no browser download, no
    # actions/setup-node. Pinned to the @playwright/test version; rebuilt by
    # build-ci-image.yml (Renovate keeps the tag in sync — #414).
    container:
      image: forge.example.com/aaron/darkwatch-ci-playwright:1.60.0
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=512m
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # #969 — Node 22 is baked into the container image, so no actions/setup-node.
      # We still cache the npm download dir (what setup-node's cache:'npm' did)
      # so `npm ci` doesn't re-fetch every tarball.
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install server dependencies
        run: |
          cd server && npm ci --no-audit --no-fund
          if [ ! -d "node_modules/@rolldown/binding-linux-arm64-gnu" ]; then
            VER=$(node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(l.packages['node_modules/@rolldown/binding-linux-arm64-gnu'].version)")
            echo "Patching missing rolldown linux-arm64 binding @ $VER"
            npm install --no-save --ignore-engines "@rolldown/binding-linux-arm64-gnu@$VER"
          fi

      - name: Build server
        run: cd server && npm run build

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      - name: Build client
        run: cd client && npm run build

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Seed core + shadowdark + demo content (smoke specs assume seeded DB)
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        # The demo campaign ("Demo Campaign (Shadowdark)") is Tier 3 — it is
        # NOT created by seed:shadowdark. The smoke specs' openCampaign()
        # helper looks for it, so seed:shadowdark:demo is required. The old
        # monolith ci.yml got away without it only because the integration
        # tests ran first in the same job and left the demo campaign in the
        # shared DB as a side effect; this job has its own fresh DB. Matches
        # e2e.yml, which seeds all three tiers for the same reason.
        run: cd server && npm run seed:core && npm run seed:shadowdark && npm run seed:shadowdark:demo

      - name: Smoke — start E2E app server
        env:
          PORT: "3001"
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          NODE_ENV: test
          ALLOW_TEST_HOOKS: "true"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          JWT_SECRET: e2e-test-secret
          CLIENT_URL: http://localhost:5173
          # See e2e.yml — disable per-user/per-IP socket caps for CI runs
          # so accumulating ghost sockets between Playwright tests don't
          # block new connections.
          SOCKET_PER_USER_CAP: "1000"
          SOCKET_PER_IP_CAP: "1000"
          NODE_OPTIONS: "--max-old-space-size=256"
        run: |
          node server/dist/index.js >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/auth/me 2>/dev/null || true)
            echo "$status" | grep -qE '^(200|401)$' && break || true
            echo "Waiting for app server... ($i/30) [got: $status]"
            sleep 2
            [ "$i" -eq 30 ] && echo "App server never became ready" && exit 1
          done

      - name: Smoke — start Vite preview server
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          # Direct binary path, not `npx vite` — `npx <bin>` silently fetches
          # from the public registry if the local install is missing (#722).
          cd client && ./node_modules/.bin/vite preview >/tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite preview server never became ready" && exit 1
          done

      - name: Smoke — warm up app server (login + auth + campaigns)
        # The first specs in the suite (level-up, picker-commits) hit cold
        # connection pools, V8 JIT, and socket handlers, exceeding their
        # 12-15s waits. Issuing a few authed requests here primes the app
        # server's caches so the first specs land on warm code paths.
        run: |
          set -e
          # Capture session cookie from login
          curl -s -c /tmp/dm-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"dm@darkwatch.test","password":"password"}' >/dev/null
          curl -s -c /tmp/player-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"player@darkwatch.test","password":"password"}' >/dev/null
          # Hit the heavy authed endpoints: dashboard, campaign listing, characters,
          # rulesets catalog. Two passes so connection pool stabilises.
          for pass in 1 2; do
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/campaigns >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/dashboard >/dev/null
            curl -s -b /tmp/player-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/player-cookies.txt http://localhost:3001/api/dashboard >/dev/null
          done
          rm -f /tmp/dm-cookies.txt /tmp/player-cookies.txt
          echo "warmup complete"

      # #969 — browsers + system deps are baked into the container image at
      # /ms-playwright, so the actions/cache step and the install-deps/install
      # branch are gone. Only the tests/ npm deps remain.
      - name: Smoke — install tests deps (browsers baked in image)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && npm ci

      - name: Typecheck tests/ (specs + helpers + smoke-walk)
        run: cd tests && npm run typecheck

      - name: Smoke — run critical specs
        id: smoke_e2e
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          # character-creation.spec is excluded (#490) — confirmed in run 743
          # to be a real step-3 PATCH waiter race, separate from the Zod
          # cascade that #501 fixed. Re-enable only after the underlying race
          # is investigated and the waiter is hardened (or the wizard's
          # debounce is stabilised).
          cd tests && ./node_modules/.bin/playwright test \
            e2e/a11y.spec.ts \
            e2e/dashboard.spec.ts \
            e2e/death-timer.spec.ts \
            e2e/crit-banner.spec.ts \
            e2e/campaign-creation.spec.ts \
            e2e/level-up.spec.ts \
            e2e/condition-expiry.spec.ts \
            e2e/dm-player-visibility.spec.ts \
            e2e/character-sheet-ownership-gating.spec.ts \
            e2e/picker-commits.spec.ts \
            e2e/combat-damage.spec.ts \
            e2e/rest-button.spec.ts \
            e2e/spell-exhaustion.spec.ts \
            --reporter=line

      - name: Dump server and vite logs on failure
        if: failure()
        run: |
          echo "=== server log (last 200 lines) ==="
          tail -n 200 /tmp/server.log || echo "no server log"
          echo "=== vite log (last 200 lines) ==="
          tail -n 200 /tmp/vite.log || echo "no vite log"

  # ---------------------------------------------------------------------------
  # badges — main-only join job. Feeds the shields.io endpoints in README.md
  # (#522): build, e2e, server-coverage, client-coverage, version. Waits on
  # the three primary jobs, reads their results + the coverage-summaries
  # artifact, and pushes five JSONs to MinIO via the deploy host.
  # `if: always()` so a failed gate flips the badge red instead of leaving a
  # stale green one.
  # ---------------------------------------------------------------------------
  badges:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, smoke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download coverage summaries
        # Restores server/coverage/coverage-summary.json + client/coverage/...
        # at their original paths. continue-on-error: a failed `test` job may
        # not have produced the artifact — the badge script degrades coverage
        # entries to 'n/a' rather than failing.
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        continue-on-error: true
        with:
          name: coverage-summaries

      - name: Set up SSH for badge upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Generate + upload badge endpoints to MinIO
        # Badges are cosmetic — an SSH/MinIO outage (e.g. tunnel down because the
        # workflow can't reach the home deploy host) shouldn't fail an otherwise
        # green CI.
        continue-on-error: true
        env:
          # Job results from the three primary jobs. build = all non-smoke
          # gates green; e2e = smoke green.
          LINT_RESULT: ${{ needs.lint-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p /tmp/badges
          # Version for the badge — via the shared CHANGELOG parser
          # (scripts/app-version.mjs), the one source the client masthead +
          # server /health also use. No inline regex copy here anymore.
          # MUST be `export`ed: the `node -e` block below reads it via
          # process.env, which only sees EXPORTED shell vars — a plain
          # assignment left the badge reading undefined → "v0.0.0" (#1046 regression).
          export BADGE_VERSION="$(node scripts/app-version.mjs)"
          echo "badge version: ${BADGE_VERSION}"
          # Generate 5 shields.io endpoint JSONs. build is green only when
          # lint-typecheck AND test both succeeded; e2e tracks the smoke job.
          node -e "
            const fs = require('fs');
            const out = '/tmp/badges';
            const lint = process.env.LINT_RESULT || 'skipped';
            const test = process.env.TEST_RESULT || 'skipped';
            const smoke = process.env.SMOKE_RESULT || 'skipped';
            const buildOk = lint === 'success' && test === 'success';
            const e2eOk = smoke === 'success';
            fs.writeFileSync(out + '/build.json', JSON.stringify({
              schemaVersion: 1, label: 'build',
              message: buildOk ? 'passing' : 'failing',
              color: buildOk ? 'brightgreen' : 'red'
            }));
            fs.writeFileSync(out + '/e2e.json', JSON.stringify({
              schemaVersion: 1, label: 'e2e',
              message: e2eOk ? 'passing' : 'failing',
              color: e2eOk ? 'brightgreen' : 'red'
            }));
            function cov(label, p) {
              try {
                const s = JSON.parse(fs.readFileSync(p));
                const pct = s.total.lines.pct;
                const color = pct >= 80 ? 'brightgreen' : pct >= 60 ? 'yellow' : pct >= 40 ? 'orange' : 'red';
                return { schemaVersion: 1, label, message: pct + '%', color };
              } catch (e) {
                return { schemaVersion: 1, label, message: 'n/a', color: 'lightgrey' };
              }
            }
            fs.writeFileSync(out + '/server-coverage.json',
              JSON.stringify(cov('server coverage', './server/coverage/coverage-summary.json')));
            fs.writeFileSync(out + '/client-coverage.json',
              JSON.stringify(cov('client coverage', './client/coverage/coverage-summary.json')));
            const version = process.env.BADGE_VERSION || '0.0.0';
            fs.writeFileSync(out + '/version.json', JSON.stringify({
              schemaVersion: 1, label: 'version', message: 'v' + version, color: 'blue'
            }));
          "
          ls -la /tmp/badges
          # Hand off to the deploy host: scp the JSONs, then exec mc inside docker
          # there (--network host so it reaches darkwatch-minio on :9000).
          # Credentials come from the deploy env file already on the host.
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" 'mkdir -p ~/tmp/badges && rm -f ~/tmp/badges/*.json'
          scp -i ~/.ssh/id_ed25519 /tmp/badges/*.json "${DEPLOY_USER}@${DEPLOY_HOST}:~/tmp/badges/"
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" bash <<'EOSSH'
          set -euo pipefail
          # Read values from .env.deploy WITHOUT sourcing it. Sourcing under
          # `set -u` blew up when one of the secret values contained a literal
          # `$D…` substring (bash would try to expand `$D…` and find it
          # unbound). grep+cut treats values as plain strings.
          ENV_FILE="$HOME/services/darkwatch/.env.deploy"
          getval() { grep -E "^$1=" "$ENV_FILE" | head -1 | cut -d= -f2-; }
          MINIO_ENDPOINT="$(getval MINIO_ENDPOINT)"
          MINIO_ROOT_USER="$(getval MINIO_ROOT_USER)"
          MINIO_ROOT_PASSWORD="$(getval MINIO_ROOT_PASSWORD)"
          MINIO_BUCKET="$(getval MINIO_BUCKET)"
          # URL-encode credentials before embedding them in the MC_HOST URL.
          # Without this, special chars in the password (`$`, `/`, `@`, `:`,
          # `%`, etc.) made `mc` compute the wrong S3 signature and every cp
          # failed with "signature does not match".
          urlenc() { python3 -c 'import sys, urllib.parse as u; sys.stdout.write(u.quote(sys.argv[1], safe=""))' "$1"; }
          ENC_USER="$(urlenc "$MINIO_ROOT_USER")"
          ENC_PASS="$(urlenc "$MINIO_ROOT_PASSWORD")"
          ENDPOINT_AUTH="${MINIO_ENDPOINT/:\/\//://${ENC_USER}:${ENC_PASS}@}"
          docker run --rm --network host \
            -v "$HOME/tmp/badges:/badges:ro" \
            -e "MC_HOST_dw=${ENDPOINT_AUTH}" \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            cp /badges/build.json /badges/e2e.json /badges/server-coverage.json /badges/client-coverage.json /badges/version.json \
              "dw/${MINIO_BUCKET}/site/"
          rm -f "$HOME"/tmp/badges/*.json
          EOSSH
