name: E2E

# Full Playwright E2E suite. Runs nightly and can be triggered manually.
# Does NOT deploy — use nightly-deploy.yml or deploy.yml for that.

on:
  workflow_call:    # called by nightly-deploy.yml
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # #969 — prebuilt CI image (Node 22 + Chromium + Playwright deps baked).
    container:
      image: forge.example.com/aaron/darkwatch-ci-playwright:1.59.1
    services:
      mariadb:
        image: mariadb:11
        env:
          # CI DB credentials come from Forgejo repo secrets (Settings → Secrets).
          # Required: CI_DB_ROOT_PASSWORD, CI_DB_NAME, CI_DB_USER, CI_DB_PASSWORD.
          # See .forgejo/workflows/README.md for details.
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # #969 — Node 22 baked into the image; cache only the npm download dir.
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install server dependencies
        run: cd server && npm ci --no-audit --no-fund

      - name: Build server
        run: cd server && npm run build

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      - name: Build client
        run: cd client && npm run build

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Seed core + shadowdark content (e2e tests assume seeded DB)
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run seed:core && npm run seed:shadowdark && npm run seed:shadowdark:demo

      - name: Start E2E app server
        env:
          PORT: "3001"
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          NODE_ENV: test
          ALLOW_TEST_HOOKS: "true"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          JWT_SECRET: e2e-test-secret
          CLIENT_URL: http://localhost:5173
          # #388 cap is 5 sockets/user, 20/IP for prod abuse-prevention. E2E
          # runs all tests as the same DM user; sockets from closed Playwright
          # pages take a few seconds to register as disconnected, so they
          # accumulate faster than they're reaped and the cap rejects new
          # connections mid-batch (crit-banner & friends fail with the
          # "Reconnecting to the game…" banner). Effectively disable both caps
          # in CI — the test harness is not an abuse vector.
          SOCKET_PER_USER_CAP: "1000"
          SOCKET_PER_IP_CAP: "1000"
          NODE_OPTIONS: "--max-old-space-size=256"
        run: |
          node server/dist/index.js >/tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          # Wait for server on port 3001 — accept 200 or 401, reject 5xx/no-response
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/auth/me 2>/dev/null || true)
            echo "$status" | grep -qE '^(200|401)$' && break || true
            echo "Waiting for app server... ($i/30) [got: $status]"
            sleep 2
            [ "$i" -eq 30 ] && echo "App server never became ready" && exit 1
          done

      - name: Start Vite preview server
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          cd client && ./node_modules/.bin/vite preview >/tmp/vite.log 2>&1 &
          VITE_PID=$!
          echo $VITE_PID > /tmp/vite.pid
          # Wait for Vite on port 5173
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite preview server never became ready" && exit 1
          done

      - name: Warm up app server (login + auth + campaigns)
        # The first specs in the suite hit cold connection pools, V8 JIT,
        # and socket handlers, exceeding their 12-15s waits. Issuing a few
        # authed requests here primes the app server's caches so the first
        # specs land on warm code paths.
        run: |
          set -e
          curl -s -c /tmp/dm-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"dm@darkwatch.test","password":"password"}' >/dev/null
          curl -s -c /tmp/player-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"player@darkwatch.test","password":"password"}' >/dev/null
          for pass in 1 2; do
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/campaigns >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/dashboard >/dev/null
            curl -s -b /tmp/player-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/player-cookies.txt http://localhost:3001/api/dashboard >/dev/null
          done
          rm -f /tmp/dm-cookies.txt /tmp/player-cookies.txt
          echo "warmup complete"

      # #969 — browsers baked at /ms-playwright; just install tests/ npm deps.
      - name: Install tests dependencies (browsers baked in image)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && npm ci --no-audit --no-fund

      - name: Run Playwright E2E tests (stabilize-ownership — Death-save)
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && ./node_modules/.bin/playwright test e2e/stabilize-ownership.spec.ts --grep "Death-save button" --reporter=line

      - name: Restart Vite preview (mid-stabilize)
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          # Aggressive kill: npx wrapper AND the actual vite node child
          pkill -9 -f "vite preview" 2>/dev/null || true
          fuser -k 5173/tcp 2>/dev/null || true
          PIDS=$(lsof -t -i :5173 2>/dev/null || true)
          [ -n "$PIDS" ] && kill -9 $PIDS 2>/dev/null || true
          for i in $(seq 1 15); do
            if ! curl -s -o /dev/null -m 1 http://localhost:5173; then break; fi
            echo "Waiting for port 5173 to free... ($i/15)"
            sleep 1
          done
          sleep 2
          cd client && ./node_modules/.bin/vite preview >/tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for new Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite never came back up" && exit 1
          done

      - name: Run Playwright E2E tests (stabilize-ownership — Stabilize + DM transfer)
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && ./node_modules/.bin/playwright test e2e/stabilize-ownership.spec.ts --grep "Stabilize button|DM control transfer" --reporter=line

      - name: Restart Vite preview (clear memory between E2E batches)
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          pkill -9 -f "vite preview" 2>/dev/null || true
          fuser -k 5173/tcp 2>/dev/null || true
          PIDS=$(lsof -t -i :5173 2>/dev/null || true)
          [ -n "$PIDS" ] && kill -9 $PIDS 2>/dev/null || true
          for i in $(seq 1 15); do
            if ! curl -s -o /dev/null -m 1 http://localhost:5173; then break; fi
            echo "Waiting for port 5173 to free... ($i/15)"
            sleep 1
          done
          sleep 2
          cd client && ./node_modules/.bin/vite preview >/tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for new Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite never came back up" && exit 1
          done

      - name: Run Playwright E2E tests (batch 2 — core specs)
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          cd tests && ./node_modules/.bin/playwright test \
            e2e/a11y.spec.ts \
            e2e/condition-expiry.spec.ts \
            e2e/creature-gallery.spec.ts \
            e2e/crit-banner.spec.ts \
            e2e/dashboard.spec.ts \
            e2e/death-recovery.spec.ts \
            e2e/death-timer.spec.ts \
            e2e/level-up.spec.ts \
            e2e/rest-button.spec.ts \
            e2e/spell-exhaustion.spec.ts \
            --reporter=line

      - name: Restart Vite preview (before batch 3)
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          pkill -9 -f "vite preview" 2>/dev/null || true
          fuser -k 5173/tcp 2>/dev/null || true
          PIDS=$(lsof -t -i :5173 2>/dev/null || true)
          [ -n "$PIDS" ] && kill -9 $PIDS 2>/dev/null || true
          for i in $(seq 1 15); do
            if ! curl -s -o /dev/null -m 1 http://localhost:5173; then break; fi
            echo "Waiting for port 5173 to free... ($i/15)"
            sleep 1
          done
          sleep 2
          cd client && ./node_modules/.bin/vite preview >/tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for new Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite never came back up" && exit 1
          done

      - name: Run Playwright E2E tests (batch 3 — campaign, character-creation, combat, visibility)
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          cd tests && ./node_modules/.bin/playwright test \
            e2e/campaign-creation.spec.ts \
            e2e/character-creation.spec.ts \
            e2e/combat-damage.spec.ts \
            e2e/dm-player-visibility.spec.ts \
            --reporter=line

      - name: Collect logs for artifact
        if: always()
        run: |
          mkdir -p /tmp/e2e-logs
          # Server and Vite process logs
          cp /tmp/server.log /tmp/e2e-logs/server.log 2>/dev/null || echo "(no server log)" > /tmp/e2e-logs/server.log
          cp /tmp/vite.log /tmp/e2e-logs/vite.log 2>/dev/null || echo "(no vite log)" > /tmp/e2e-logs/vite.log
          # Playwright HTML report (if present)
          if [ -d tests/playwright-report ]; then
            cp -r tests/playwright-report /tmp/e2e-logs/playwright-report
          fi
          # Playwright test results (JUnit XML etc.)
          if [ -d tests/test-results ]; then
            cp -r tests/test-results /tmp/e2e-logs/test-results
          fi
          echo "Log collection complete. Contents:"
          find /tmp/e2e-logs -type f | head -40

      - name: Upload E2E logs artifact
        if: always()
        # v4 requires GHES features Forgejo's actions backend doesn't expose
        # ("@actions/artifact v2.0.0+ … not currently supported on GHES").
        # Pin to v3 until Forgejo gains support.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: nightly-e2e-logs-${{ github.run_id }}
          path: /tmp/e2e-logs/
          retention-days: 14

      - name: Dump server and vite logs on failure (inline)
        if: failure()
        run: |
          echo "=== server log (last 200 lines) ==="
          tail -n 200 /tmp/server.log || echo "no server log"
          echo "=== vite log (last 200 lines) ==="
          tail -n 200 /tmp/vite.log || echo "no vite log"
