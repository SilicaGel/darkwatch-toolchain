name: Deploy

# Manual deploy or reusable deploy job (called by nightly-deploy.yml).
# When called directly via workflow_dispatch, accepts an optional branch input.
# When called via workflow_call, always deploys main.

on:
  workflow_call:    # called by nightly-deploy.yml
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: main)'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Note: no `services:` block by design. Forgejo Actions runs jobs that
    # declare services inside a docker container, which prevents the deploy
    # step's `apt-get install docker.io && docker build ...` from reaching
    # the host docker daemon — the symptom is "Cannot connect to the Docker
    # daemon at unix:///var/run/docker.sock" right after Docker installs.
    # Migration validation already happens in ci.yml's smoke run; deploy
    # builds and ships only.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci --no-audit --no-fund

      - name: Build server
        run: cd server && npm run build

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      - name: Build client
        run: cd client && npm run build

      - name: Install Docker CLI
        run: |
          apt-get update -qq && apt-get install -y -qq docker.io curl
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

      - name: Build server Docker image
        run: docker build -t darkwatch-server:latest ./server

      - name: Copy client build to webroot
        run: cp -r client/dist/. /var/www/darkwatch/

      - name: Copy brochure to webroot
        run: |
          mkdir -p /var/www/brochure
          cp site/style.css site/main.js /var/www/brochure/
          cp -r site/assets /var/www/brochure/
          HASH=$(git rev-parse --short HEAD)
          sed "s/\.png\"/\.png?v=${HASH}\"/g" site/index.html > /var/www/brochure/index.html

      - name: Deploy server container
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          docker rm -f darkwatch-server 2>/dev/null || true
          docker-compose -f /home/ci/services/darkwatch/docker-compose.yml up -d --remove-orphans
