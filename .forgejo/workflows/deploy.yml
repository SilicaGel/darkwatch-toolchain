name: Deploy

# Manual deploy or reusable deploy job (called by nightly-deploy.yml).
# When called directly via workflow_dispatch, accepts an optional branch input.
# When called via workflow_call, always deploys main.
#
# Architecture (#1337, 2026-07-06): runs ON the Pi itself via the `pi`
# host-executor runner (forgejo-runner-host.service, user aaron) — no SSH,
# no rsync-over-network, no Mac dependency. The May-2026 Mac-runner shape
# (build on Mac → rsync/SSH to the Pi) broke whenever the Mac was off the
# home LAN; every step below is local to the Pi. The e2e gate that fronts
# the nightly (nightly-deploy.yml) still runs on the Mac runner — a fully
# offline Mac still blocks the nightly (accepted residual, see #1337).
#
# Host prerequisites (installed 2026-07-06, see docs/BACKUPS.md): Node 22
# (system), docker, rsync, caddy; the deploy user's sudoers allows `install`
# to /etc/caddy + `systemctl reload caddy` (both used with -n).
# Capability test: full client build 1m41s warm, prod unaffected (#1337).
#
# Required Forgejo Actions secrets: the runtime secrets the compose file
# expects (written to ~/services/darkwatch/.env.deploy below). The
# DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER / DEPLOY_KNOWN_HOSTS secrets are
# no longer used here (ci.yml's badges job still uses them until #1337
# part 2 moves it to the Pi too).

on:
  workflow_call: # called by nightly-deploy.yml
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (default: main)"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: pi
    timeout-minutes: 45 # Pi build headroom (measured 1m41s warm; cold npm ci adds ~1 min)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Build client
        # Host executor: system Node 22 — no setup-node, no apt-get. The full
        # checkout matters: vite.config.ts imports ../scripts/app-version.mjs,
        # which reads docs/CHANGELOG.md (capability-test finding, #1337).
        run: |
          node --version
          cd client && npm ci --no-audit --no-fund && npm run build

      - name: Sync client dist + marketing site + server source into place
        run: |
          rsync -az --delete client/dist/ /var/www/darkwatch/
          # pitch/ is EXCLUDED: it's the private licensing pitch (names the
          # game system) and must not be publicly reachable — it lives in the
          # repo only, to be shared directly when appropriate.
          rsync -az --delete --delete-excluded \
            --exclude='.DS_Store' \
            --exclude='pitch' \
            --exclude='README.md' \
            www/ /var/www/marketing/
          # Server source-only — the Dockerfile builds inside its own
          # container below.
          rsync -az --delete \
            --exclude=node_modules --exclude=coverage --exclude=dist \
            --exclude='*.log' --exclude='.DS_Store' \
            server/ ~/deploy/darkwatch/server/

      - name: Back up current configs (rolling .bak + #512 config slice)
        # One rolling .bak per replaced file (diagnose/roll back a wedged
        # deploy against last-known-good), PLUS a copy into
        # ~/backups/darkwatch/config/ so the daily Mac pull (#385) carries the
        # live config off-Pi. Entirely best-effort: every line is guarded so a
        # missing file or sudo denial can NEVER fail the deploy.
        run: |
          mkdir -p ~/backups/darkwatch/config
          if [ -d ~/services/darkwatch ]; then
            cd ~/services/darkwatch
            for f in docker-compose.yml .env.deploy; do
              if [ -f "$f" ]; then
                cp -f "$f" "$f.bak"
                cp -f "$f" ~/backups/darkwatch/config/"$f"
                echo "[backup] $f -> .bak + config slice"
              fi
            done
          fi
          if [ -f /etc/caddy/Caddyfile ]; then
            if sudo -n cp -f /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak 2>/dev/null; then
              cp -f /etc/caddy/Caddyfile ~/backups/darkwatch/config/Caddyfile 2>/dev/null \
                || sudo -n cp -f /etc/caddy/Caddyfile ~/backups/darkwatch/config/Caddyfile 2>/dev/null \
                || true
              echo "[backup] Caddyfile -> .bak + config slice"
            else
              echo "[backup] SKIPPED /etc/caddy/Caddyfile (sudo cp not permitted)"
            fi
          fi

      - name: Write runtime env file
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          EXTRA_ALLOWED_ORIGINS: ${{ secrets.EXTRA_ALLOWED_ORIGINS }}
          WAITLIST_PUBLIC_URL: ${{ secrets.WAITLIST_PUBLIC_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          FEEDBACK_NOTIFY_TO: ${{ secrets.FEEDBACK_NOTIFY_TO }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PUBLIC_BASE_URL: ${{ secrets.MINIO_PUBLIC_BASE_URL }}
          MINIO_BROWSER_REDIRECT_URL: ${{ secrets.MINIO_BROWSER_REDIRECT_URL }}
        run: |
          # App version reported by /health + Sentry: the canonical CHANGELOG
          # version (shared parser) plus the short git sha, e.g. "0.102.21+a6f2e45".
          APP_VERSION="$(node scripts/app-version.mjs)+$(git rev-parse --short HEAD)"
          # Build with `printf '%s\n'` so values containing special chars
          # (= ' " $) survive untouched; umask keeps it private.
          umask 077
          {
            printf 'APP_VERSION=%s\n' "$APP_VERSION"
            printf 'DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'CLIENT_URL=%s\n' "$CLIENT_URL"
            printf 'EXTRA_ALLOWED_ORIGINS=%s\n' "$EXTRA_ALLOWED_ORIGINS"
            printf 'WAITLIST_PUBLIC_URL=%s\n' "$WAITLIST_PUBLIC_URL"
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'EMAIL_FROM=%s\n' "$EMAIL_FROM"
            printf 'FEEDBACK_NOTIFY_TO=%s\n' "$FEEDBACK_NOTIFY_TO"
            printf 'MINIO_ROOT_USER=%s\n' "$MINIO_ROOT_USER"
            printf 'MINIO_ROOT_PASSWORD=%s\n' "$MINIO_ROOT_PASSWORD"
            printf 'MINIO_BUCKET=%s\n' "$MINIO_BUCKET"
            printf 'MINIO_ENDPOINT=%s\n' "$MINIO_ENDPOINT"
            printf 'MINIO_PUBLIC_BASE_URL=%s\n' "$MINIO_PUBLIC_BASE_URL"
            printf 'MINIO_BROWSER_REDIRECT_URL=%s\n' "$MINIO_BROWSER_REDIRECT_URL"
          } > /tmp/darkwatch.deploy.env
          mv /tmp/darkwatch.deploy.env ~/services/darkwatch/.env.deploy

      - name: Push prod docker-compose into place (#852)
        # Version-controlled compose file — env-var/port/volume changes are
        # reviewed in the same PR as deploy.yml + secret changes.
        run: cp deploy/docker-compose.prod.yml ~/services/darkwatch/docker-compose.yml

      - name: Pre-migration DB dump — no backup, no deploy (#385)
        # Zero-gap restore point immediately before the riskiest step
        # (migrations run when the new container boots below). Deliberately
        # NOT continue-on-error: a deploy that can't take a backup doesn't
        # deploy. Also refresh the cron's installed copy so it never drifts
        # from the repo (docs/BACKUPS.md).
        run: |
          bash scripts/backup-db.sh --suffix predeploy
          install -m 755 scripts/backup-db.sh ~/bin/darkwatch-backup-db.sh

      - name: Build server image and (re)start container
        # The Pi's public-facing reverse proxy is Caddy (host systemd unit,
        # /etc/caddy/Caddyfile), serving static client assets from
        # /var/www/darkwatch and reverse-proxying /api/* + /socket.io/* +
        # /health to localhost:8080. The Caddyfile is installed + reloaded by
        # the step below (#1037).
        run: |
          cd ~/deploy/darkwatch/server
          docker build -t darkwatch-server:latest .
          docker rm -f darkwatch-server 2>/dev/null || true
          cd ~/services/darkwatch
          docker compose --env-file .env.deploy up -d --remove-orphans

      - name: Install Caddyfile + reload (#1037)
        # Ordered LAST — after the container is already deployed — so a
        # Caddy/sudo hiccup can never block the app rollout. `caddy validate`
        # before install; `systemctl reload caddy` is graceful and
        # re-validates, so a bad config can never take the proxy down. All
        # sudo is -n (non-interactive): a missing sudoers rule fails loudly,
        # never hangs.
        run: |
          caddy validate --adapter caddyfile --config deploy/Caddyfile
          sudo -n install -m 644 -o root -g root deploy/Caddyfile /etc/caddy/Caddyfile
          sudo -n systemctl reload caddy
          echo "Caddy reloaded with repo Caddyfile."
