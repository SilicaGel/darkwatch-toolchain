name: Smoke Walk

# Exploratory crawler that runs in Vite dev mode with the full demo seed.
# Surfaces SPA drift that deterministic Playwright specs might miss.
#
# Triggers:
#   - workflow_call: called by nightly-deploy.yml (hard gate — failure blocks deploy)
#   - workflow_dispatch: manual run
#
# See tests/README.md for the full two-tier testing strategy.

on:
  workflow_call: # called by nightly-deploy.yml
    inputs:
      # #2409 — the nightly gate must test the SAME ref the deploy ships, or it
      # stops covering what goes out. Empty is deliberate: actions/checkout
      # treats an empty `ref` as "use this event's default", so schedule / PR /
      # dispatch runs behave exactly as before.
      ref:
        description: "git ref to test; empty = this event's default"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to test (e.g. v0.198.0); empty = default"
        required: false
        default: ""

jobs:
  # #1113 — lazy CI-image prerequisite. Full rationale in e2e-full.yml's copy.
  # Unconditional: this workflow only runs on workflow_call / workflow_dispatch,
  # and whenever it runs at all it needs the image.
  ensure-image:
    runs-on: pi
    timeout-minutes: 75 # cold multi-arch build; the warm path is seconds
    steps:
      # #1113 review round 2 — THE TOOL, from the ref this workflow runs on.
      # NOT `inputs.ref`: every existing release tag predates this script, so a
      # single tag-pinned checkout dies with MODULE_NOT_FOUND (proven on pi4,
      # task 22365). The decider must come from the running workflow; the tree
      # being decided about comes from the checkout below.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/ci/
          sparse-checkout-cone-mode: false

      # THE SUBJECT — the tree actually under test. nightly-deploy.yml pins a
      # release tag here (#2409), and this is the tree whose lockfile and image
      # tags must agree. An empty `ref` means "this event's default", so the
      # pull_request / cron paths read their own checkout, unchanged.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          path: _subject
          filter: blob:none
          sparse-checkout: |
            /.forgejo/
            /scripts/regen-visual-baselines.sh
            /tests/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Ensure the CI Playwright image exists for this tree
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: node scripts/ci/ensure-ci-image.mjs --tree _subject

  smoke-walk:
    needs: ensure-image
    runs-on: ubuntu-latest
    timeout-minutes: 30 # #1263 — build + DB seed + exploratory Playwright crawler; ~15-20 min typical
    # #969 — prebuilt CI image (Node 22 + Chromium + Playwright deps baked).
    container:
      image: forge.example.com/aaron/darkwatch-ci-playwright:1.62.1
    services:
      mariadb:
        image: mariadb:11@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}

      # #969 — Node 22 baked into the image; cache only the npm download dir.
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install server dependencies
        run: cd server && npm ci --no-audit --no-fund

      - name: Build server
        run: cd server && npm run build

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Apply migrations
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Seed core + shadowdark + demo content
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run seed:core && npm run seed:shadowdark && npm run seed:shadowdark:demo

      - name: Start app server (production build, same as CI smoke)
        env:
          PORT: "3001"
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          NODE_ENV: test
          ALLOW_TEST_HOOKS: "true"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          JWT_SECRET: e2e-test-secret
          CLIENT_URL: http://localhost:5173
          # See e2e-full.yml — disable per-user/per-IP socket caps for CI runs
          # so accumulating ghost sockets between Playwright tests don't
          # block new connections.
          SOCKET_PER_USER_CAP: "1000"
          SOCKET_PER_IP_CAP: "1000"
          NODE_OPTIONS: "--max-old-space-size=256"
        run: |
          node server/dist/index.js >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/auth/me 2>/dev/null || true)
            echo "$status" | grep -qE '^(200|401)$' && break || true
            echo "Waiting for app server... ($i/30) [got: $status]"
            sleep 2
            [ "$i" -eq 30 ] && echo "App server never became ready" && exit 1
          done

      - name: Start Vite dev server (smoke-walk uses dev mode)
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
          # #2538 — the port is PINNED here on purpose. It used to be supplied by
          # OMISSION: a bare `npm run dev` took its port from
          # client/vite.config.ts, so CI silently inherited local dev's default
          # and this wait loop only worked because the two happened to agree.
          # Moving local dev into the 10900 block would have reddened this job
          # with "Vite dev server never became ready". The number is
          # deliberately UNCHANGED — CI binds exactly what it bound before; it
          # just no longer borrows the value from a file dev is free to change.
          # --strictPort so a busy port fails loudly instead of falling forward.
          # `-- --port` (npm passthrough), NOT `--port`: the bare form is eaten
          # by npm itself and never reaches vite.
        run: |
          cd client && npm run dev -- --port 5173 --strictPort >/tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for Vite dev server... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite dev server never became ready" && exit 1
          done

      # #969 — browsers baked at /ms-playwright; just install tests/ npm deps.
      - name: Install tests dependencies (browsers baked in image)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && npm ci --no-audit --no-fund

      - name: Run smoke-walk
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          # #2538 — pinned for the same reason as the Vite port above: this
          # was previously supplied by OMISSION from tests/playwright.config.ts,
          # so CI's target silently tracked local dev's default. Same number as
          # before; it just no longer moves when dev's does.
          E2E_BASE_URL: "http://localhost:5173"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && npm run smoke-walk

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p /tmp/smoke-walk-artifacts
          cp /tmp/server.log /tmp/smoke-walk-artifacts/server.log 2>/dev/null || echo "(no server log)" > /tmp/smoke-walk-artifacts/server.log
          cp /tmp/vite.log /tmp/smoke-walk-artifacts/vite.log 2>/dev/null || echo "(no vite log)" > /tmp/smoke-walk-artifacts/vite.log
          # Smoke-walk writes report.md and screenshots into tests/smoke-walk-out/
          # (script's OUT_DIR is "smoke-walk-out", not "-report" — workflow was
          # looking in the wrong place and silently dropping the report).
          if [ -d tests/smoke-walk-out ]; then
            cp -r tests/smoke-walk-out /tmp/smoke-walk-artifacts/
          fi
          # Also capture any Playwright screenshots from the smoke-walk Playwright usage
          if [ -d tests/test-results ]; then
            cp -r tests/test-results /tmp/smoke-walk-artifacts/test-results
          fi
          echo "Artifact collection complete:"
          find /tmp/smoke-walk-artifacts -type f | head -40

      - name: Upload smoke-walk artifacts
        if: always()
        # v4 requires GHES features Forgejo's actions backend doesn't expose;
        # pin to v3 until Forgejo gains support.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: smoke-walk-${{ github.sha }}
          path: /tmp/smoke-walk-artifacts/
          retention-days: 14
