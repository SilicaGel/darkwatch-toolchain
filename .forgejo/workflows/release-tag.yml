name: Release tag

# #2409 (phase 2 of #2364) — stamp `v<version>` on the commit that introduced
# that version, so the deploy has something stable to pin to.
#
# WHY A TAG AND NOT A COMMIT
#   A tag moves no files. It therefore (a) does not re-trigger CI — nothing in
#   .forgejo/workflows listens on tag pushes, verified — and (b) does not change
#   the tree that the #2336 push-to-main tree gate compares, so it cannot
#   perturb the skip decision that #2368 just made load-bearing.
#
# WHY ITS OWN FILE, NOT A JOB IN ci.yml
#   Two reasons, both practical. ci.yml has no `workflow_dispatch`, and a single
#   job of it cannot be dispatched — so a job living there could not be proven
#   before merge, which #842 requires for every workflow change. And ci.yml
#   declares `permissions: contents: read` at the workflow level; tag creation
#   needs write, and widening ci.yml's blanket permission to suit one job is the
#   wrong trade.
#
# IDEMPOTENT. The common case is "the tag already exists" — every push to main
# between releases carries the same version. That is a success, not a no-op to
# be surprised by.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "'true' reports what it would tag and creates nothing"
        required: false
        default: "true"

# Tag creation needs write. Scoped to this workflow alone — see the note above.
permissions:
  contents: write

jobs:
  release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # app-version.mjs reads docs/CHANGELOG.md out of the working tree, so
          # this must be the tree AT github.sha — which is what checkout gives
          # us by default on a push.
          fetch-depth: 1

      - name: Resolve the version this commit carries
        id: ver
        run: |
          VERSION="$(node scripts/app-version.mjs)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version at ${{ github.sha }} is $VERSION -> tag v$VERSION"

      - name: Create the tag if it does not exist
        env:
          # Same two-token pattern e2e-full.yml's notify-failure uses: the
          # full-scope PAT first, github.token as the fallback (scoped by the
          # permissions block above).
          FALLBACK_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.ver.outputs.tag }}
          # A dispatch defaults to dry-run: dispatching from a BRANCH to prove
          # this workflow would otherwise tag the branch head with the release
          # version, which is exactly the mis-tagging the bootstrap note warns
          # about. A push to main never dry-runs.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run != 'false') }}
        run: |
          set -uo pipefail

          # curl, NOT python-urllib: forge.example.com sits behind Cloudflare,
          # which fingerprint-blocks urllib with a 403 (#1620).
          api_get() {
            for tok in "$FALLBACK_TOKEN" "$GH_TOKEN"; do
              [ -z "$tok" ] && continue
              # `|| code=""` for the same `-e` reason as below (#2458): a
              # command substitution takes curl's exit status, so a network
              # failure here — the `context deadline exceeded` shape seen on
              # this instance (#1968) — would kill the step outright. That
              # would make the `return 2` below UNREACHABLE, i.e. the branch
              # written to report "could not tell" could never report it.
              # Empty matches neither case arm, so it falls through to it.
              code=$(curl -sS -o /tmp/tag_resp.json -w '%{http_code}' \
                -H "Authorization: token $tok" \
                "$API_URL/repos/$REPO/tags/$TAG") || code=""
              case "$code" in
                200) return 0 ;;   # exists
                404) return 1 ;;   # absent
              esac
            done
            return 2               # could not tell
          }

          # `|| exists=$?` IS THE FIX, NOT A STYLE CHOICE (#2458). Do not
          # "tidy" it back into a bare `api_get` on its own line.
          #
          # The runner invokes every `run:` step with
          # `bash --noprofile --norc -eo pipefail`. **`-e` is on**, and the
          # `set -uo pipefail` above does not turn it off — it only adds to it.
          # Under `-e`, a BARE call that returns non-zero terminates the script
          # instantly, before the next line runs. `api_get` returns 1 to mean
          # "tag absent", which is precisely the case this job exists to
          # handle, so the bare form killed the step every time there was
          # actually a tag to create — silently, with no output at all, because
          # `-e` fires before any `echo` can report why.
          #
          # It hid for two releases because v0.198.0 was bootstrapped by hand,
          # so every run took the `return 0` (tag exists) branch, where `-e`
          # never fires. Run 9976 was the first push that genuinely had to
          # create a tag, and it failed both attempts on different runners with
          # an 87-line log whose failing step contributed zero lines. Control:
          # run 9816, same workflow and same push event, printed normally
          # because the tag already existed.
          #
          # Putting the call on the left of `||` makes it a TESTED command,
          # which `-e` explicitly exempts. `if api_get; then ... elif` is
          # exempt for the same reason and would also be correct; what is not
          # correct is the bare call, which reads the most innocent of the
          # three.
          exists=0
          api_get || exists=$?
          if [ "$exists" -eq 0 ]; then
            echo "Tag $TAG already exists — nothing to do. (This is the normal case"
            echo "for every push between releases.)"
            exit 0
          fi
          if [ "$exists" -eq 2 ]; then
            echo "::error::Could not determine whether $TAG exists (no token could read the tags API)."
            exit 1
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — would create tag $TAG at $SHA. Nothing was created."
            exit 0
          fi

          for tok in "$FALLBACK_TOKEN" "$GH_TOKEN"; do
            [ -z "$tok" ] && continue
            # `|| code=""` — same `-e` hazard as api_get (#2458). Empty fails
            # the 2xx test below, so a network failure reports and tries the
            # next token instead of killing the step without a word.
            code=$(curl -sS -o /tmp/tag_create.json -w '%{http_code}' -X POST \
              -H "Authorization: token $tok" -H "Content-Type: application/json" \
              --data "$(printf '{"tag_name":"%s","target":"%s"}' "$TAG" "$SHA")" \
              "$API_URL/repos/$REPO/tags") || code=""
            if [ "${code#2}" != "$code" ]; then
              echo "Created tag $TAG at $SHA"
              exit 0
            fi
            echo "  create via this token: HTTP $code $(head -c 200 /tmp/tag_create.json)"
          done

          echo "::error::Could not create tag $TAG at $SHA with any available token."
          exit 1
