name: Import cycles (madge)

# #1303 — hard gate against circular imports. ESLint's import/no-cycle has no
# ESLint-10 support and import-x under-reports through our re-export barrels, so
# madge is the detector (see scripts/check-import-cycles.mjs). Baseline is zero
# (server cleared in #1303, client in #1302/#1304).

on:
  pull_request:
    branches: [main]

# Cancel superseded PR runs (#1617).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # #2315 — this job throws the 21M of Playwright visual baselines away.
          # Excluding them measured 31% less transfer and 35% less checkout time
          # per clone on a 6-way concurrent bench; only visual-regression.yml's
          # `visual` job reads them (e2e-full sets E2E_SKIP_VISUAL, and they are
          # not in SMOKE_SPECS).
          #
          # `filter` alone is a NO-OP with a full working tree (#2338) — the
          # sparse list is what stops the lazy re-fetch of tip blobs. And
          # cone-mode MUST be off: cone mode rejects `!` patterns outright
          # (`fatal: specify directories rather than patterns`) and leaves the
          # full tree, so this would silently be a no-op with it on.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/e2e/visual-regression.spec.ts-snapshots

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json

      # madge lives in the server workspace (its typescript ^5 dep matches
      # server's; adding it to root would downgrade root TS 6 → 5 and break
      # type-aware ESLint). Installing server deps gives us the madge binary.
      # No other workspace deps are needed — madge parses source text + tsconfig
      # and treats node_modules imports as leaves, so client/src is analysed
      # without client deps installed.
      - name: Install server dependencies
        run: cd server && npm ci --no-audit --no-fund

      - name: Check import cycles (server/src + client/src)
        run: npm run cycles
