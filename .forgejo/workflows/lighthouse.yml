name: Lighthouse CI

# Path-filtered: only run when something that can actually move Lighthouse
# scores has changed (#814). Doc-only / skill-only / server-only / CI-tweak
# PRs skip the whole ~6-8 min job. To smoke-test the workflow itself, edit
# this file (already in the filter).
#
# Also runs on push to main so post-merge scores get recorded — every PR
# has a Lighthouse comment, but until now nothing measured main itself
# after the merge. Badge upload to MinIO is tracked separately (#819).
on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'lighthouserc.cjs'
      - '.forgejo/workflows/lighthouse.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'lighthouserc.cjs'
      - '.forgejo/workflows/lighthouse.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd client && npm ci --no-audit --no-fund)

      - name: Build client
        run: cd client && npm run build

      # Cache the Playwright chromium install across runs (#814). Mirrors the
      # pattern in e2e.yml so both workflows share the same cache directory —
      # one warm-up benefits both. Cache key is keyed on tests/package-lock.json
      # because that's where @playwright/test's version is pinned; bumping
      # Playwright there invalidates the cache and forces a fresh download.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/ci/playwright-cache
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The Forgejo runner's node:22 base image has no Chrome on PATH.
      # Install via the @playwright/test pinned in tests/package.json —
      # NOT `npx --yes -p @playwright/test`, which would fetch the latest
      # version from the npm registry, mismatch the cached chromium
      # version, and force playwright to delete the cache and redownload
      # (the bug that made the original #814 cache useless — see #818).
      # By running the local pinned binary, the chromium version it
      # expects matches the cache key (hashFiles('tests/package-lock.json')),
      # so cache hits are real no-ops on the download step.
      # `--with-deps` is still slow on first run; on this self-hosted
      # runner the apt libs persist across runs and re-install is a no-op.
      - name: Install Chromium (via Playwright)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/ci/playwright-cache
        run: |
          cd tests && npm ci --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium --with-deps

      # lhci uses chrome-launcher to find Chrome; chrome-launcher checks
      # CHROME_PATH first, then several default paths. With PLAYWRIGHT_BROWSERS_PATH
      # set, the binary lands under /home/ci/playwright-cache/chromium-*/...
      # rather than ~/.cache/ms-playwright, so we search the configured path.
      # `lhci autorun` reads lighthouserc.cjs, runs 3 Lighthouse passes
      # against the static-served bundle, and writes JSON + HTML reports
      # into .lighthouseci/. Always exit 0 — non-blocking. Comment-bot
      # below surfaces scores + assertion failures regardless.
      - name: Run Lighthouse CI
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/ci/playwright-cache
        run: |
          export CHROME_PATH=$(find "$PLAYWRIGHT_BROWSERS_PATH" -name "chrome" -type f -path "*chrome-linux*" | head -1)
          echo "Using CHROME_PATH=$CHROME_PATH"
          # Invoke the local @lhci/cli binary directly. `npx lhci` would
          # fall through to the npm registry on a cache miss and pull a
          # known typosquat package named "lhci" (unrelated to @lhci/cli).
          ./node_modules/.bin/lhci autorun || true

      # Only post a comment on PR runs — the push-to-main run has no PR to
      # comment on (and the script exits cleanly on missing PR_NUMBER, but
      # skipping the step is tidier than relying on the no-op).
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/lighthouse-comment/post-comment.mjs
