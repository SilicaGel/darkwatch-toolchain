name: Lighthouse CI

# Path-filtered: only run when something that can actually move Lighthouse
# scores has changed (#814). Doc-only / skill-only / server-only / CI-tweak
# PRs skip the whole ~6-8 min job. To smoke-test the workflow itself, edit
# this file (already in the filter).
#
# Also runs on push to main so post-merge scores get recorded — every PR
# has a Lighthouse comment, but until now nothing measured main itself
# after the merge. Badge upload to MinIO is tracked separately (#819).
on:
  # #2309 — this job is NON-BLOCKING (`lhci autorun || true`, below): it posts
  # an advisory comment and gates nothing. Measured over 10 days it ran on 66 of
  # 162 PR shas (41%) and, with lighthouse-authenticated.yml, cost 636 runner-
  # minutes — ~8% of all CI time — plus 2 concurrent slots on ~46% of PR shas,
  # at a point where jobs-per-PR against a shared slot pool is the merge-
  # throughput bottleneck (baseline on #1617).
  #
  # The old `paths` filter also over-triggered: PR #2318 ran a full 3-pass suite
  # because it appended a filename to the `test:scripts` npm script, and
  # `package.json` was on the list. No client code; no possible perf impact.
  #
  # So it now runs nightly, on demand, and on an opt-in `run-lighthouse` PR
  # label — the same shape as `run-e2e-full` (#1623) and `run-visual` (#1494).
  # The perf signal is DEFERRED, not deleted.
  #
  # `paths` is deliberately gone rather than narrowed: with a label gate a paths
  # filter is actively harmful, because a labelled PR that happens to touch
  # nothing on the list would silently not run — the opposite of what labelling
  # it means. An unlabeled PR pays only a no-op job evaluation (no runner).
  #
  # NO `schedule:` HERE, on purpose. A nightly is the obvious other half, but
  # this job's only consumer is the PR comment (`if: github.event_name ==
  # 'pull_request'`), #819's badge upload does not exist yet, and nothing
  # uploads an artifact or writes a step summary — so a scheduled run would
  # build the client, do three passes, and discard the result. That is exactly
  # why #1617 removed the push-to-main trigger (see the note below), and adding
  # a cron now would reinstate it under a different name. The nightly is
  # tracked on #2321, which owns giving it a consumer first.
  workflow_dispatch:
  pull_request:
    branches: [main]
    # `labeled` is REQUIRED — without it, adding `run-lighthouse` to an already-
    # open PR fires no event and the label silently does nothing (#1623).
    types: [opened, synchronize, reopened, labeled]
  # push-to-main trigger removed (#1617): the PR comment is PR-gated and badge
  # upload doesn't exist yet (#819) — post-merge runs built 8-18 min of output
  # nothing consumed. Restore only when #819 lands.

# Cancel superseded PR runs (#1617).
concurrency:
  # #2309 — an UNLABELED PR must get its own group. Sharing one group with the
  # nightly/dispatch runs would make a PR that only evaluates a skip queue
  # behind a real 10-minute run just to do nothing (the #1623 reasoning).
  group: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run-lighthouse') && format('lighthouse-skip-{0}', github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  # #1113 — lazy CI-image prerequisite. Full rationale in e2e-full.yml's copy.
  #
  # Carries the lighthouse label gate VERBATIM: this pass skips on most PRs, and
  # an unconditional job here would take the single-capacity pi slot every time
  # to do nothing. Identical conditions mean the two skip and run together.
  ensure-image:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-lighthouse') }}
    runs-on: pi
    timeout-minutes: 75 # cold multi-arch build; the warm path is seconds
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          filter: blob:none
          sparse-checkout: |
            /.forgejo/
            /scripts/ci/
            /scripts/regen-visual-baselines.sh
            /tests/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Ensure the CI Playwright image exists for this tree
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: node scripts/ci/ensure-ci-image.mjs

  lighthouse:
    needs: ensure-image
    # #2309 — normal-job `if:`, not a `uses:`-job `if:`. Forgejo does NOT honour
    # `if:` on a reusable-workflow job (#1623 lost a prove iteration to that);
    # this is a normal job, so the gate holds.
    # #1113 blocker fix — see visual-regression.yml: without `!cancelled()` a
    # FAILED ensure-image skips this job and Forgejo posts `success` (#1954).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-lighthouse')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # #1263 — npm install + vite build + 3 lhci passes; ~8-12 min typical
    # #969 — prebuilt CI image (Node 22 + Chromium + Playwright deps baked).
    container:
      image: forge.example.com/aaron/darkwatch-ci-playwright:1.61.1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # #969 — Node 22 baked into the image; cache only the npm download dir.
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd client && npm ci --no-audit --no-fund)

      - name: Build client
        run: cd client && npm run build

      # #969 — Chromium is baked into the image at /ms-playwright; just install
      # the tests/ npm deps (provides @lhci/cli's peer + the playwright client).
      - name: Install tests dependencies (browser baked in image)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && npm ci --no-audit --no-fund

      # lhci uses chrome-launcher to find Chrome; chrome-launcher checks
      # CHROME_PATH first, then several default paths. The baked Chromium lands
      # under /ms-playwright/chromium-*/..., so we point CHROME_PATH there.
      # `lhci autorun` reads lighthouserc.cjs, runs 3 Lighthouse passes
      # against the static-served bundle, and writes JSON + HTML reports
      # into .lighthouseci/. Always exit 0 — non-blocking. Comment-bot
      # below surfaces scores + assertion failures regardless.
      - name: Run Lighthouse CI
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          export CHROME_PATH=$(find "$PLAYWRIGHT_BROWSERS_PATH" -name "chrome" -type f -path "*chrome-linux*" | head -1)
          echo "Using CHROME_PATH=$CHROME_PATH"
          # Invoke the local @lhci/cli binary directly. `npx lhci` would
          # fall through to the npm registry on a cache miss and pull a
          # known typosquat package named "lhci" (unrelated to @lhci/cli).
          ./node_modules/.bin/lhci autorun || true

      # Only post a comment on PR runs — the push-to-main run has no PR to
      # comment on (and the script exits cleanly on missing PR_NUMBER, but
      # skipping the step is tidier than relying on the no-op).
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/lighthouse-comment/post-comment.mjs
