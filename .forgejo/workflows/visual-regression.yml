name: Visual Regression (per-PR gate)

# #1494 — gate #1089 Phase-2 CSS-migration PRs with the visual-regression harness
# BEFORE merge. The spec (tests/e2e/visual-regression.spec.ts) is also nightly-only
# (e2e-full.yml); this adds a per-PR run so a migration regression is caught pre-merge.
#
# #1936 — the War Table pixel spec (tests/e2e/1736-wt-visual.spec.ts) now rides this
# same gate. It was the flagship surface's only pixel coverage and ran NOWHERE
# pre-merge: it is nightly-only, and deliberately excluded from the affected-tier
# smoke (a pixel spec doesn't belong in the smoke container), while this workflow
# targeted visual-regression.spec.ts by name and had never heard of it. So a WT
# restyle could land unchallenged. `detect` now decides a SPEC LIST rather than a
# yes/no, and the single `visual` job runs whichever specs the diff earned —
# reusing one ~10-minute app bringup instead of paying it twice.
#
# Trigger sets (see the `decide` step):
#   - Classic spec: client CSS / styles, its own spec, the freeze helper.
#   - WT spec:      the same CSS + freeze harness (shared), PLUS the WT sources
#                   (pages/wartable, components/wt, rulesets/*/components/wt,
#                   layoutMode) and its own spec file.
#   - Either the `run-visual` label or a manual dispatch forces BOTH.
#
# Gating is decided in the `detect` job (NOT a top-level `paths:` filter) so the
# `run-visual` label can force a run on a PR whose changed files wouldn't otherwise
# match (e.g. a .tsx layout change). `detect` always completes, so a non-matching PR
# shows a fast green run + a skipped `visual` job — never a perpetually-pending check.
#
# The `visual` job mirrors e2e-full.yml's app bringup verbatim (single shard).
# Baselines are platform-specific; regenerate them with
# scripts/regen-visual-baselines.sh (Linux CI image), never a bare --update on macOS
# (`--spec e2e/1736-wt-visual.spec.ts` for the WT set).
#
# #2211 — the Classic theme axis is four themes, always, and the committed
# baselines are exactly the set this workflow runs. There is no opt-in wider
# matrix any more (VISUAL_ALL_THEMES is gone). That equality is the point: the
# nine themes it used to hide behind a label rotted unwatched for five weeks and
# then billed an unrelated PR 23 red snapshots (#2210). Do not reintroduce a
# baseline this workflow does not exercise on every run.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel superseded PR runs (#1617). Dispatch runs use refs/heads/<branch>,
# PR runs use the PR ref — distinct groups, no cross-cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
      # #1936 — space-separated Playwright spec paths for the `visual` job.
      specs: ${{ steps.decide.outputs.specs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 50
          # #2315 — this job reads NOTHING from the working tree. Every step is
          # shell + git: resolve a merge-base, then decide from
          # `git diff --name-only origin/main...HEAD` which visual specs to run.
          # Commits and trees, never a blob.
          #
          # Unfiltered it is the worst tail in the fleet, because the merge-base
          # step escalates `--deepen` through 150/500/2000 — and on an unfiltered
          # repo each deepen drags historical copies of the 43.3M of visual
          # baselines. ship-guard.yml's own comment records that this exact shape
          # already killed this job once.
          #
          # `filter` alone would be a NO-OP (a full working tree makes checkout
          # lazily re-fetch every tip blob — measured 82M, worse than nothing),
          # so the sparse list is required. `scripts/ci` is a small real path
          # chosen only to stop the tree materialising; cone mode always includes
          # root files, and this job needs neither.
          filter: blob:none
          sparse-checkout: |
            scripts/ci

      # #1958 — resolve a merge-base WITHOUT the full-history fetch.
      #
      # `fetch-depth: 0` pulls every branch AND every tag at full depth. That
      # packfile is what blew the budget: 4m59s against a 5-minute job on
      # PR #1974 (task 13916), and the same shape killed visual-regression's
      # `detect`. This job only needs a changed-file list, so take a shallow
      # head and deepen just enough to reach the merge-base.
      - name: Ensure a merge-base with origin/main
        run: |
          set -e
          git fetch --no-tags --depth=50 origin +refs/heads/main:refs/remotes/origin/main
          for extra in 150 500 2000; do
            git merge-base origin/main HEAD >/dev/null 2>&1 && break
            git fetch --no-tags --deepen="$extra" origin +refs/heads/main:refs/remotes/origin/main
          done
          # Fail LOUD if it still can't be reached. A shallow graph makes
          # `git diff origin/main...HEAD` return NOTHING rather than erroring —
          # so a guard would pass vacuously, which is worse than a red build.
          git merge-base origin/main HEAD >/dev/null 2>&1 || {
            echo "::error::no merge-base with origin/main after deepening — refusing to diff an incomplete graph"
            exit 1
          }

      - name: Decide which visual specs to run
        id: decide
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-visual') }}
          EVENT: ${{ github.event_name }}
        run: |
          set -e
          CLASSIC="e2e/visual-regression.spec.ts"
          WT="e2e/1736-wt-visual.spec.ts"

          # The label / manual dispatch is the "I want the full picture" escape
          # hatch, so it forces BOTH specs regardless of the diff (#1936).
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$HAS_LABEL" = "true" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "specs=$CLASSIC $WT" >> "$GITHUB_OUTPUT"
            echo "trigger: event=$EVENT run-visual-label=$HAS_LABEL → running BOTH visual specs"
            exit 0
          fi

          git fetch origin main --quiet || true
          CHANGED=$(git diff --name-only origin/main...HEAD || true)
          echo "changed files vs origin/main:"; echo "$CHANGED"

          SPECS=""
          # Classic: any client CSS, the spec itself, or the shared freeze harness.
          if echo "$CHANGED" | grep -qE '^client/src/.*\.css$|^client/src/styles/|^client/index\.html$|^tests/e2e/visual-regression\.spec\.ts$|^tests/helpers/freeze\.ts$'; then
            SPECS="$CLASSIC"
            echo "→ Classic visual spec (client CSS / harness change)"
          fi
          # War Table: the same CSS + freeze harness (both are shared with the WT
          # surface — wartable.css and wt-*.css live under client/src/styles, and
          # the WT spec imports freezeForSnapshot too), PLUS the WT sources and
          # the WT spec itself. Keep these globs in step with the `wartable` area
          # in tests/e2e/spec-areas.json — #2298 added a GUARD for that
          # (scripts/check-wt-filter-parity.mjs), because this comment alone did not
          # stop the two lists drifting three ways:
          #   • `client/src/components/map/**` was missing from BOTH. MapTab.tsx
          #     renders War Table chrome — the maps drawer is portaled to
          #     document.body at --wt-menu-z and positioned off the WT panel
          #     rect — so a change there moves WT pixels with no CSS touched.
          #     That is how #2222 slipped past every pre-merge tier (#2295).
          #   • `useWtScale.ts` was in spec-areas but not here, so a WT *zoom*
          #     change skipped the pixel baseline — the one change most certain
          #     to move pixels.
          #   • spec-areas hardcoded `rulesets/shadowdark/` while this used
          #     `[^/]+`; a second ruleset's WT components routed here but not
          #     into the affected e2e tier.
          #   • `client/index.html` was in NEITHER list (#2414). It is global
          #     chrome that both layouts render inside — its `overflow-x` on
          #     <body> made <body> a scroll container and broke every sticky
          #     descendant in Classic. It is in BOTH branches now, not just
          #     this one, because a global overflow change moves Classic
          #     pixels at least as much as WT ones.
          if echo "$CHANGED" | grep -qE '^client/src/.*\.css$|^client/src/styles/|^client/index\.html$|^tests/helpers/freeze\.ts$|^client/src/pages/wartable/|^client/src/components/wt/|^client/src/rulesets/[^/]+/components/wt/|^client/src/components/map/|^client/src/hooks/useLayoutMode|^client/src/hooks/useWtScale|^client/src/lib/layoutMode|^tests/e2e/1736-wt-visual\.spec\.ts$'; then
            SPECS="$SPECS $WT"
            echo "→ War Table visual spec (WT source / CSS / harness change)"
          fi
          SPECS=$(echo "$SPECS" | xargs || true)   # collapse leading/duplicate spaces

          if [ -n "$SPECS" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "specs=$SPECS" >> "$GITHUB_OUTPUT"
            echo "running: $SPECS"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "specs=" >> "$GITHUB_OUTPUT"
            echo "no visual-relevant change and no run-visual label → skipping visual job"
          fi

  # #1113 — lazy CI-image prerequisite. Full rationale in e2e-full.yml's copy;
  # in short, this job builds darkwatch-ci-playwright:<ver> when the registry
  # has no usable (multi-arch) copy, so a Playwright bump can't hand `visual` a
  # tag nobody built.
  #
  # It carries `detect`'s condition VERBATIM rather than running unconditionally.
  # `visual` skips on most PRs (the path filter), and an unconditional job here
  # would take the single-capacity pi slot on every PR to do nothing. Because
  # the two conditions are identical, they skip and run together — so `visual`
  # never inherits a skipped need it didn't already expect.
  ensure-image:
    needs: detect
    if: needs.detect.outputs.should-run == 'true'
    runs-on: pi
    timeout-minutes: 75 # cold multi-arch build; the warm path is seconds
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          filter: blob:none
          sparse-checkout: |
            /.forgejo/
            /scripts/ci/
            /scripts/regen-visual-baselines.sh
            /tests/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Ensure the CI Playwright image exists for this tree
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: node scripts/ci/ensure-ci-image.mjs

  visual:
    needs: [detect, ensure-image]
    # #1113 blocker fix — `!cancelled()` is required, not decorative. Without a
    # status function a FAILED `ensure-image` skips this job, and a skipped
    # Forgejo job posts a `success` commit status (#1954) — so a registry 5xx or
    # a half-formed bump would turn the visual gate on a CSS PR into a green
    # check for a job that never ran. With it, the job runs and fails visibly at
    # container-pull instead. (The workflow_call namespacing trap documented in
    # e2e-full.yml applies to `needs.<job>.result`, not to a status function.)
    if: ${{ !cancelled() && needs.detect.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    # #1936 raised this 30 → 40 to fit the Classic spec's full 13-theme sweep
    # (312 shots, 13.2 min of Playwright) plus the WT spec's 1.6 min, on top of
    # this job's ~10 min of bringup (three npm ci, two builds, migrate, seed,
    # MinIO download).
    #
    # #2211 deleted that sweep — there is one path now, the four-theme one, which
    # measured ~6 min of Playwright and never came near even the old 30. The
    # ceiling is deliberately left at 40 rather than tightened back: the runner is
    # a shared VM and the bringup, not the specs, is what varies, so the headroom
    # costs nothing and a tight bound would only buy spurious timeout-reds.
    timeout-minutes: 40
    # #969 — prebuilt CI image (Node 22 + Chromium + Playwright deps baked).
    container:
      image: forge.example.com/aaron/darkwatch-ci-playwright:1.62.1
    services:
      mariadb:
        image: mariadb:11@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install server dependencies
        run: cd server && npm ci --no-audit --no-fund

      - name: Build server
        run: cd server && npm run build

      - name: Install client dependencies
        run: cd client && npm ci --no-audit --no-fund

      - name: Build client
        run: cd client && npm run build

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Start MinIO + create the images bucket
        # Mirrors e2e-full.yml: MinIO can't run as a Forgejo service (needs the
        # `server /data` arg), so run it in-step. Runs BEFORE seed so the qa-fixture
        # can stage its images (#1238). See e2e-full.yml for the full rationale.
        env:
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
        run: |
          case "$(uname -m)" in
            aarch64 | arm64) MINIO_ARCH=linux-arm64 ;;
            *) MINIO_ARCH=linux-amd64 ;;
          esac
          # #2010 — retrying helper, not a bare curl (see e2e-full.yml).
          bash scripts/ci/fetch-binary.sh "https://dl.min.io/server/minio/release/${MINIO_ARCH}/minio" /tmp/minio
          bash scripts/ci/fetch-binary.sh "https://dl.min.io/client/mc/release/${MINIO_ARCH}/mc" /tmp/mc
          chmod +x /tmp/minio /tmp/mc
          mkdir -p /tmp/minio-data
          /tmp/minio server /tmp/minio-data >/tmp/minio.log 2>&1 &
          echo $! > /tmp/minio.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1 && break || true
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
            [ "$i" -eq 30 ] && { echo "MinIO never became ready"; cat /tmp/minio.log; exit 1; }
          done
          for i in $(seq 1 30); do
            /tmp/mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && break || true
            echo "Waiting for MinIO client auth... ($i/30)"
            sleep 1
            [ "$i" -eq 30 ] && { echo "MinIO never accepted client auth"; cat /tmp/minio.log; exit 1; }
          done
          /tmp/mc mb --ignore-existing local/"$MINIO_BUCKET"
          /tmp/mc anonymous set download local/"$MINIO_BUCKET"
          echo "MinIO ready with bucket $MINIO_BUCKET (public-download)"

      - name: Seed all tiers (campaign screen needs the demo campaign)
        # SEED_MODE=all → core → shadowdark → demo → qa-fixture. The visual spec's
        # openCampaign() opens "Demo Campaign (Shadowdark)" (demo tier).
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
          MINIO_PUBLIC_BASE_URL: http://localhost:9000/darkwatch-images
        run: cd server && npm run seed

      - name: Start E2E app server
        env:
          PORT: "3001"
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          NODE_ENV: test
          ALLOW_TEST_HOOKS: "true"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          JWT_SECRET: e2e-test-secret
          CLIENT_URL: http://localhost:5173
          SOCKET_PER_USER_CAP: "1000"
          SOCKET_PER_IP_CAP: "1000"
          NODE_OPTIONS: "--max-old-space-size=256"
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
          MINIO_PUBLIC_BASE_URL: http://localhost:9000/darkwatch-images
        run: |
          node server/dist/index.js >/tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/auth/me 2>/dev/null || true)
            echo "$status" | grep -qE '^(200|401)$' && break || true
            echo "Waiting for app server... ($i/30) [got: $status]"
            sleep 2
            [ "$i" -eq 30 ] && echo "App server never became ready" && exit 1
          done

      - name: Start Vite preview server
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
          # #2538 — the port is PINNED here on purpose. It used to be supplied by
          # OMISSION: a bare `vite preview` took its port from
          # client/vite.config.ts, so CI silently inherited local dev's default
          # and this wait loop only worked because the two happened to agree.
          # Moving local dev into the 10900 block would have reddened this job
          # with "Vite preview server never became ready". The number is
          # deliberately UNCHANGED — CI binds exactly what it bound before; it
          # just no longer borrows the value from a file dev is free to change.
          # --strictPort so a busy port fails loudly instead of falling forward.
        run: |
          cd client && ./node_modules/.bin/vite preview --port 5173 --strictPort >/tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite preview server never became ready" && exit 1
          done

      - name: Warm up app server (login + auth + campaigns)
        run: |
          set -e
          curl -s -c /tmp/dm-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"dm@darkwatch.test","password":"password"}' >/dev/null
          for pass in 1 2; do
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/campaigns >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/dashboard >/dev/null
          done
          rm -f /tmp/dm-cookies.txt
          echo "warmup complete"

      - name: Install tests dependencies (browsers baked in image)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && npm ci --no-audit --no-fund

      - name: Run visual specs
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          # #2538 — pinned for the same reason as the Vite port above: this
          # was previously supplied by OMISSION from tests/playwright.config.ts,
          # so CI's target silently tracked local dev's default. Same number as
          # before; it just no longer moves when dev's does.
          E2E_BASE_URL: "http://localhost:5173"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          # #2211 — VISUAL_ALL_THEMES is gone. The spec ran a 4-theme default with
          # an opt-in 13-theme sweep behind that variable, which this step set from
          # the `run-visual` label / dispatch. The nine opt-in themes and their
          # baselines are deleted, so every run is now the same four themes and the
          # variable had nothing left to switch. `run-visual` and workflow_dispatch
          # still force BOTH specs to RUN (see `detect`) — that is unchanged and is
          # what the label is still for; they just no longer widen the theme axis.
          # #1936 (same trap as #1581 in e2e-full.yml) — 1736-wt-visual.spec.ts's
          # loot shot writes campaign_loot through tests/helpers/db.ts, which falls
          # back to 127.0.0.1:3397 (the local-dev address) when DB_* is unset. That
          # INSERT is not catch-guarded, so without these the WT spec fails here.
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          SPECS: ${{ needs.detect.outputs.specs }}
        # $SPECS is intentionally unquoted: it is a space-separated spec list that
        # must word-split into separate Playwright arguments. playwright.config.ts
        # pins `workers: 1`, so the two specs run sequentially and cannot stomp
        # each other's shared-campaign setup.
        run: cd tests && ./node_modules/.bin/playwright test $SPECS --reporter=line

      - name: Upload diff artifacts on failure
        if: failure()
        # v4 unsupported on Forgejo's actions backend; pin v3 (see e2e-full.yml).
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: visual-regression-report-${{ github.run_id }}
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 14
