name: Nightly E2E

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          # CI DB credentials come from Forgejo repo secrets (Settings → Secrets).
          # Required: CI_DB_ROOT_PASSWORD, CI_DB_NAME, CI_DB_USER, CI_DB_PASSWORD.
          # See .forgejo/workflows/README.md for details.
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="mariadb-admin ping -u root -p${{ secrets.CI_DB_ROOT_PASSWORD }} --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: cd server && npm install

      - name: Build server
        run: cd server && npm run build

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Start E2E app server
        env:
          PORT: "3001"
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          NODE_ENV: test
          ALLOW_TEST_HOOKS: "true"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          JWT_SECRET: e2e-test-secret
          CLIENT_URL: http://localhost:5173
          NODE_OPTIONS: "--max-old-space-size=256"
        run: |
          node server/dist/index.js >/tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          # Wait for server on port 3001 — accept 200 or 401, reject 5xx/no-response
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/auth/me 2>/dev/null || true)
            echo "$status" | grep -qE '^(200|401)$' && break || true
            echo "Waiting for app server... ($i/30) [got: $status]"
            sleep 2
            [ "$i" -eq 30 ] && echo "App server never became ready" && exit 1
          done

      - name: Start Vite preview server
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          cd client && npx vite preview >/tmp/vite.log 2>&1 &
          VITE_PID=$!
          echo $VITE_PID > /tmp/vite.pid
          # Wait for Vite on port 5173
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite preview server never became ready" && exit 1
          done

      - name: Install Playwright and browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/ci/playwright-cache
        run: cd tests && npm ci && npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests (stabilize-ownership — Death-save)
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /home/ci/playwright-cache
        run: cd tests && npx playwright test e2e/stabilize-ownership.spec.ts --grep "Death-save button" --reporter=line

      - name: Restart Vite preview (mid-stabilize)
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          kill $(cat /tmp/vite.pid) 2>/dev/null || pkill -f "vite preview" || true
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:5173 || break
            echo "Waiting for old Vite to stop... ($i/15)"
            sleep 1
          done
          cd client && npx vite preview >/tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for new Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite never came back up" && exit 1
          done

      - name: Run Playwright E2E tests (stabilize-ownership — Stabilize + DM transfer)
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /home/ci/playwright-cache
        run: cd tests && npx playwright test e2e/stabilize-ownership.spec.ts --grep "Stabilize button|DM control transfer" --reporter=line

      - name: Restart Vite preview (clear memory between E2E batches)
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          kill $(cat /tmp/vite.pid) 2>/dev/null || pkill -f "vite preview" || true
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:5173 || break
            echo "Waiting for old Vite to stop... ($i/15)"
            sleep 1
          done
          cd client && npx vite preview >/tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for new Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite never came back up" && exit 1
          done

      - name: Run Playwright E2E tests (batch 1 - remaining 9 specs)
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /home/ci/playwright-cache
        run: |
          cd tests && npx playwright test \
            e2e/condition-expiry.spec.ts \
            e2e/creature-gallery.spec.ts \
            e2e/crit-banner.spec.ts \
            e2e/dashboard.spec.ts \
            e2e/death-recovery.spec.ts \
            e2e/death-timer.spec.ts \
            e2e/level-up.spec.ts \
            e2e/rest-button.spec.ts \
            e2e/spell-exhaustion.spec.ts \
            --reporter=line

      - name: Dump server and vite logs on failure
        if: failure()
        run: |
          echo "=== server log (last 200 lines) ==="
          tail -n 200 /tmp/server.log || echo "no server log"
          echo "=== vite log (last 200 lines) ==="
          tail -n 200 /tmp/vite.log || echo "no vite log"
          echo "=== process status ==="
          if [ -f /tmp/server.pid ]; then
            PID=$(cat /tmp/server.pid)
            kill -0 "$PID" 2>/dev/null && echo "server $PID running" || echo "server $PID NOT running"
          fi
          if [ -f /tmp/vite.pid ]; then
            PID=$(cat /tmp/vite.pid)
            kill -0 "$PID" 2>/dev/null && echo "vite $PID running" || echo "vite $PID NOT running"
          fi

      - name: Post logs to issue #219 on failure (for autonomous triage)
        if: failure()
        env:
          CI_LOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          server = open('/tmp/server.log').read()[-12000:] if os.path.exists('/tmp/server.log') else '(no server log)'
          vite = open('/tmp/vite.log').read()[-4000:] if os.path.exists('/tmp/vite.log') else '(no vite log)'
          run_id = os.environ.get('GITHUB_RUN_ID', 'unknown')
          sha = os.environ.get('GITHUB_SHA', 'unknown')[:12]
          body = f"# Run {run_id} @ {sha}\n\n## server.log (tail 12k)\n```\n{server}\n```\n\n## vite.log (tail 4k)\n```\n{vite}\n```"
          req = urllib.request.Request(
              'https://forge.example.com/api/v1/repos/aaron/darkwatch/issues/219/comments',
              data=json.dumps({'body': body}).encode(),
              headers={'Authorization': f"token {os.environ['CI_LOG_TOKEN']}", 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req) as r:
              print('posted comment, status', r.status)
          PY
