name: E2E Full Suite

# Runs the ENTIRE Playwright e2e suite — every spec in tests/e2e, with NO
# hard-coded allow-list (#1141). The per-PR pipeline (ci.yml's `smoke` job) runs
# a curated, fast subset (guarded by scripts/check-e2e-tiers.mjs so no spec is
# silently left out of every pre-merge tier). This full job is the nightly
# backstop + deploy gate, so specs not on the smoke list — maps, spells,
# concurrency, mobile, presence — can't silently rot in the dark. It runs nightly
# (via nightly-deploy.yml) and on demand (workflow_dispatch).
#
# #1270 — the old curated nightly `e2e.yml` was removed: it was a strict subset
# of this suite and added nothing to the deploy gate, just a second drift-prone
# allow-list. This full suite is now the only nightly Playwright gate.
#
# DEPLOY GATE: nightly-deploy.yml's deploy job `needs` this, so a regression in
# any covered spec blocks the nightly deploy. Known-broken specs are quarantined
# with `test.fixme` (see #1141) so a clean suite stays green; if a flaky spec
# blocks the deploy, prefer adding retries/quarantine over dropping the gate.
#
# Memory: the suite is split into 3 shards. Each shard is its own JOB with its
# own container, MariaDB service and Vite preview (#2300) — previously all three
# ran sequentially inside one job with an explicit `pkill`/restart of Vite
# between them, because a single long-lived Vite preview accumulates heap across
# test contexts and gets OOM-killed mid-suite in the capped CI container. The
# per-job Vite gives exactly the lifetime those restarts were manufacturing (one
# shard's worth, and a slightly SHORTER one now that the shards are balanced —
# ~11.4m/~130 tests vs the 16.3m/128 that shard 1 used to survive), so the
# restart steps are gone rather than merely unnecessary.
#
# Sharding is by MEASURED DURATION, not Playwright's count-based `--shard` —
# see scripts/ci/e2e-partition.mjs and tests/spec-timings.json.

on:
  workflow_call:
    inputs:
      # #2409 — the nightly gate must test the SAME ref the deploy ships, or it
      # stops covering what goes out. Empty is deliberate: actions/checkout
      # treats an empty `ref` as "use this event's default", so schedule / PR /
      # dispatch runs behave exactly as before.
      ref:
        description: "git ref to test; empty = this event's default"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to test (e.g. v0.198.0); empty = default"
        required: false
        default: ""
  schedule:
    # #1622 — midday no-deploy backstop at 19:00 UTC (3pm ET). The deploy gate
    # runs at 06:00 UTC (2am ET, nightly-deploy.yml); a spec-breaking merge made
    # during the ET workday otherwise first executes there, ~a day late against
    # the whole day's merges. This second run catches most of the day's merges by
    # mid-afternoon ET — it runs THIS workflow directly (schedule trigger), NOT
    # via nightly-deploy.yml, so it never deploys. Scheduled runs only fire from
    # the default branch's copy of this file, so the cron is observable only after
    # merge (a branch prove uses workflow_dispatch). Hour = Aaron's call (#1620).
    - cron: "0 19 * * *"
  # #2533 — the `run-e2e-full` label no longer gates anything; this suite runs on
  # every PR. The paragraph below is kept for the history of why it was opt-in.
  #
  # #1623 — opt-in `run-e2e-full` PR label. Historically this suite had NO
  # pull_request trigger (running the heavy suite on every PR starved the shared
  # OrbStack VM — MariaDB killed mid-seed, /workspace tmpfs ENOSPC). It still
  # never runs on an unlabeled PR: the `e2e-full` job's `if:` below skips unless
  # the PR carries `run-e2e-full`, so an unlabeled PR only pays a no-op job
  # evaluation. This job-level `if:` is used deliberately instead of an `if:` on a
  # reusable-workflow (`uses:`) job — Forgejo does NOT honor the latter (it ran
  # the suite anyway on the first #1623 attempt). Label the PR for combat-core /
  # maps / server-authoritative / broadcast-shape changes + multi-ticket batches.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Concurrency splits on ONE axis: is this a PR, or is it the deploy gate?
#
# NON-PR (nightly workflow_call, the midday cron, manual dispatch) keeps the
# single serialized `e2e-full` lane with NO cancel. These are the deploy gate;
# two must never stack on the shared VM (#1622), and an in-flight gate must be
# allowed to finish rather than be killed by the next one.
#
# PR runs get a PER-REF group and ARE cancelled by a newer push (#2300 phase 2).
# Two changes from the old behaviour, both deliberate:
#   - A LABELED `run-e2e-full` PR used to share the single heavy lane, so a
#     second PR waited out the first — up to ~20 min of dead time before its
#     suite even started. Per-ref removes that. Measured first: PR-triggered
#     runs are 15 in 30 days (0.5/day), and a run occupies 3 of the fleet's 8
#     slots for ~16-20 min, so concurrent PR suites are rare and affordable. The
#     #1623 starvation guard is preserved where it actually matters (the gate).
#   - `cancel-in-progress` is now TRUE for PRs. Re-pushing to a labeled PR used
#     to leave the superseded suite running to completion against code nobody
#     would merge — 6 of those 15 runs were `pull_request_sync` re-pushes, i.e.
#     ~2h of runner time per month spent on dead commits.
# An UNLABELED PR still lands in a per-ref group and so still never queues
# behind a nightly just to evaluate its skip-gate, which is what #1623 bought.
#
# `cancel-in-progress` as an EXPRESSION is not something this stack was known to
# honour — Forgejo silently ignoring it would read exactly like "nothing needed
# cancelling". Proven on a throwaway probe before relying on it: two dispatches
# 20s apart, the first ended `cancelled` at 21s and the second ran its full 122s.
#
# Cancelling a PR run cannot block a merge: the required contexts are
# `CI / lint-typecheck`, `CI / test`, `CI / smoke` and `coverage-bot` — e2e-full
# is opt-in and is not among them.
#
# #2483 — THIS BLOCK DOES NOT GOVERN THE NIGHTLY DEPLOY GATE. When this workflow
# is invoked through `uses:` it gets no run of its own, and concurrency is a
# per-RUN property in Forgejo (`action_run.concurrency_group`; there is no such
# column on `action_run_job`, so job-level concurrency does not exist here).
# The callee's block is therefore never evaluated — the caller's run carries the
# group. `nightly-deploy.yml` declares `group: e2e-full` itself to join this
# lane; see the long comment there. If you add another `workflow_call` caller of
# this workflow, it needs the same declaration or it will escape the lane.
concurrency:
  group: ${{ github.event_name != 'pull_request' && 'e2e-full' || format('e2e-full-pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #2300 phase 4 — decide whether this PR needs the suite at all.
  #
  # ALWAYS RUNS, with no job-level `if:`, deliberately. `e2e-full` below has
  # `needs: detect`, and a job whose need was SKIPPED is itself skipped — which
  # on the nightly path would silently skip the deploy gate. That is the #2351
  # shape, and a skipped job reports as `success` through the Forgejo API.
  #
  # The CHECKOUT is what costs (measured: 127s of a 127s job, run 10294 — it is
  # `fetch-depth: 0` because a merge-base needs history), so it is gated to the
  # PR path. A non-PR trigger needs no git at all to know the answer, and paying
  # two minutes on every nightly gate for a decision that is always "run" would
  # be a straight tax on the deploy.
  #
  # Both step gates are complements, so if either `if:` ever mis-evaluates the
  # output is EMPTY rather than "false" — and e2e-full's gate is `!= 'false'`,
  # so an unresolved expression RUNS the suite. Fail-safe by construction, which
  # is the property that matters when the alternative is a silent skip.
  detect:
    runs-on: ubuntu-latest
    # #2528 — 10, not 5. The PR path checks out with `fetch-depth: 0` to get a
    # merge-base, and that cost is dominated by the Pi's link and host load
    # (#2315), not by the work. Measured over 30 days: PR-path successes ran
    # 65s / 74s / 112s / 181s, and FOUR runs died at exactly 300-301s — half of
    # every run that actually checks out. 5 was never a considered figure
    # against a 181s worst observed success; 10 puts real headroom over the tail
    # rather than sitting inside it.
    timeout-minutes: 10
    outputs:
      should-run: ${{ steps.non-pr.outputs.should-run || steps.decide.outputs.should-run }}
    steps:
      - name: Non-PR triggers always run the suite
        id: non-pr
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "e2e-full opt-out: RUN — event is ${{ github.event_name }}, not a pull request"
          echo "should-run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          # History for the merge-base, but no blobs — this only reads a list of
          # file names. Same recipe as ci.yml's tree-gate (#2315).
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether e2e-full should run
        id: decide
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/ci/e2e-optout.mjs

  # #1113 — LAZY CI-IMAGE PREREQUISITE.
  #
  # The suite runs inside darkwatch-ci-playwright:<@playwright/test ver>, but
  # build-ci-image.yml only fired on push-to-main — so a PR that bumped
  # Playwright referenced a tag nobody had built and every shard died at
  # container-pull with `manifest unknown` (reproduced on #2571, 2026-08-24).
  # This job makes the image a PREREQUISITE instead of something someone
  # remembers to dispatch first.
  #
  # `runs-on: pi`: the build pushes to the Forgejo registry, and Cloudflare's
  # ~100MB body cap 413s a layer push through the public host — building on the
  # Pi lets it push to localhost:3000 instead. The pi runner's capacity of 1 is
  # load-bearing here: it serialises concurrent ensure-image jobs, so the first
  # builds and the rest queue, find the tag present, and no-op. No duplicate
  # builds and no lock to write.
  #
  # Deliberately UNCONDITIONAL: `e2e-full` runs on every PR, so this must too.
  # The already-present path is one registry GET (~seconds), not a build.
  ensure-image:
    runs-on: pi
    # Sized for the cold path: a multi-arch build is native arm64 plus an
    # emulated amd64 leg, measured at 17m52s on its own (2026-08-24). The warm
    # path — every run that is not a Playwright bump — is seconds.
    timeout-minutes: 75
    steps:
      # #1113 review round 2 — THE TOOL, from the ref this workflow runs on.
      # NOT `inputs.ref`: every existing release tag predates this script, so a
      # single tag-pinned checkout dies with MODULE_NOT_FOUND (proven on pi4,
      # task 22365). The decider must come from the running workflow; the tree
      # being decided about comes from the checkout below.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/ci/
          sparse-checkout-cone-mode: false

      # THE SUBJECT — the tree actually under test. nightly-deploy.yml pins a
      # release tag here (#2409), and this is the tree whose lockfile and image
      # tags must agree. An empty `ref` means "this event's default", so the
      # pull_request / cron paths read their own checkout, unchanged.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          path: _subject
          filter: blob:none
          sparse-checkout: |
            /.forgejo/
            /scripts/regen-visual-baselines.sh
            /tests/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Ensure the CI Playwright image exists for this tree
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: node scripts/ci/ensure-ci-image.mjs --tree _subject

  e2e-full:
    needs: [detect, ensure-image]
    # #2300 phase 3 (#2533) — the `run-e2e-full` label gate is GONE. This suite
    # now runs on EVERY pull request, which is the whole point of the umbrella:
    # it removes the tier split that produced #1780 / #2295 / #2298 instead of
    # patching it. The label itself is now a no-op and can be retired.
    #
    # #1623's original bargain — opt-in, because the heavy suite starved the
    # shared VM — was retired by measurement, not by fiat. Phase 1 made the
    # shards parallel and duration-balanced (35.7m -> ~19m), phase 2 gave PRs
    # their own concurrency lane, and #2315 cut the checkouts. What settled it
    # was the shape of the cost rather than its size: a War Table or sessions PR
    # already paid ~17m in `smoke`, because the affected tier appended 21
    # nightly-only specs — and even then it ran 21 of 49 affected specs, since
    # the per-area cap truncates it. So on exactly the PRs where a regression is
    # most likely, this trades ~2 minutes for going from capped, partial
    # coverage to all 157 specs. (Measured 2026-08-21: smoke 17.0m/19.4m on
    # area-matching PRs vs 7.3-8.4m otherwise; e2e-full 18.3-19.3m on run 10586.)
    #
    # Every non-PR trigger (nightly workflow_call, midday cron, manual dispatch)
    # was always unconditional here and still is.
    #
    # ⚠ DO NOT "tidy" this into a thin caller workflow with a gated `uses:` job.
    # **Forgejo does not honour `if:` on a reusable-workflow (`uses:`) job.** That
    # was the first attempt at #1623 — a separate e2e-full-label.yml whose caller
    # job was `uses: e2e-full.yml` behind `if: needs.detect.outputs.should-run`.
    # The gate was silently ignored and the whole suite ran on an unlabeled PR.
    # The gate only works as a NORMAL-job `if:`, inlined here, which is why this
    # workflow owns its own `pull_request` trigger instead of being wrapped.
    # (Same reason visual-regression.yml gates its `visual` job in-place.)
    # #2300 phase 4 adds the `!= 'false'` clause. Note the INVERSION: only an
    # explicit "false" skips. An empty or missing output — detect crashed, the
    # expression did not resolve — runs the suite. Written `!= 'false'` rather
    # than `== 'true'` precisely so a broken detect job cannot silently skip the
    # deploy gate, which would report as `success` through the Forgejo API.
    #
    # #2528 — `!cancelled()` is the fail-open, and it is load-bearing. `detect`'s
    # header claims the gate is "fail-safe by construction" because a
    # mis-evaluating `if:` yields an EMPTY output and the gate reads `!= 'false'`.
    # That held for a bad expression and NOT for a job that DIES: a failed need
    # skips its dependents, so a timed-out `detect` silently skipped the whole
    # suite while the three shard checks still reported `success` (Forgejo posts
    # success for a skipped job — #1954). The documented fail-safe inverted in
    # exactly the failure mode that actually happened.
    #
    # A status function is what keeps a job alive when its need did not succeed,
    # so an empty `should-run` now reaches the `!= 'false'` test and the suite
    # RUNS. A broken gate costs CI minutes, never coverage.
    #
    # `!cancelled()` and NOT `always()`, for the reason ci.yml:174 already
    # records against the identical #2308 shape: `always()` would also run this
    # on an explicitly cancelled run.
    #
    # ⚠️ #2533 step 1b — `should-run` is DELIBERATELY NOT in this condition.
    # It moved to the individual steps below, and that is the property that
    # makes these three leg contexts safe to require in branch protection.
    #
    # A skipped Forgejo job posts a `success` commit status (#1954). While the
    # phase-4 decision lived HERE, a docs-only PR skipped the whole job and
    # presented three green checks for a suite that never ran — harmless while
    # the suite was opt-in, and a merge-on-nothing hole the moment it is
    # required. Guarding STEPS instead means the job always RUNS and always
    # reports from a real execution; "green" means a job made a deliberate
    # decision. Same reasoning, and the same shape, as #2496 for `test`/`smoke`
    # — see the REQUIRED_CONTEXTS comment in scripts/ci/tree-gate-core.mjs.
    #
    # `!cancelled()` stays, and only that: it is false solely on an explicitly
    # cancelled run (which cannot merge), never because of what the diff
    # touched. It is what keeps this job alive when `detect` DIES rather than
    # merely answering — the #2528 fail-open.
    #
    # #1113 — `ensure-image` is in `needs` for ORDERING ONLY; this `if:` is
    # deliberately left as a bare `!cancelled()`.
    #
    # The tempting version is `!cancelled() && needs.ensure-image.result ==
    # 'success'`, so a failed prerequisite gives the clear error instead of the
    # confusing `manifest unknown`. It is a trap. Under workflow_call — the
    # nightly-deploy path — Forgejo NAMESPACES the callee's jobs (`needs` keys
    # read `e2e-full.ensure-image`, see #2011 below), so `needs.ensure-image`
    # resolves to null, `null == 'success'` is false, and this suite would SKIP
    # on every nightly. A skipped callee job then folds into the caller's
    # aggregate as failure (#2368/#2351) and blocks the deploy.
    #
    # `!contains(needs.*.result, 'failure')` survives the namespacing but is
    # also wrong here: it would catch `detect` failing and undo #2528's
    # fail-open, which is the whole reason this `if:` exists.
    #
    # So a failed ensure-image lets the shards run and fail at container-pull.
    # That is noisier, not less diagnosable: ensure-image reports first, names
    # the offending file and line, and sits directly above the shards in the
    # same run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # #2300 — was 75 for all three shards plus two Vite restarts in ONE job.
    # Sized against MEASURED parallel behaviour (run 10148), not the solo
    # projection: Forgejo hands all three shards to whichever runner has the
    # capacity, so they normally land on ONE host and contend for its CPU. That
    # run took 20.4m wall (4.5m setup + 15.8m tests) against an 12.6m
    # uncontended projection.
    #
    # #2533 — RAISED 35 -> 50. Re-measured 2026-08-23 across 154 substantive
    # matrix legs / 48 runs, reading `action_task_step` so that SCHEDULING time
    # and WORK time are separated.
    #
    # ⚠️ The first version of this comment (and #2533's changelog fragment) said
    # "co-location costs roughly 2x" and cited legs of 28.6m and 25.8m as the
    # longest PASSING runs. Both claims were wrong, and wrong the same way: those
    # legs each sat ~10.4m in PRE-STEP time before their first step ran. Their
    # actual work was 17.5-18.2m and 14.7-15.2m — ordinary. Comparing job
    # durations attributes a scheduling stall to CPU contention. Don't.
    #
    # What the 154 legs actually show, median step time on passing legs:
    #
    #   legs of one run sharing a host   1 leg    2 legs   3 legs
    #     Global-Falcon-0x                 14.48m   15.63m   17.98m
    #     m4-runner                      12.78m   13.82m   —
    #
    # Co-location costs ~24%, not 2x. The larger variable is WHICH machine:
    # m4-runner medians 13.50m against Falcon's ~17.0m, so an m4 carrying two legs
    # still beats a Falcon box carrying one. 31% of runs put all three legs on one
    # host and only 2% get three distinct hosts, but at +24% that is a tuning
    # problem, not the thing this budget is sized around. See #2535.
    #
    # THE BUDGET IS SIZED FOR THE TAIL, and the tail is two things stacking:
    #
    #   1. A retry-heavy FAILING leg. Worst observed step time is 32.03m — real
    #      failures re-running under `retries`, not contention.
    #   2. A PRE-STEP STALL. Median pre-step across all 154 legs is 0.13m. Eight
    #      legs exceed 2m and ALL EIGHT are on Global-Falcon-02: 5.13 5.20 9.82
    #      10.37 10.37 10.37 10.48 10.48 — roughly 1x and 2x of a ~5.2m unit,
    #      i.e. a fixed-backoff retry, most likely a failing container-image pull
    #      from the Pi. That is a host defect (#2567); it is NOT something
    #      more runners fix.
    #
    # 32.03 + 10.48 ≈ 42.5m, against a 35m ceiling. That is the case this raise
    # covers. 50 leaves headroom over it without being open-ended.
    #
    # What changed the urgency is FREQUENCY: #2300 phase 3 made this suite run on
    # every PR rather than twice a day, so a tail that used to be sampled twice
    # daily is now sampled on every push.
    #
    # This does not mask a hang. A stuck leg still dies, 15 minutes later, and
    # Playwright's own per-test timeout bounds any single spec long before the
    # job budget is reached. The cost of the raise is that a legitimately failing
    # leg can now burn longer before reporting; `fail-fast: false` means the
    # other two report on their own schedule regardless.
    timeout-minutes: 50
    strategy:
      # Every shard must report independently: the deploy gate wants to know
      # ALL the specs that broke, not just the ones before the first failure.
      # (Sequential shards already behaved this way only by accident — a red
      # shard 1 aborted the job and hid shards 2 and 3 entirely.)
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Skip visual-regression screenshots here: each shard runs its specs
      # serially against ONE shared DB, so late screenshots inherit earlier
      # specs' leftover state (#1041) and drift off the pristine
      # baselines (nightly runs 4740/4796 — deploy gate red two nights running).
      # Pixel comparison runs pre-merge in visual-regression.yml (fresh DB,
      # attributable diff); this gate tests function.
      E2E_SKIP_VISUAL: "1"
    # #969 — prebuilt CI image (Node 22 + Chromium + Playwright deps baked).
    container:
      image: forge.example.com/aaron/darkwatch-ci-playwright:1.62.1
    services:
      mariadb:
        image: mariadb:11@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      # #2533 step 1b — this job now ALWAYS runs, so say plainly when it did
      # nothing. A green check whose reason is invisible is the #2010/#2011
      # failure mode; `detect` writes its own summary, and this makes the shard's
      # check self-explanatory on its own.
      - name: Runtime-irrelevant diff — this shard has nothing to run
        if: ${{ needs.detect.outputs.should-run == 'false' }}
        run: |
          echo "shard ${{ matrix.shard }}/3: skipped — the diff cannot affect runtime (#2300 phase 4)."
          echo "This job RAN and is reporting honestly; only its expensive steps were skipped (#2533)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        with:
          ref: ${{ inputs.ref }}
          # #2315 — skip the 21M of Playwright visual baselines. This job sets
          # E2E_SKIP_VISUAL=1 (see the job `env:` above), which playwright.config.ts
          # turns into a `**/visual-regression.spec.ts` exclusion, so the snapshots
          # are never read here. Only visual-regression.yml's `visual` job reads them.
          #
          # `filter` alone is a NO-OP with a full working tree (#2338) — the sparse
          # list is what stops the lazy re-fetch of tip blobs. And cone-mode MUST be
          # off: cone mode rejects `!` patterns outright (`fatal: specify directories
          # rather than patterns`) and leaves the full tree, so this would silently be
          # a no-op with it on.
          #
          # This matters more here than anywhere else: all three shards are handed to
          # whichever runner has capacity, so they normally land CO-LOCATED on one
          # host and clone concurrently (#2300 phase 1).
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !tests/e2e/visual-regression.spec.ts-snapshots

      - name: Cache npm downloads
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install server dependencies
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        run: cd server && npm ci --no-audit --no-fund

      - name: Build server
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        run: cd server && npm run build

      - name: Install client dependencies
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        run: cd client && npm ci --no-audit --no-fund

      - name: Build client
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        run: cd client && npm run build

      - name: Wait for MariaDB
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && echo "MariaDB is ready" && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "MariaDB never became ready" && exit 1
          done

      - name: Apply migrations to CI DB
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: cd server && npm run db:migrate

      - name: Start MinIO + create the images bucket
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        # #1141 — image specs (image-picker) store uploads in object storage.
        # MinIO can't run as a Forgejo `service` (the image needs the `server
        # /data` command arg, which services can't set), so run it in-step:
        # download the static binaries, start the server, create the bucket and
        # make it anonymously downloadable (mirrors docker-compose's minio-init).
        #
        # Runs BEFORE the seed step on purpose: the shadowdark-qa fixture (#1238)
        # stages its map + handout images through the image service and, when
        # MinIO isn't configured, SKIPS creating the active map entirely
        # (qa-fixture.ts) — which left map-viewport-persistence.spec.ts with no
        # map to render. MinIO must be up (and the seed step must get MINIO_*
        # env) for the fixture's map to exist.
        env:
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
        run: |
          case "$(uname -m)" in
            aarch64 | arm64) MINIO_ARCH=linux-arm64 ;;
            *) MINIO_ARCH=linux-amd64 ;;
          esac
          # #2010 — via fetch-binary.sh, NOT a bare curl: one corrupted TLS
          # record on the ~100MB download (curl exit 56, "bad record mac")
          # killed this job outright twice in 24h, once taking the nightly
          # deploy gate with it. The helper retries transport failures and
          # never leaves a truncated file where chmod +x can reach it.
          bash scripts/ci/fetch-binary.sh "https://dl.min.io/server/minio/release/${MINIO_ARCH}/minio" /tmp/minio
          bash scripts/ci/fetch-binary.sh "https://dl.min.io/client/mc/release/${MINIO_ARCH}/mc" /tmp/mc
          chmod +x /tmp/minio /tmp/mc
          mkdir -p /tmp/minio-data
          /tmp/minio server /tmp/minio-data >/tmp/minio.log 2>&1 &
          echo $! > /tmp/minio.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1 && break || true
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
            [ "$i" -eq 30 ] && { echo "MinIO never became ready"; cat /tmp/minio.log; exit 1; }
          done
          # `/minio/health/ready` can flip green a beat before the server accepts
          # client auth, so `mc alias set` intermittently hits "Server not
          # initialized yet" and — under `set -e` — kills the whole job (recurring
          # e2e-full flake). Retry the alias until it authenticates, mirroring the
          # health loop above, before touching the bucket.
          for i in $(seq 1 30); do
            /tmp/mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && break || true
            echo "Waiting for MinIO client auth... ($i/30)"
            sleep 1
            [ "$i" -eq 30 ] && { echo "MinIO never accepted client auth"; cat /tmp/minio.log; exit 1; }
          done
          /tmp/mc mb --ignore-existing local/"$MINIO_BUCKET"
          /tmp/mc anonymous set download local/"$MINIO_BUCKET"
          echo "MinIO ready with bucket $MINIO_BUCKET (public-download)"

      - name: Seed all tiers (full suite assumes a fully seeded DB)
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        # SEED_MODE=all (= `npm run seed`) rather than the granular
        # core+shadowdark+demo list. The full suite runs EVERY spec, including
        # ones that depend on tiers the granular list forgot — e.g.
        # map-viewport-persistence.spec.ts needs the QA Fixture campaign from the
        # `shadowdark-qa` tier (#1238), which the old list omitted, so the spec
        # failed its seed precondition on every nightly. `all` seeds core →
        # shadowdark → demo → qa-fixture, so a newly-added seed tier can't
        # silently drift out of CI again.
        #
        # MINIO_* env (+ MinIO running, started above) is required so the qa
        # fixture stages its map image and creates the active map; without it the
        # fixture skips the map and map-viewport-persistence.spec.ts has nothing
        # to render.
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
          MINIO_PUBLIC_BASE_URL: http://localhost:9000/darkwatch-images
        run: cd server && npm run seed

      - name: Start E2E app server
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        env:
          PORT: "3001"
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          NODE_ENV: test
          ALLOW_TEST_HOOKS: "true"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          # #2116/#2149 — the seeded `Admin` account's id is fixed (ADMIN_FIXED_ID
          # in server/src/seeds/core.ts); without this the server treats it as an
          # ordinary user and every admin route renders its "no admin access"
          # notice. ci.yml's smoke job gained this line when 2116-wave3 was
          # written; this lane never did, and e2e-full is skipped on PRs — so the
          # four admin specs had never run in CI at all until the 2026-08-02
          # nightly, where they failed shard 2 and blocked the deploy gate.
          # Keep in sync with ci.yml's smoke job.
          ADMIN_USER_IDS: ad000000-0000-7000-8000-000000000001
          JWT_SECRET: e2e-test-secret
          CLIENT_URL: http://localhost:5173
          # Same socket-cap relaxation as ci.yml's smoke job (#388): the suite runs as one
          # DM user; closed-page sockets reap slower than they accumulate.
          SOCKET_PER_USER_CAP: "1000"
          SOCKET_PER_IP_CAP: "1000"
          NODE_OPTIONS: "--max-old-space-size=256"
          # #1141 — image specs (image-picker) upload to object storage; a MinIO
          # instance + bucket is brought up in the "Start MinIO" step above.
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ROOT_USER: darkwatch_admin
          MINIO_ROOT_PASSWORD: darkwatch_minio_dev
          MINIO_BUCKET: darkwatch-images
          MINIO_PUBLIC_BASE_URL: http://localhost:9000/darkwatch-images
        run: |
          node server/dist/index.js >/tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/auth/me 2>/dev/null || true)
            echo "$status" | grep -qE '^(200|401)$' && break || true
            echo "Waiting for app server... ($i/30) [got: $status]"
            sleep 2
            [ "$i" -eq 30 ] && echo "App server never became ready" && exit 1
          done

      - name: Start Vite preview server
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        env:
          API_PROXY_URL: "http://localhost:3001"
          NODE_OPTIONS: "--max-old-space-size=512"
          # #2538 — the port is PINNED here on purpose. It used to be supplied by
          # OMISSION: a bare `vite preview` took its port from
          # client/vite.config.ts, so CI silently inherited local dev's default
          # and this wait loop only worked because the two happened to agree.
          # Moving local dev into the 10900 block would have reddened this job
          # with "Vite preview server never became ready". The number is
          # deliberately UNCHANGED — CI binds exactly what it bound before; it
          # just no longer borrows the value from a file dev is free to change.
          # --strictPort so a busy port fails loudly instead of falling forward.
        run: |
          cd client && ./node_modules/.bin/vite preview --port 5173 --strictPort >/tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && break || true
            echo "Waiting for Vite... ($i/30)"
            sleep 2
            [ "$i" -eq 30 ] && echo "Vite preview server never became ready" && exit 1
          done

      - name: Warm up app server (login + auth + campaigns)
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        # The first specs hit cold connection pools, V8 JIT and socket handlers,
        # exceeding their waits (cold-start flake — e.g. 566-npc-combat's first
        # test). Priming with a few authed requests lands the first specs on
        # warm code paths. Mirrors ci.yml's smoke job.
        run: |
          set -e
          curl -s -c /tmp/dm-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"dm@darkwatch.test","password":"password"}' >/dev/null
          curl -s -c /tmp/player-cookies.txt -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"player@darkwatch.test","password":"password"}' >/dev/null
          for pass in 1 2; do
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/campaigns >/dev/null
            curl -s -b /tmp/dm-cookies.txt http://localhost:3001/api/dashboard >/dev/null
            curl -s -b /tmp/player-cookies.txt http://localhost:3001/api/auth/me >/dev/null
            curl -s -b /tmp/player-cookies.txt http://localhost:3001/api/dashboard >/dev/null
          done
          rm -f /tmp/dm-cookies.txt /tmp/player-cookies.txt
          echo "warmup complete"

      - name: Install tests dependencies (browsers baked in image)
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: cd tests && npm ci --no-audit --no-fund

      - name: Run full suite — shard ${{ matrix.shard }} of 3 (duration-balanced)
        # #2533 step 1b — the phase-4 decision, applied per-step so the JOB
        # still runs and reports honestly. Fail-open is structural: if `detect`
        # died or the expression did not resolve, this reads empty, `!= 'false'`
        # holds, and the step RUNS. Only an explicit "false" skips.
        if: ${{ needs.detect.outputs.should-run != 'false' }}
        env:
          E2E_SERVER_URL: "http://localhost:3001"
          # #2538 — pinned for the same reason as the Vite port above: this
          # was previously supplied by OMISSION from tests/playwright.config.ts,
          # so CI's target silently tracked local dev's default. Same number as
          # before; it just no longer moves when dev's does.
          E2E_BASE_URL: "http://localhost:5173"
          TEST_HOOK_SECRET: e2e-test-hook-secret
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          # #1581 — tests/helpers/db.ts (used only by 1077-hidden-monsters.spec.ts
          # for a raw combat_state read) falls back to 127.0.0.1:3397 when unset,
          # which is the local-dev address, not this job's mariadb service.
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          # #1622 — per-shard JSON report; the notify-failure job parses these for
          # failing spec titles. Written into the uploaded logs dir (Playwright
          # creates the parent). One file per shard so they don't clobber.
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/e2e-full-logs/results-shard-${{ matrix.shard }}.json
        # #2300 — NOT `--shard=N/3`. Playwright shards by TEST COUNT, which on
        # this suite produced 16.1m / 10.3m / 7.5m from near-identical counts,
        # because per-test cost correlates with filename (the newer `1xxx`/`2xxx`
        # WT specs sort first and are slow). Raising the shard count does not fix
        # that. e2e-partition.mjs partitions by MEASURED duration instead and
        # lands all three within a second of each other. It exits non-zero unless
        # its shards are an exact, non-overlapping cover of tests/e2e — this
        # replaces `--shard`'s structural completeness, so it must never degrade
        # into an allow-list (#1141).
        run: |
          set -euo pipefail
          cd tests
          PARTITION=../scripts/ci/e2e-partition.mjs
          # #2409 VERSION SKEW — this is not defensive padding, it is a real and
          # RECURRING state. The nightly deploy gate pins the tested ref to the
          # newest RELEASE TAG, but a workflow always runs from the branch's copy
          # of the YAML. So this step's script comes from `main` while the tree
          # around it is the TAG — and any file this workflow gained since that
          # tag is simply absent. Run 10184 (2026-08-18) is the proof: the shards
          # died with `Cannot find module .../e2e-partition.mjs` and blocked the
          # deploy, because v0.200.0 predates #2300. That window reopens after
          # EVERY workflow change that adds a repo-file dependency and stays open
          # until the next release, so it cannot be handled by remembering to cut
          # one.
          #
          # Degrade to Playwright's own count-based sharding instead of failing.
          # It is slower and unbalanced (~16m/10m/8m — the very thing #2300
          # fixed), but it is exactly what this job did before #2300, so an older
          # tag gets tested the way it always was. A blocked deploy is a far worse
          # outcome than a slow one.
          if [ -f "$PARTITION" ]; then
            # Assign first: under `set -e` a failing command substitution aborts
            # an ASSIGNMENT, but not a substitution used inline as an argument —
            # there it would silently expand to nothing and run the ENTIRE suite
            # in all three jobs. The explicit empty check is the second belt.
            ARGS=$(node "$PARTITION" --shard=${{ matrix.shard }} --total=3)
            if [ -z "$ARGS" ]; then
              echo "e2e-partition produced no spec filters for shard ${{ matrix.shard }}" >&2
              exit 1
            fi
            # Unquoted on purpose: bash word-splits the ~50 filter args. (zsh
            # would not — see the script header.)
            ./node_modules/.bin/playwright test $ARGS --reporter=line,json
          else
            echo "::warning::e2e-partition.mjs is absent at this ref — falling back to count-based --shard=${{ matrix.shard }}/3. Expected when the nightly tests a release tag older than #2300; the shards will be unbalanced and slower."
            ./node_modules/.bin/playwright test --shard=${{ matrix.shard }}/3 --reporter=line,json
          fi

      - name: Collect logs for artifact
        if: ${{ always() && needs.detect.outputs.should-run != 'false' }}
        run: |
          mkdir -p /tmp/e2e-full-logs
          cp /tmp/server.log /tmp/e2e-full-logs/server.log 2>/dev/null || echo "(no server log)" > /tmp/e2e-full-logs/server.log
          cp /tmp/vite.log /tmp/e2e-full-logs/vite.log 2>/dev/null || echo "(no vite log)" > /tmp/e2e-full-logs/vite.log
          if [ -d tests/playwright-report ]; then
            cp -r tests/playwright-report /tmp/e2e-full-logs/playwright-report
          fi
          if [ -d tests/test-results ]; then
            cp -r tests/test-results /tmp/e2e-full-logs/test-results
          fi
          echo "Log collection complete. Contents:"
          find /tmp/e2e-full-logs -type f | head -40

      - name: Upload E2E full-suite logs artifact
        # #2533 step 1b — nothing was collected on the cheap path, so an
        # `always()` upload would run against an empty directory.
        if: ${{ always() && needs.detect.outputs.should-run != 'false' }}
        # v4 unsupported on Forgejo's actions backend; pin v3 (see ci.yml's smoke job).
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          # #2300 — per-shard name. The three shard jobs each upload their own
          # server.log / vite.log / results-shard-N.json; a shared artifact name
          # would have them clobbering each other's identically-named files.
          name: e2e-full-logs-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: /tmp/e2e-full-logs/
          retention-days: 14

      - name: Dump server and vite logs on failure (inline)
        # #2533 step 1b — on the cheap path there are no logs to dump, and a
        # `failure()` step that errors would red the job it is debugging.
        if: ${{ failure() && needs.detect.outputs.should-run != 'false' }}
        run: |
          echo "=== server log (last 200 lines) ==="
          tail -n 200 /tmp/server.log || echo "no server log"
          echo "=== vite log (last 200 lines) ==="
          tail -n 200 /tmp/vite.log || echo "no vite log"

  # notify-failure — #1622. Every e2e-full failure (nightly deploy gate, the
  # midday cron, a manual dispatch, or the future run-e2e-full label) self-
  # attributes onto a rolling Forgejo issue so morning triage starts with "these
  # specs, these commits" instead of archaeology — and so diagnosis never depends
  # on Forgejo log archival (the 2026-07-05 23:18 red's log was never archived,
  # log_in_storage=0). Reuses the notify-main-red rolling-issue pattern (ci.yml).
  # badge — #2533. The `e2e` shields.io badge in README.md used to be produced by
  # ci.yml's `badges` job from the `smoke` result on a push to main. Phase 3
  # retired `smoke`, and this workflow has no `push` trigger, so NOTHING measured
  # e2e on a merge any more. Rather than let the badge assert something nothing
  # checked — the tree-gate skip only ever proved `lint-typecheck` + `test` — it
  # moved here, where the whole suite actually runs.
  #
  # It therefore means: "the full suite passed against main as of the last
  # non-PR run" — the nightly deploy gate (06:00 UTC) and the midday cron
  # (19:00 UTC). Twice daily, and true.
  #
  # PR runs are excluded deliberately: they test the PR's tree, not main's.
  # `github.event_name` is the right test here even though this workflow is also
  # a `workflow_call` callee (where it reads `workflow_call`, #2496) — every
  # value except `pull_request` is a run against main, which is exactly the set
  # we want. The `detect` job above already relies on the same distinction.
  #
  # A matrix collapses to ONE `needs` key, so `needs.e2e-full.result` is the
  # AGGREGATE across all three shards (#2300 phase 1) — which is precisely the
  # "did the whole suite pass" signal the badge needs.
  badge:
    needs: [e2e-full]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    # #2572 — PINNED TO `pi`, was `ubuntu-latest`. This job ssh's to
    # DEPLOY_HOST, which resolves ONLY on m4-runner; `ubuntu-latest` round-robins
    # across three runners, so every run was a coin flip. This job is the one
    # that SURFACED the problem — it has no `continue-on-error`, unlike ci.yml's
    # `badges`, so it went red on 3 of its first 4 runs while `badges` had been
    # failing the same way and reporting green for months. See #2572.
    #
    # Deliberately kept strict (no `continue-on-error`): `badges` tolerates a
    # failed upload because a stale badge is not worth failing CI over, and that
    # is right — but one producer needs to be able to say so out loud, and this
    # job does not gate the deploy (`gates-passed` needs e2e-full/smoke-walk/test,
    # not this).
    runs-on: pi
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Only the upload script runs here; it needs no repo content beyond
          # itself. Same recipe as tree-gate (#2315).
          filter: blob:none
          sparse-checkout: |
            scripts/ci

      - name: Set up SSH for badge upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Generate + upload the e2e badge
        env:
          SUITE_RESULT: ${{ needs.e2e-full.result }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p /tmp/badges
          # `success` only. A skipped suite (the phase-4 runtime-irrelevant path)
          # or a cancelled one has measured NOTHING, and #1954 is the standing
          # reminder that a skip reports as success elsewhere — so anything that
          # is not an explicit success leaves the badge alone rather than
          # painting it green or red on no evidence.
          if [ "$SUITE_RESULT" != "success" ] && [ "$SUITE_RESULT" != "failure" ]; then
            echo "suite result '$SUITE_RESULT' measured nothing — leaving the badge untouched."
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const ok = process.env.SUITE_RESULT === 'success';
            fs.writeFileSync('/tmp/badges/e2e.json', JSON.stringify({
              schemaVersion: 1, label: 'e2e',
              message: ok ? 'passing' : 'failing',
              color: ok ? 'brightgreen' : 'red'
            }));
          "
          scripts/ci/upload-badges.sh /tmp/badges

  notify-failure:
    needs: e2e-full
    # The job itself must NEVER end "skipped": when this workflow runs as a
    # workflow_call callee (nightly-deploy's e2e-full job), Forgejo folds a
    # skipped callee job into the CALLER's aggregate as failure — a green suite
    # read as red and silently blocked the deploy (2026-07-09, two nights
    # running). So the job always runs and completes green; the real gates
    # (only on failure; not on PR-triggered runs, #1623 — the author sees the
    # failing check directly and the suspect list would include unmerged
    # commits) live on every STEP below instead.
    #
    # #2011 — every STEP gate below reads `needs.*.result`, NOT
    # `needs.e2e-full.result`. Under workflow_call (the nightly-deploy path)
    # Forgejo namespaces the callee's jobs — the logs show `e2e-full.e2e-full`
    # and `e2e-full.notify-failure` — so the `needs` context has no key called
    # `e2e-full` and `needs.e2e-full.result` is null even when that job just
    # failed. It silently skipped every step on all eight nightly reds between
    # 2026-07-13 and 2026-07-28 (1-4s, reported green), so the rolling issue
    # only ever heard from the standalone cron. `needs.*` is a wildcard over
    # the context's VALUES, so it survives the renaming; the explicit
    # comparison is kept alongside it because that is the form proven to work
    # on the standalone path. This job has exactly one `needs`, so the wildcard
    # can't widen what it matches.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # github.token needs these to read prior runs (last-green) + file the rolling
    # issue. secrets.FORGEJO_TOKEN (a PAT) is kept as a fallback — it can write
    # issues (label-merged-issues proves it) but lacks read scope on the issues
    # list / actions API, which is what 403'd the first prove run.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      # #2303 — the gate here is now event-only, NOT result-gated. The flaky
      # report has to run on GREEN runs: a spec that fails then passes on retry
      # leaves the suite green, which is exactly the case nothing was reporting.
      # The failure-only gates stay on the suspect-list steps below, so a green
      # run does this checkout + artifact download and nothing else.
      #
      # Cost of the widening is small and got smaller: since #2315/#2340 this
      # checkout is `blob:none` + sparse (~3.7M, ~2.2s) rather than the whole
      # ~96M tip.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: ${{ github.event_name != 'pull_request' }}
        # #2303 — REQUIRED by the widening above, not decoration. While this
        # checkout only ran on already-red runs, a failure here cost nothing
        # extra. Now it runs on every non-PR run, including green ones — and
        # under the nightly-deploy `workflow_call` path a failed step reds this
        # job, which reds the caller's aggregate, which blocks the deploy. That
        # is the exact incident this job's header documents twice. Without this
        # line a transient git fetch on a GREEN nightly could block a deploy.
        # Degradation is already safe: no repo → the flaky step fails under its
        # own continue-on-error → the dashboard is stale for one night and
        # self-heals; the red-path suspect list already degrades to
        # "(git history unavailable)".
        continue-on-error: true
        with:
          # #2409 — this job reports on the ref that was TESTED, so it must
          # check out the same one the suite did.
          ref: ${{ inputs.ref }}
          # git log <last-green>..HEAD needs the merge-base history.
          #
          # #1958 — DELIBERATELY still fetch-depth: 0, unlike ship-guard and
          # visual-regression's `detect`. Those three only need a changed-file
          # list versus origin/main, so a bounded fetch plus a merge-base
          # deepen is sufficient. This one walks back to an ARBITRARY earlier
          # commit (the last green run), and there is no bound that is safe in
          # general — a deepen loop targeting an unknown depth would either
          # under-fetch and silently truncate the commit list, or defeat the
          # point. It also runs only on failure, only off pull_request, and has
          # a 10-minute budget. Revisit if it starts timing out.
          fetch-depth: 0
          # #2315 — depth STAYS 0 for the reason above; what changes is that
          # it no longer drags blobs. This job only runs `git log --oneline`
          # (commit subjects for the suspect list) and an inline Python block
          # over a downloaded artifact — it opens no tracked file. Unfiltered,
          # `fetch-depth: 0` is the most expensive checkout in the fleet: it
          # pulls EVERY historical version of the 43.3M of visual baselines and
          # 19M of brochure PNGs. `blob:none` keeps the full commit graph the
          # last-green walk needs while skipping all of it.
          #
          # `filter` alone would be a no-op with a full working tree (checkout
          # lazily re-fetches every tip blob), hence the sparse list; `scripts/ci`
          # is a small real path chosen only to stop the tree materialising.
          filter: blob:none
          sparse-checkout: |
            scripts/ci

      - name: Download the e2e-full report artifact
        # #2303 — event-only for the same reason as the checkout above: the
        # shard JSONs are uploaded `if: always()`, so a GREEN run's artifact
        # exists and is the only place the flaky list is recorded.
        if: ${{ github.event_name != 'pull_request' }}
        # v4 unsupported on Forgejo's actions backend; pin v3 (see ci.yml).
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        continue-on-error: true # a crash before upload must not muzzle the notify
        with:
          # #2300 — `name` is deliberately OMITTED. There are now three shard
          # artifacts and v3 has no `pattern`/`merge-multiple` (v4 is unsupported
          # on Forgejo's backend), so downloading all of them is the only option.
          # That "creates an extra directory for each artifact" — proven on probe
          # run 10147 — i.e. results land at
          # /tmp/e2e-full-logs/e2e-full-logs-<run>-shard-N/results-shard-N.json.
          # flaky-report.mjs searches one level deep for exactly this reason.
          path: /tmp/e2e-full-logs

      # #2303 — the flaky dashboard. Runs on EVERY non-PR run, green or red,
      # because a spec that fails then passes on retry leaves the suite green
      # and was recorded nowhere a human would see. Node (not the inline python
      # used below) so the logic can be a unit-tested pure module —
      # scripts/ci/flaky-report-core.mjs, 18 cases.
      - name: Setup Node.js (flaky report)
        if: ${{ github.event_name != 'pull_request' }}
        # Same reason as the checkout: this now runs on green runs too, so it
        # must not be able to red a green nightly.
        continue-on-error: true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Report specs that only passed on retry
        if: ${{ github.event_name != 'pull_request' }}
        # The script never exits non-zero — see its header. This job's own
        # header records that a step failing here has twice silently blocked the
        # nightly deploy, so a reliability report must not become the
        # reliability problem. `continue-on-error` as a second layer.
        continue-on-error: true
        env:
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_LOG_DIR: /tmp/e2e-full-logs
          RUN_LABEL: run-${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: node scripts/ci/flaky-report.mjs

      - name: Comment the rolling "e2e-full is red" issue
        if: ${{ (needs.e2e-full.result == 'failure' || contains(needs.*.result, 'failure')) && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          # #2409 — when the suite was pinned to a release tag, `github.sha` /
          # `github.ref_name` describe the CALLER (main's tip), not the code that
          # was actually tested. Reporting those would point the next
          # investigation at the wrong commit — the same defect #2435 records for
          # this marker's suspect range. Prefer the tested ref when there is one.
          TESTED_REF: ${{ inputs.ref }}
        run: |
          python3 - <<'PY'
          import os, json, glob, subprocess
          api, repo = os.environ["API_URL"], os.environ["REPO"]
          server, run_number, run_id = os.environ["SERVER_URL"], os.environ["RUN_NUMBER"], os.environ["RUN_ID"]
          sha, event, ref = os.environ["SHA"], os.environ.get("EVENT", "?"), os.environ.get("REF", "?")
          # #2409 — a pinned run tested a TAG, not the caller's tip. Report what
          # ran, and resolve its real sha from the checkout (this job checks out
          # the same ref), so the marker names the commit that actually failed.
          tested_ref = os.environ.get("TESTED_REF", "").strip()
          if tested_ref:
              ref = tested_ref
              try:
                  out = subprocess.run(["git", "rev-parse", tested_ref],
                                       capture_output=True, text=True, timeout=15)
                  if out.returncode == 0 and out.stdout.strip():
                      sha = out.stdout.strip()
              except Exception:
                  pass  # keep the caller's sha rather than lose the marker entirely
          run_url = f"{server}/{repo}/actions/runs/{run_number}"
          MARKER = "<!-- e2e-full-red -->"

          # HTTP via curl, NOT urllib: forge.example.com is behind Cloudflare,
          # which fingerprint-blocks Python-urllib with a 403 "error code: 1010"
          # (the first prove run's failure) — curl passes, which is why the other
          # CI API callers (label-merged-issues, diff-coverage) use it. The
          # full-scope PAT is tried first (proven to read tasks/issues + write);
          # github.token is a fallback (scoped by the permissions block above).
          TOKENS = [("secrets.FORGEJO_TOKEN", os.environ.get("FALLBACK_TOKEN", "")),
                    ("github.token", os.environ.get("GH_TOKEN", ""))]
          TOKENS = [(n, t) for n, t in TOKENS if t]
          print(f"api_url={api} repo={repo} tokens available: {[n for n, _ in TOKENS]}")

          def call(method, path, payload=None):
              # Try each token; return (parsed_json_or_{}, token_name) on 2xx, else (None, None).
              for name, tok in TOKENS:
                  cmd = ["curl", "-sS", "-X", method,
                         "-H", f"Authorization: token {tok}",
                         "-H", "Content-Type: application/json",
                         "-w", "\n%{http_code}", f"{api}/repos/{repo}{path}"]
                  if payload is not None:
                      cmd += ["--data", json.dumps(payload)]
                  r = subprocess.run(cmd, capture_output=True, text=True)
                  out = r.stdout
                  nl = out.rfind("\n")
                  code, raw = (out[nl + 1:].strip(), out[:nl]) if nl >= 0 else (out.strip(), "")
                  if code.startswith("2"):
                      try:
                          return (json.loads(raw) if raw.strip() else {}, name)
                      except Exception:
                          return ({}, name)
                  print(f"  {method} {path} via {name}: HTTP {code or '?'} {raw[:150]}")
              return (None, None)

          # 1. Failing spec titles from the per-shard Playwright JSON reports.
          def walk(suite, out):
              for spec in suite.get("specs", []):
                  if not spec.get("ok", True):
                      f, t = spec.get("file", ""), spec.get("title", "")
                      out.append(f"{f} › {t}" if f else t)
              for child in suite.get("suites", []):
                  walk(child, out)
          failing, parsed_any = [], False
          # #2300 — RECURSIVE. The three shards are parallel jobs now, so each
          # uploads its own artifact and `download-artifact` (v3, no `name` —
          # see that step) nests every one in its own subdirectory:
          #   /tmp/e2e-full-logs/e2e-full-logs-<run>-shard-N/results-shard-N.json
          # A flat glob silently found nothing and this marker filed itself with
          # "no report artifact to parse" — losing the failing-spec list, which
          # is the entire reason #1622 exists. `**` + recursive=True still matches
          # the flat layout, so this works either way.
          for path in sorted(glob.glob("/tmp/e2e-full-logs/**/results-shard-*.json", recursive=True)):
              try:
                  with open(path) as fh:
                      report = json.load(fh)
                  parsed_any = True
                  for suite in report.get("suites", []):
                      walk(suite, failing)
              except Exception as e:
                  print(f"warn: could not parse {path}: {e}")
          seen = set()
          failing = [s for s in failing if not (s in seen or seen.add(s))]

          # 2. Last-green e2e-full head_sha via the Forgejo actions API (newest-first).
          last_green = None
          data, _ = call("GET", "/actions/tasks?limit=50")
          if isinstance(data, dict):
              for t in data.get("workflow_runs", data.get("tasks", [])):
                  if t.get("name") == "e2e-full" and t.get("status") == "success" and t.get("head_sha"):
                      last_green = t["head_sha"]
                      break
          if last_green is None:
              print("last-green: unresolved (actions read failed or no prior green) — using recent commits")

          # 3. Suspect commits.
          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)
          suspects, range_desc = "", ""
          if last_green:
              r = git("log", f"{last_green}..HEAD", "--oneline", "-n", "40")
              if r.returncode == 0:
                  suspects = r.stdout.strip() or "(no commits since last green — likely flake/infra, not a code regression)"
                  range_desc = f"`{last_green[:12]}..{sha[:12]}` (since last green e2e-full)"
          if not suspects:
              r = git("log", "--oneline", "-n", "15")
              suspects = r.stdout.strip() or "(git history unavailable)"
              range_desc = "most recent 15 commits (no last-green reference resolved)"

          # 4. Compose + file/update the rolling issue.
          if failing:
              specs_block = "\n".join(f"- `{s}`" for s in failing[:50])
              if len(failing) > 50:
                  specs_block += f"\n- …and {len(failing) - 50} more"
              specs_hdr = f"**Failing specs ({len(failing)}):**"
          elif parsed_any:
              specs_block = "_(report parsed, no failing spec recorded — likely an infra/setup step failed before/after the suite; see run logs)_"
              specs_hdr = "**Failing specs:**"
          else:
              specs_block = "_(no report artifact to parse — the run likely died before the suite; see run logs)_"
              specs_hdr = "**Failing specs:**"
          body = (
              f"{MARKER}\n\n"
              f"\U0001f534 **e2e-full is red** — run [#{run_number}]({run_url}) · trigger `{event}` · ref `{ref}`\n\n"
              f"**Commit:** `{sha[:12]}`\n\n"
              f"{specs_hdr}\n{specs_block}\n\n"
              f"**Suspect commits** — {range_desc}:\n```\n{suspects}\n```\n\n"
              f"_Auto-filed by e2e-full.yml `notify-failure` (#1622). Full report artifacts: `e2e-full-logs-{run_id}-shard-1|2|3`. "
              f"Fix forward, then re-run e2e-full — this issue auto-updates on the next red._"
          )
          # Find the existing rolling issue (best-effort — if the list read fails,
          # fall through to creating a fresh one rather than crashing).
          #
          # #2303 — two fixes here, both found the hard way on 2026-08-10.
          #
          # (1) THE MARKER MUST LEAD THE BODY, not merely appear in it. An issue
          #     that *discusses* a marker contains it — #2321 and #2303 both quote
          #     `<!-- e2e-full-red -->` inside backticks — so the old substring
          #     test matched a design ticket, and the next red would have
          #     commented there while the real alert was never filed. That is the
          #     #2010/#2011 "a stale marker eats tomorrow's real red" failure
          #     arriving through a different door. Not hypothetical: the sibling
          #     flaky reporter made this exact mistake on its first live run and
          #     PATCHed #2303's body away. Every body this job creates begins
          #     f"{MARKER}\n\n", so anchoring at the start is both correct and
          #     unambiguous. The tested equivalent is pickDashboard() in
          #     scripts/ci/flaky-report-core.mjs.
          # (2) PAGINATE. One page is 50 issues against 280 open, so the rolling
          #     issue falls off page 1 within days — and a rolling issue that
          #     can't be found is re-created every red night, which quietly turns
          #     "rolling" into "a new issue each time".
          issues = []
          for page in range(1, 9):
              batch, _ = call("GET", f"/issues?state=open&type=issues&limit=50&page={page}")
              if not isinstance(batch, list):
                  break
              issues.extend(batch)
              if len(batch) < 50:
                  break
          existing = next(
              (i["number"] for i in issues if (i.get("body") or "").lstrip().startswith(MARKER)),
              None,
          )
          if existing:
              res, name = call("POST", f"/issues/{existing}/comments", {"body": body})
              action = f"commented on existing issue #{existing}"
          else:
              res, name = call("POST", "/issues", {"title": "\U0001f534 e2e-full is red", "body": body})
              action = f"filed a new issue #{res.get('number')}" if isinstance(res, dict) else "create failed"
          if res is not None:
              print(f"notify-failure: {action} (via {name})")
          else:
              print("ERROR: could not post the e2e-full-red issue with any available token.\n"
                    "----- intended issue body -----\n" + body)
              raise SystemExit(1)
          PY
