name: Renovate

# Self-hosted Renovate run (#414). Watches upstream releases and files one PR
# per update for: actions/* SHA pins, npm deps across all four workspaces, and
# the darkwatch-ci-playwright image tag (kept in lockstep with @playwright/test
# via the custom.regex manager in renovate.json).
#
# Repo-level behaviour lives in /renovate.json; this workflow only configures
# Renovate (platform, endpoint, which repo, token, author) and decides WHEN it runs.
#
# ── ONE-TIME SETUP (not automatable from here) ───────────────────────────────
#   Runs as my own account for now (RENOVATE_GIT_AUTHOR below = aaron@3d.ca).
#   1. Generate a Personal Access Token on this Forgejo instance with ALL of:
#        user          (read)        — Renovate's init `GET /user`; missing this
#                                      throws "Authentication failure" before any work
#        repository    (read+write)  — branches & PRs
#        issue         (read+write)  — the dependency dashboard
#        organization  (read)        — labels / teams (Forgejo >= 1.20)
#      A token missing `user` read is the classic init auth failure.
#   2. Add it to this repo's Actions secrets as `RENOVATE_TOKEN`
#      (Settings → Actions → Secrets).
#   3. (Optional but recommended — #1121) Create a github.com PAT (classic, NO
#      scopes — public read is enough) and add it as the `GITHUB_COM_TOKEN`
#      secret. Without it, github.com version/release lookups for actions/* and
#      node are unauthenticated (60 req/hr) and runs log a rate-limit warning.
#   Until RENOVATE_TOKEN exists the scheduled run no-ops at the auth step.
#   Migrating to a dedicated renovate-bot user later is tracked in #1115.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Weekly, Monday 09:00 UTC ≈ 05:00 America/Toronto (EDT). Forgejo cron is
    # fixed-UTC, so it lands at 04:00 ET during winter (EST). renovate.json sets
    # the display timezone for PR-scheduling text only.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        # Manual dispatch only. Defaults OFF — a manual run does real work
        # (opens PRs) just like the schedule, now that the config is verified.
        # Check the box for a consequence-free, log-only preview. The scheduled
        # run never sees this input, so it's always a real run.
        description: "Dry run — log only, create no branches/PRs/issues"
        type: boolean
        default: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    # #2465 — PIN THE IMAGE, because `ubuntu-latest` does not mean the same thing
    # on every runner. The label is carried by m4-runner AND Global-Falcon-01/02,
    # and they resolve it differently: the m4 gives `node:lts` (Debian bookworm,
    # git 2.39.5 — measured by the probe below), Falcon's give `node:20-bullseye`,
    # and Debian bullseye ships git 2.30, which is BELOW Renovate's minimum.
    # (The floor sits between the two: 2.30 is rejected, 2.39.5 is accepted.)
    # The job runs inside that container, and it is the
    # CONTAINER's git that Renovate checks, so the weekly run died with
    # `ERROR: Git version needs upgrading` whenever it happened to land on a Falcon
    # box (tasks 15959, 14275, 14280) and passed whenever it landed on the m4
    # (17484). Nothing in the repo changed between the green and red weeks — it
    # was a coin flip on runner assignment.
    #
    # Pinning here fixes every runner at once and keeps the job eligible for the
    # whole pool. The alternative — narrowing `runs-on` to a runner whose
    # ubuntu-latest happens to be new enough — would tie a weekly job to a single
    # host, and #2310's rule is explicit that a toggleable runner must never be
    # the sole owner of a label (turning it off WEDGES the job rather than
    # failing it).
    container: node:lts@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    timeout-minutes: 20 # #1263 — Renovate clones repos + files PRs; ~5-15 min typical
    steps:
      # Records what the pin actually produced. Renovate's git-version failure
      # names no version and no image, so a bare red told you nothing about which
      # box you were on — this makes the next occurrence self-diagnosing (same
      # motive as the debug-log artifact below, #1632).
      - name: Environment probe
        run: |
          echo "image:  $(grep PRETTY_NAME /etc/os-release | cut -d'"' -f2)"
          echo "git:    $(git --version)"
          echo "node:   $(node -v)"
          echo "arch:   $(uname -m)"

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_COM_TOKEN }} # optional — avoids github.com rate-limiting (#1121)
          RENOVATE_PLATFORM: forgejo # native Forgejo platform (host is Forgejo 15.0.0)
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "aaron <aaron@3d.ca>" # personal token for now; bot user tracked in #1115
          # Empty on the scheduled run (no input) → real run; 'full' when the
          # manual-dispatch dryRun box is checked → log-only, no writes.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # binarySource=global — use the npm already on PATH (setup-node above),
          # NOT Renovate's default 'install' (#1632). The default assumes a
          # Containerbase image where Renovate downloads/provisions its own npm at
          # runtime; this is a plain `npx renovate` on a setup-node runner, so on
          # a lockfile rebuild that needs a fresh registry resolution the
          # runtime-provisioned npm failed ("Artifact file update failure"),
          # leaving a sub-workspace package.json out of sync with its lockfile and
          # cascading `npm ci` across every job. The metadata phase uses
          # Renovate's own HTTP client, which is why version *detection* worked
          # while only the lockfile *artifact* step failed. See #1628 (first hit).
          RENOVATE_BINARY_SOURCE: global
          LOG_LEVEL: info
          # Full debug log to a file (#1632) — stdout stays at info (readable),
          # but the artifact step below captures a complete debug ndjson so the
          # next artifact failure is self-diagnosing even if Forgejo's flaky
          # post-run log archival (log_in_storage) drops the run log.
          LOG_FILE: /tmp/renovate-log.ndjson
          LOG_FILE_LEVEL: debug
          LOG_FILE_FORMAT: json
        # Renovate clones the repo itself and reads /renovate.json as the repo
        # config — no checkout step needed. Skips cleanly when the token is unset.
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::warning::RENOVATE_TOKEN secret not set — see one-time setup in this workflow file. Skipping."
            exit 0
          fi
          if [ -n "$RENOVATE_DRY_RUN" ]; then
            echo "::notice::Dry-run mode — computing updates, creating NO branches/PRs/issues."
          fi
          npx --yes renovate

      - name: Upload Renovate debug log
        # if: always() so a failed/partial run still yields the log that explains
        # it. if-no-files-found: ignore covers the token-unset early-exit (no log
        # written). Pinned v3.2.1 — v4 is unsupported on Forgejo's actions backend
        # (see ci.yml / e2e-full.yml).
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: renovate-log-${{ github.run_id }}
          path: /tmp/renovate-log.ndjson
          if-no-files-found: ignore
          retention-days: 30
