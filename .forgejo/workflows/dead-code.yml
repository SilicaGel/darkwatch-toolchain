name: Dead-code report (knip)

on:
  pull_request:
    branches: [main]

# Cancel superseded PR runs (#1617).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # #1263 — 4-workspace npm install + knip scan; ~5-8 min typical
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            tests/package-lock.json

      # Install every workspace knip needs to resolve config files (vite/vitest)
      # and walk source. The `tests` workspace in knip.json declares
      # playwright.config.ts as an entry, which imports @playwright/test — so
      # tests/ deps MUST be installed or knip crashes with a module load error
      # (#970). Failures here just skip the comment — non-blocking.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd client && npm ci --no-audit --no-fund)
          (cd server && npm ci --no-audit --no-fund)
          (cd tests && npm ci --no-audit --no-fund)

      # #845 — hard gate. The script posts/updates the PR comment, then exits
      # non-zero if knip's total > 0 (baseline is zero since #401). Infra
      # failures (knip crash, unreachable Forgejo, missing env) still exit 0 —
      # only real dead code fails the build. Escape hatch: put
      # `[allow-dead-code]` in the PR title (passed through as PR_TITLE).
      - name: Run knip + post PR comment + gate
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/dead-code-comment/run-and-post.mjs
