name: Ship guard

# #1116 — blocking guard for PRs that resolve issues but skip the `/ship`
# housekeeping. If the PR body carries one or more `Ready #N` lines, this
# requires BOTH a `docs/CHANGELOG.md` change AND a `## Test plans` section with
# a `### #N` block per Ready line. PRs with no `Ready #N` lines are a no-op
# pass (pure-chore PRs don't need a changelog). Escape hatch: `[skip-ship-guard]`
# in the PR title.
#
# The logic is a pure, fully-tested module (scripts/ship-guard/check.mjs); this
# workflow is the thin runner that hands it the PR body/title (from the event
# payload) and the changed-file list (git diff origin/main...HEAD). It's a dumb
# presence check, deliberately — it never inspects changelog wording or test
# plan reachability (that stays a human / qa-check concern).

on:
  pull_request:
    branches: [main]
    # #1775 — include `edited` so a PR body PATCHed in AFTER creation re-fires
    # these guards against the FRESH payload. Without it the default set
    # (opened/synchronize/reopened) means a `## Test plans` / `## Acceptance
    # reconciliation` block added post-open is invisible until the next push —
    # the stale-event-payload bug. Covers all three jobs in this file.
    types: [opened, synchronize, reopened, edited]

# Cancel superseded PR runs (#1617).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ship-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # #1263 — checkout + git diff + node script; ~2-3 min typical
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 50

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # #1958 — resolve a merge-base WITHOUT the full-history fetch.
      #
      # `fetch-depth: 0` pulls every branch AND every tag at full depth. That
      # packfile is what blew the budget: 4m59s against a 5-minute job on
      # PR #1974 (task 13916), and the same shape killed visual-regression's
      # `detect`. This job only needs a changed-file list, so take a shallow
      # head and deepen just enough to reach the merge-base.
      # Retry-hardened, unshallow-fallback resolver (see the script for the
      # #1958 budget + #2317 merge-commit-flake rationale). BLOCKING guard: an
      # unresolvable base is a red (the script exits 1, propagated here) — a diff
      # off an incomplete graph would pass the guard vacuously, worse than a red.
      - name: Ensure a merge-base with origin/main
        run: bash scripts/ship-guard/ensure-merge-base.sh

      # No npm dependencies — the guard is Node built-ins only. PR body/title
      # come from the event payload; the script reads the diff from git itself.
      - name: Check ship housekeeping
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ship-guard/check.mjs

  # #842 — workflow-change hygiene REMINDER. Deliberately a WARNING, never a
  # hard fail: a hard gate on `.forgejo/workflows/` changes risks wedging
  # legitimate future workflow PRs (e.g. a one-line YAML fix), which is exactly
  # the failure mode the issue warns against. This job always passes; it just
  # prints a conspicuous reminder of the policy (CLAUDE.md / HANDBOOK): any
  # workflow change must be exercised on a draft PR or workflow_dispatch run on
  # the branch before merge — no "merge to test in production" for CI YAML.
  workflow-change-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # #1263 — checkout + git diff only; ~1-2 min typical
    # #2324 — belt-and-suspenders on top of the advisory design above: a
    # `|| echo` inside a step only catches a non-zero *exit*, not a killed
    # process or a job-level timeout (both observed on #2323 when the
    # capacity-loaded Pi (#2315) made the `--unshallow` fallback run slow).
    # `continue-on-error` makes the JOB itself structurally unable to fail the
    # workflow, regardless of which step or how it fails.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 50
          # #2315 — this job only ever needs a changed-FILE-LIST, so it needs
          # commits and trees but never file contents. Measured against the
          # live server: a plain `--depth=50` fetch of this repo transfers
          # 81M (most of it the 43M of visual baselines at the tip, plus every
          # regeneration of them in history). With a blob:none promisor remote
          # plus a sparse working tree it is 1.6M — a ~50x cut on a job whose
          # budget is 5 minutes.
          #
          # That budget is why this matters: on 2026-08-10 (PR #2332) the fetch
          # alone took 3m17s of the 5 minutes and the job was killed at exactly
          # 5m00s. The `context deadline exceeded` reading SUMMARY.md over
          # docker.sock that shows up in the log is the teardown symptom of
          # that kill, not the cause — which is why re-running sometimes
          # "fixed" it and no amount of merge-base hardening (#2314, #2317)
          # ever did.
          #
          # `filter` alone is NOT enough: with a full working tree the checkout
          # lazily re-fetches every tip blob and you land back at 82M. The
          # sparse list is what keeps it small, so it must stay minimal —
          # `scripts/ship-guard` because the next step executes a script from
          # it, and `.forgejo/workflows` defensively for future steps (the
          # `git diff` itself reads trees, not the working tree).
          #
          # The filter also protects the expensive fallback: ensure-merge-base
          # can escalate to `--unshallow` / `--deepen=100000`, which on an
          # unfiltered repo drags the entire history of every regenerated PNG.
          # A promisor remote keeps even that path blob-free.
          filter: blob:none
          sparse-checkout: |
            scripts/ship-guard
            .forgejo/workflows

      # #1958 — resolve a merge-base WITHOUT the full-history fetch.
      #
      # `fetch-depth: 0` pulls every branch AND every tag at full depth. That
      # packfile is what blew the budget: 4m59s against a 5-minute job on
      # PR #1974 (task 13916), and the same shape killed visual-regression's
      # `detect`. This job only needs a changed-file list, so take a shallow
      # head and deepen just enough to reach the merge-base.
      # Same shared resolver, but ADVISORY (#1775): this reminder job must never
      # red the PR, so a non-zero exit is ignored — worst case the reminder is
      # incomplete. #2317's retries + unshallow fallback make an unresolved base
      # rare in the first place.
      - name: Ensure a merge-base with origin/main
        run: |
          bash scripts/ship-guard/ensure-merge-base.sh \
            || echo "::notice::workflow-change-reminder: merge-base unresolved after unshallow — advisory reminder may be incomplete (#2317)."

      - name: Remind about workflow-change hygiene
        run: |
          # Resolve the diff base: prefer origin/main, fall back to local main.
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE=origin/main
          elif git rev-parse --verify main >/dev/null 2>&1; then
            BASE=main
          else
            echo "::notice::workflow-change-reminder: no main ref to diff against — skipping."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE...HEAD" | grep '^\.forgejo/workflows/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No .forgejo/workflows/ changes in this PR — nothing to remind."
            exit 0
          fi
          echo "::warning::This PR changes CI workflow YAML. Per CLAUDE.md / HANDBOOK policy,"
          echo "::warning::exercise it on a draft PR or a workflow_dispatch run on this branch"
          echo "::warning::and confirm at least one green run BEFORE merging — no 'merge to test"
          echo "::warning::in production' for CI YAML. (#842) Changed files:"
          echo "$CHANGED" | sed 's/^/::warning::  - /'
          # Intentionally always exit 0 — this is a reminder, not a gate.
          exit 0

  # #2297 — acceptance-reconciliation gate (WARN-first). The `/ship` skill
  # (Step 4.6) emits a `## Acceptance reconciliation` block that reconciles each
  # `Ready #N`'s keyed `## Acceptance` checklist against the diff. This job
  # re-checks that MECHANICALLY, so a session that loaded an older skill can't
  # silently skip the reconciliation (the #2294 bypass a skill instruction alone
  # can't stop). A-checks (block present, bullets well-formed) are offline;
  # B-checks (every keyed acceptance item addressed, every `deferred:#M` still
  # open) fetch the issue bodies. Whether a `met` bullet is actually satisfied
  # stays a human / qa-check judgment — deliberately not checked here.
  #
  # WARNING only for now (never sets RECONCILE_ENFORCE) so in-flight PRs from
  # pre-format sessions aren't insta-redded; flip to blocking by adding
  # `RECONCILE_ENFORCE: "1"` once the format has proven out on a few PRs.
  # API reads use github.token (same pattern as dead-code.yml / supply-chain.yml),
  # via curl — a urllib/fetch call Cloudflare-403s (#1620). Escape hatch:
  # `[skip-ship-guard]` in the PR title, matching the blocking guard above.
  acceptance-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # #1263 — checkout + a few API GETs + a node script.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1 # no git history needed — reads the PR body + issue API

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Acceptance reconciliation (warn-first)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PR_TITLE" in
            *"[skip-ship-guard]"*)
              echo "reconcile: [skip-ship-guard] in PR title — skipped."
              exit 0
              ;;
          esac
          # Numbers to fetch = Ready #N ∪ every deferred:#M target.
          NUMS=$(node scripts/ship-guard/reconcile.mjs --list)
          if [ -z "$NUMS" ]; then
            echo "reconcile: no Ready #N lines — nothing to reconcile."
            exit 0
          fi
          DIR=$(mktemp -d)
          API="https://forge.example.com/api/v1/repos/aaron/darkwatch/issues"
          for N in $NUMS; do
            code=$(curl -sS -o "$DIR/$N.json" -w '%{http_code}' \
              -H "Authorization: token $FORGEJO_TOKEN" "$API/$N" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::notice::reconcile: could not fetch issue #$N (HTTP $code) — its completeness/liveness degrades to a notice."
              rm -f "$DIR/$N.json"
            fi
          done
          # No RECONCILE_ENFORCE → warnings, exit 0. Flip by adding it to `env:`.
          ISSUE_DIR="$DIR" node scripts/ship-guard/reconcile.mjs --check
