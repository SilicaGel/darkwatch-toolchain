name: Ship guard

# #1116 — blocking guard for PRs that resolve issues but skip the `/ship`
# housekeeping. If the PR body carries one or more `Ready #N` lines, this
# requires BOTH a `docs/CHANGELOG.md` change AND a `## Test plans` section with
# a `### #N` block per Ready line. PRs with no `Ready #N` lines are a no-op
# pass (pure-chore PRs don't need a changelog). Escape hatch: `[skip-ship-guard]`
# in the PR title.
#
# The logic is a pure, fully-tested module (scripts/ship-guard/check.mjs); this
# workflow is the thin runner that hands it the PR body/title (from the event
# payload) and the changed-file list (git diff origin/main...HEAD). It's a dumb
# presence check, deliberately — it never inspects changelog wording or test
# plan reachability (that stays a human / qa-check concern).

on:
  pull_request:
    branches: [main]

# Cancel superseded PR runs (#1617).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ship-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # #1263 — checkout + git diff + node script; ~2-3 min typical
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 50

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # #1958 — resolve a merge-base WITHOUT the full-history fetch.
      #
      # `fetch-depth: 0` pulls every branch AND every tag at full depth. That
      # packfile is what blew the budget: 4m59s against a 5-minute job on
      # PR #1974 (task 13916), and the same shape killed visual-regression's
      # `detect`. This job only needs a changed-file list, so take a shallow
      # head and deepen just enough to reach the merge-base.
      - name: Ensure a merge-base with origin/main
        run: |
          set -e
          git fetch --no-tags --depth=50 origin +refs/heads/main:refs/remotes/origin/main
          for extra in 150 500 2000; do
            git merge-base origin/main HEAD >/dev/null 2>&1 && break
            git fetch --no-tags --deepen="$extra" origin +refs/heads/main:refs/remotes/origin/main
          done
          # Fail LOUD if it still can't be reached. A shallow graph makes
          # `git diff origin/main...HEAD` return NOTHING rather than erroring —
          # so a guard would pass vacuously, which is worse than a red build.
          git merge-base origin/main HEAD >/dev/null 2>&1 || {
            echo "::error::no merge-base with origin/main after deepening — refusing to diff an incomplete graph"
            exit 1
          }

      # No npm dependencies — the guard is Node built-ins only. PR body/title
      # come from the event payload; the script reads the diff from git itself.
      - name: Check ship housekeeping
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ship-guard/check.mjs

  # #842 — workflow-change hygiene REMINDER. Deliberately a WARNING, never a
  # hard fail: a hard gate on `.forgejo/workflows/` changes risks wedging
  # legitimate future workflow PRs (e.g. a one-line YAML fix), which is exactly
  # the failure mode the issue warns against. This job always passes; it just
  # prints a conspicuous reminder of the policy (CLAUDE.md / HANDBOOK): any
  # workflow change must be exercised on a draft PR or workflow_dispatch run on
  # the branch before merge — no "merge to test in production" for CI YAML.
  workflow-change-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # #1263 — checkout + git diff only; ~1-2 min typical
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 50

      # #1958 — resolve a merge-base WITHOUT the full-history fetch.
      #
      # `fetch-depth: 0` pulls every branch AND every tag at full depth. That
      # packfile is what blew the budget: 4m59s against a 5-minute job on
      # PR #1974 (task 13916), and the same shape killed visual-regression's
      # `detect`. This job only needs a changed-file list, so take a shallow
      # head and deepen just enough to reach the merge-base.
      - name: Ensure a merge-base with origin/main
        run: |
          set -e
          git fetch --no-tags --depth=50 origin +refs/heads/main:refs/remotes/origin/main
          for extra in 150 500 2000; do
            git merge-base origin/main HEAD >/dev/null 2>&1 && break
            git fetch --no-tags --deepen="$extra" origin +refs/heads/main:refs/remotes/origin/main
          done
          # Fail LOUD if it still can't be reached. A shallow graph makes
          # `git diff origin/main...HEAD` return NOTHING rather than erroring —
          # so a guard would pass vacuously, which is worse than a red build.
          git merge-base origin/main HEAD >/dev/null 2>&1 || {
            echo "::error::no merge-base with origin/main after deepening — refusing to diff an incomplete graph"
            exit 1
          }

      - name: Remind about workflow-change hygiene
        run: |
          # Resolve the diff base: prefer origin/main, fall back to local main.
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE=origin/main
          elif git rev-parse --verify main >/dev/null 2>&1; then
            BASE=main
          else
            echo "::notice::workflow-change-reminder: no main ref to diff against — skipping."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE...HEAD" | grep '^\.forgejo/workflows/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No .forgejo/workflows/ changes in this PR — nothing to remind."
            exit 0
          fi
          echo "::warning::This PR changes CI workflow YAML. Per CLAUDE.md / HANDBOOK policy,"
          echo "::warning::exercise it on a draft PR or a workflow_dispatch run on this branch"
          echo "::warning::and confirm at least one green run BEFORE merging — no 'merge to test"
          echo "::warning::in production' for CI YAML. (#842) Changed files:"
          echo "$CHANGED" | sed 's/^/::warning::  - /'
          # Intentionally always exit 0 — this is a reminder, not a gate.
          exit 0
